/* ===== leitura de romaneio (PDF/foto) com o Claude: preenche a chegada item a item ===== */
let PDFJS_P=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(PDFJS_P)return PDFJS_P;
  PDFJS_P=new Promise((res,rej)=>{
    const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=async()=>{try{
      const w=await (await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js')).text();
      window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}));res(window.pdfjsLib)
    }catch(e){rej(e)}};
    sc.onerror=()=>rej(new Error('pdfjs'));document.head.appendChild(sc);
  });
  return PDFJS_P;
}
async function paginasDoArquivo(file,max){
  if(/pdf$/i.test(file.type)||/\.pdf$/i.test(file.name)){
    const lib=await loadPdfJs(),doc=await lib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
    for(let i=1;i<=Math.min(doc.numPages,max);i++){
      const pg=await doc.getPage(i),vp0=pg.getViewport({scale:1}),sc=Math.min(2.2,1500/Math.max(vp0.width,vp0.height)*1.0+0.6),vp=pg.getViewport({scale:Math.max(1.2,sc)});
      const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
      await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      out.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85)));
    }
    return out;
  }
  return [file];
}
async function lerRomaneio(f,pend,p,tog){

  btn.disabled=true;
  try{
    let lim=null;try{lim=await SMP.limits()}catch(e){}
    if(!lim||!lim.images){say('Esta visualização não aceita imagens para leitura.');return}
    const max=Math.max(1,lim.images.maxCount||4);
    say('Preparando as páginas…');
    let pages=[];
    for(const fl of files){try{pages.push(...await paginasDoArquivo(fl,12))}catch(e){say('Não consegui abrir '+fl.name+'. Envie como foto (JPG/PNG).');return}}

      const prompt=`Você confere o recebimento de material de um pedido de compra a partir de um ROMANEIO DE ENTREGA / NOTA FISCAL (as imagens anexas são páginas do documento, parte ${k} de ${chunks.length}; pode haver anotações a mão).

Também leia do cabeçalho: número do romaneio, número da NF-e (somente se houver DANFE/NF impresso; senão ""), data (AAAA-MM-DD; use a emissão da NF, ou a data de saída/carregamento do romaneio) e valor total da NF em reais (número, ou null).
Responda SOMENTE com JSON: {"romaneio":"","nf":"","data":"","valor":null,"itens":[{"id":"","qtd":0,"nota":""}],"sem_correspondencia":[""],"alertas":[""]}. Em "nota", só escreva algo quando houver devolução/quebra/observação manuscrita relevante deste item.`;
      const r=await SMP.json(prompt,{images:ch,modelTier:'default',cache:false});

    if(res.romaneio||nfL||res.valor){

function lerBoletos(page){

  const L=[];[...page.items].sort((a,b)=>b.y-a.y||a.x-b.x).forEach(it=>{const l=L.find(l=>Math.abs(l.y-it.y)<2.5);if(l)l.its.push(it);else L.push({y:it.y,its:[it]})});

function lerBoleto(pages,ldFixa){

async function lerArquivo(file){
  const nome=file.name||'arquivo',low=nome.toLowerCase();
  try{
    if(low.endsWith('.xml')||file.type.includes('xml')){const r=lerXml(await file.text());return r?[r]:[]}
    if(low.endsWith('.pdf')||file.type==='application/pdf'){
      const pages=await pdfPages(new Uint8Array(await file.arrayBuffer()));
      if(!pages.some(p=>p.items.length))return [{tipo:'?',motivo:'PDF sem texto (digitalizado)'}];
      const out=[],nfPg=[],boPg=[];
      pages.forEach(p=>{const T=NRM(p.text);const isBol=!!linhaDigitavel(p.text)&&!/DANFE/.test(T);if(isBol)boPg.push(p);else if(/DANFE|NOTA FISCAL ELETRONICA|CHAVE DE ACESSO/.test(T)||achaChaves(p.text).length)nfPg.push(p);else if(linhaDigitavel(p.text))boPg.push(p)});

      const grupos=[];nfPg.forEach(p=>{const k=achaChaves(p.text)[0]||'';const g=grupos.find(g=>k&&g.k===k);if(g)g.p.push(p);else if(!k&&grupos.length)grupos[grupos.length-1].p.push(p);else grupos.push({k,p:[p]})});

      const vistos=new Set();boPg.forEach(p=>lerBoletos(p).forEach(b=>{if(!vistos.has(b.linha)){vistos.add(b.linha);out.push(b)}}));

}

  if(t.dataset.pap){if(!okw('cfg')){toast('Sem permissão');render();return}const cur=by('acessos',t.dataset.pap);if(cur)put('acessos',{...cur,papel:t.value});return}
  if(t.dataset.f){UI[t.dataset.f]=t.value;render()}
  else if(t.dataset.e&&t.dataset.e!=='q'){UI.E[t.dataset.e]=t.value;saveUI();render()}
  else if(t.dataset.n&&t.dataset.n!=='q'){UI.N[t.dataset.n]=t.value;saveUI();render()}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='gq'){UI.gq=t.value;UI.gopen=true;scheduleRender()}
  if(t.dataset.h){UI[t.dataset.h]=t.value;scheduleRender()}
  if(t.dataset.e==='q'){UI.E.q=t.value;saveUI();scheduleRender()}
  if(t.dataset.n==='q'){UI.N.q=t.value;saveUI();scheduleRender()}
  if(t.dataset.dbq){UI.dbq=t.value;scheduleRender()}
  if(t.dataset.rd!==undefined&&t.isContentEditable){rdGuardar(t.dataset.rd,t.innerHTML)}
});
document.addEventListener('focusin',ev=>{if(ev.target.id==='gq'&&!UI.gopen){UI.gopen=true;scheduleRender()}});
document.addEventListener('keydown',ev=>{
  if(ev.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName||''))&&!$('#modal').classList.contains('open')){ev.preventDefault();const g=$('#gq');if(g)g.focus()}
  if(ev.key==='Escape'&&UI.gopen){UI.gopen=false;const g=$('#gq');if(g)g.blur();render()}
});
document.addEventListener('mousedown',ev=>{if(ev.target.id==='modal')closeModal()});

/* ============ início ============ */
(function(){
  const h=(location.hash||'').slice(1);if(['home','obras','receb','entregas','nfs','relatorios','config'].includes(h))UI.view=h;
  if(UI.view==='obra')UI.view='obras';
  applyTheme();render();initData();
})();

<script>
/* chamas ao clicar (botões e seleções) */
(function(){
  if(window.__flameOn)return;window.__flameOn=true;
  const st=document.createElement('style');st.textContent=`
.fx-flames{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:9999}
.fx-flame{position:absolute;width:var(--w);height:calc(var(--w)*1.5);margin:calc(var(--w)*-.75) 0 0 calc(var(--w)*-.5);border-radius:50% 50% 45% 45%/62% 62% 38% 38%;
 background:radial-gradient(circle at 50% 72%,#FFF4C2 0 14%,#FFC23A 30%,#FF6A1A 55%,#C41A23 78%,rgba(120,8,14,0) 100%);
 filter:blur(.4px) drop-shadow(0 0 6px rgba(255,90,20,.75));opacity:0;animation:fxFlame var(--d) cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fxFlame{0%{opacity:.95;transform:translate(0,0) scale(.5) rotate(var(--r))}35%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.15) rotate(calc(var(--r)*-1))}}
.fx-ember{position:absolute;width:3px;height:3px;border-radius:50%;background:#FFD36B;box-shadow:0 0 6px 2px rgba(255,120,30,.8);opacity:0;animation:fxEmber var(--d) ease-out forwards}
@keyframes fxEmber{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.fx-burn{animation:fxBurn .9s ease-out;position:relative}
@keyframes fxBurn{0%{box-shadow:0 0 0 0 rgba(255,140,30,.9),0 0 22px 6px rgba(255,90,20,.85),inset 0 0 14px rgba(255,200,80,.9);filter:brightness(1.35) saturate(1.3)}
 25%{box-shadow:0 -4px 18px 4px rgba(255,120,20,.8),0 0 30px 10px rgba(196,26,35,.7),inset 0 0 18px rgba(255,170,60,.85);filter:brightness(1.25)}
 50%{box-shadow:0 -6px 22px 2px rgba(255,90,20,.6),0 0 22px 6px rgba(196,26,35,.55),inset 0 0 12px rgba(255,140,40,.6);filter:brightness(1.15)}
 100%{box-shadow:0 0 0 0 rgba(255,90,20,0),0 0 0 0 rgba(196,26,35,0),inset 0 0 0 rgba(0,0,0,0);filter:none}}
@keyframes fxGlow{0%{box-shadow:0 0 0 0 rgba(255,90,20,.75),0 0 18px 4px rgba(196,26,35,.6)}100%{box-shadow:0 0 0 10px rgba(255,90,20,0),0 0 0 0 rgba(196,26,35,0)}}
@media (prefers-reduced-motion:reduce){.fx-flame,.fx-ember{display:none}.fx-burn{animation:none}}`;
  document.head.appendChild(st);
  /* fogo só nos botões do menu (lateral no computador, barra inferior no celular) */
  const SEL='.side .nv,.bottomnav .nv';
  const R=(a,b)=>a+Math.random()*(b-a);
  /* fogo realista em canvas: partículas pequenas somadas (modo "lighter") formam uma chama contínua */
  function fireFX(r,o){
    o=o||{};const card=!!o.card,dur=o.dur||(card?1900:750),h=r.height,w=r.width;
    const rise=card?Math.max(80,h*.9):Math.max(36,h*1.6),pad=card?30:18,dpr=Math.min(2,window.devicePixelRatio||1);
    const cv=document.createElement('canvas');const W=w+pad*2,H=h+rise+pad;
    cv.width=W*dpr;cv.height=H*dpr;cv.style.cssText=`position:fixed;left:${r.left-pad}px;top:${r.top-rise}px;width:${W}px;height:${H}px;pointer-events:none;z-index:10000`;
    document.body.appendChild(cv);const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    const P=[],A=[],t0=performance.now(),base=rise+h;const sc=card?Math.min(1.6,Math.max(.9,w/180)):Math.min(1.2,Math.max(.6,h/36));
    function emit(front){
      const n=card?Math.max(6,Math.round(w/9)):Math.max(4,Math.round(w/8));
      for(let i=0;i<n;i++){const x=pad+Math.random()*w;const y=card?front+Math.random()*16:rise+h*(.25+Math.random()*.8);
        P.push({x,y,vx:(Math.random()-.5)*.6,vy:-(1.2+Math.random()*2.2)*sc,life:0,max:(card?.55:.38)+Math.random()*(card?.55:.35),s:(card?7:5)*sc+Math.random()*(card?12:7)*sc,ph:Math.random()*6.28})}
    }
    function col(t){ if(t<.12)return[255,226,150]; if(t<.35)return[255,170,50]; if(t<.65)return[240,90,20]; return[160,20,18]; }
    let last=t0;
    (function tick(now){
      const dt=Math.min(.05,(now-last)/1000);last=now;const el=now-t0,pr=Math.min(1,el/dur);
      const front=card?(rise+h)-pr*(h+10):0;
      if(el<dur){emit(front);if(card&&o.onFront)o.onFront(pr);
        if(card&&Math.random()<.9)for(let k=0;k<Math.round(w/40);k++)A.push({x:pad+Math.random()*w,y:front+Math.random()*10,vx:(Math.random()-.5)*.8,vy:-(.4+Math.random()*1.1),life:0,max:1.2+Math.random()*1.2,s:1+Math.random()*2.4,g:60+Math.random()*90})}
      ctx.clearRect(0,0,W,H);
      ctx.globalCompositeOperation='source-over';
      for(let i=A.length-1;i>=0;i--){const a=A[i];a.life+=dt;if(a.life>a.max){A.splice(i,1);continue}a.x+=a.vx+Math.sin((a.life+a.x)*3)*.3;a.y+=a.vy;
        ctx.fillStyle=`rgba(${a.g},${a.g-10},${a.g-15},${(1-a.life/a.max)*.85})`;ctx.fillRect(a.x,a.y,a.s,a.s)}
      ctx.globalCompositeOperation='lighter';
      for(let i=P.length-1;i>=0;i--){const p=P[i];p.life+=dt;const t=p.life/p.max;if(t>=1){P.splice(i,1);continue}
        p.x+=p.vx+Math.sin(p.life*14+p.ph)*.45;p.y+=p.vy;p.vy*=.995;const s=p.s*(1-t*.75);const [cr,cg,cb]=col(t);const al=(t<.1?t*10:1)*(1-t)*.32;
        const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,s);g.addColorStop(0,`rgba(${cr},${cg},${cb},${al})`);g.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,s,0,6.283);ctx.fill()}
      if(el<dur||P.length||A.length)requestAnimationFrame(tick);else{cv.remove();o.done&&o.done()}
    })(t0);
  }
  window.pyroFireFX=fireFX;
  /* card pegando fogo e virando cinzas (usa um clone, o card real já foi para Finalizados) */
  window.pyroBurnCard=function(el,done){
    if(!el){done&&done();return}
    const r=el.getBoundingClientRect();if(!r.width||r.bottom<0||r.top>innerHeight){done&&done();return}
    const g=el.cloneNode(true);g.removeAttribute('data-open');
    g.style.cssText+=`;position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;z-index:9999;pointer-events:none;transition:none`;
    document.body.appendChild(g);
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){g.animate([{opacity:1},{opacity:0}],{duration:400}).onfinish=()=>{g.remove();done&&done()};return}
    fireFX(r,{card:true,dur:1900,onFront:pr=>{
      const cut=Math.max(0,pr*112-6);
      g.style.webkitMaskImage=g.style.maskImage=`linear-gradient(to top,transparent ${cut}%,#000 ${cut+10}%)`;
      g.style.filter=`sepia(${Math.min(1,pr*1.6)}) brightness(${Math.max(.18,1-pr*1.1)}) contrast(1.2)`;
    },done:()=>{done&&done()}});
    setTimeout(()=>g.remove(),2000);
  };
  function burst(r){fireFX(r)}
  document.addEventListener('pointerdown',ev=>{
    if(ev.button!==0)return;
    const el=ev.target.closest&&ev.target.closest(SEL);if(!el||el.disabled)return;
    if(typeof UI!=='undefined'&&UI.skin!=='infernal')return;
    const r=el.getBoundingClientRect();burst(r);
    el.classList.remove('fx-burn');void el.offsetWidth;el.classList.add('fx-burn');setTimeout(()=>el.classList.remove('fx-burn'),900);
  },true);
})();
