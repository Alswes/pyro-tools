astro manual<\/button>\n        <button class=\"chip\" data-modo=\"controle\">Importar Excel (Controle Recebimento)<\/button>\n        <button class=\"chip\" data-modo=\"pc\">Importar Lista de Pedido de Compra<\/button>\n      <\/div>\n\n      <div id=\"modoControle\" style=\"display:none;\">\n        <p class=\"subnote\">Importa uma planilha de Controle de Recebimento já pronta (com colunas de NF/Data/Qtd/Valor de recebimento). Por padrão, cada obra vem do nome da aba do Excel.<\/p>\n        <div class=\"field\" style=\"max-width:340px;margin-bottom:12px;\">\n          <label>Obra (opcional)<\/label>\n          <select id=\"controle_obra_override\" class=\"pyobra\"><option value=\"\">Usar o nome da aba do Excel<\/option><\/select>\n        <\/div>\n        <p class=\"subnote\" id=\"controleObraWarn\" style=\"display:none;color:var(--rust);margin-top:-6px;\">Preenchido: todos os itens dessa importação vão entrar com essa obra, mesmo que a planilha tenha abas com outros nomes.<\/p>\n        <label class=\"import-label\" for=\"importFile\">Escolher arquivo e importar<\/label>\n        <input type=\"file\" id=\"importFile\" accept=\".xlsx,.xls\" style=\"display:none;\">\n      <\/div>\n\n      <div id=\"modoPc\" style=\"display:none;\">\n        <h3>Importar Lista de Pedido de Compra<\/h3>\n        <p class=\"subnote\">Use para o pedido bruto (ex: PC05), sem colunas de recebimento. A página calcula peso total, valor unitário e valor total com taxa automaticamente.<\/p>\n        <div class=\"formgrid\">\n          <div class=\"field\"><label>Obra<\/label><select id=\"pc_obra\" class=\"pyobra\"><option value=\"\">Selecione a obra<\/option><\/select><\/div>\n          <div class=\"field\"><label>Nº do Pedido<\/label><input type=\"text\" id=\"pc_pedido\" list=\"pcDatalist\" placeholder=\"Ex.: PC22\"><datalist id=\"pcDatalist\"><\/datalist><\/div>\n        <\/div>\n        <div class=\"formgrid\" id=\"pcFormulaFields\" style=\"margin-top:12px;\">\n          <div class=\"field\"><label>Valor R$/Kg do alumínio<\/label><input type=\"number\" step=\"0.01\" id=\"pc_valorkg\"><\/div>\n          <div class=\"field\"><label>Taxa financeira (%)<\/label><input type=\"number\" step=\"0.01\" id=\"pc_taxa\"><\/div>\n        <\/div>\n        <p class=\"subnote\" id=\"pcNoFormulaNote\" style=\"display:none;margin-top:10px;\">Essa categoria não usa a fórmula de peso/kg — o valor será lido direto da coluna \"Valor Total\" da planilha, se existir. Ajuste isso em Configurações → Regras por categoria.<\/p>\n        <div class=\"errtext\" id=\"pcImportErr\">Informe Obra e Nº do Pedido antes de escolher o arquivo.<\/div>\n        <label class=\"import-label\" for=\"pcFile\" style=\"margin-top:8px;display:inline-flex;\">Escolher arquivo e importar<\/label>\n        <input type=\"file\" id=\"pcFile\" accept=\".xlsx,.xls\" style=\"display:none;\">\n      <\/div>\n\n      <div id=\"modoManualWrap\">\n        <div id=\"modoManualHost\"><\/div>\n      <\/div>\n\n      <div class=\"formfoot\" id=\"novoItemFormfoot\">\n        <button class=\"btn btn-ghost\" id=\"btnCancelarNovoItem\">Cancelar<\/button>\n      <\/div>\n    <\/div>\n\n    <div id=\"formPanel\">\n      <h3 id=\"formTitle\">Novo item<\/h3>\n      <div class=\"formgrid\">\n        <div class=\"field\"><label>Obra<\/label><input type=\"text\" id=\"f_obra\" list=\"obraDatalist\"><datalist id=\"obraDatalist\"><\/datalist><\/div>\n        <div class=\"field\"><label>Categoria<\/label><select id=\"f_categoria\"><\/select><\/div>\n        <div class=\"field\"><label>Nº Pedido<\/label><input type=\"text\" id=\"f_pedido\"><\/div>\n        <div class=\"field\"><label>Fornecedor<\/label><input type=\"text\" id=\"f_fornecedor\" list=\"fornecedorDatalist\"><datalist id=\"fornecedorDatalist\"><\/datalist><\/div>\n        <div class=\"field\"><label>Código<\/label><input type=\"text\" id=\"f_codigo\"><\/div>\n        <div class=\"field\" style=\"grid-column:span 2;\"><label>Descrição<\/label><input type=\"text\" id=\"f_descricao\"><\/div>\n        <div class=\"field\"><label>Acabamento<\/label><input type=\"text\" id=\"f_acabamento\"><\/div>\n        <div class=\"field\"><label>Tipo<\/label><input type=\"text\" id=\"f_tipo\" list=\"tipoDatalist\" placeholder=\"Ex.: Ferragem, Vedação\" autocomplete=\"off\"><datalist id=\"tipoDatalist\"><\/datalist><\/div>\n        <div class=\"field\"><label>Quantidade pedida<\/label><input type=\"number\" step=\"0.01\" id=\"f_qtdepedida\"><\/div>\n        <div class=\"field\"><label>Unidade de medida<\/label><select id=\"f_unidade\"><option value=\"\">—<\/option><\/select><\/div>\n        <div class=\"field\"><label>Valor total pedido (R$)<\/label><input type=\"number\" step=\"0.01\" id=\"f_valorpedido\"><\/div>\n        <div class=\"field\" id=\"f_pesoKgM_wrap\"><label>Peso (kg/m)<\/label><input type=\"number\" step=\"0.001\" id=\"f_pesoKgM\"><\/div>\n        <div class=\"field\" id=\"f_barra_wrap\"><label>Barra (m)<\/label><input type=\"number\" step=\"0.01\" id=\"f_barra\"><\/div>\n        <div class=\"field\" id=\"f_larguraMm_wrap\"><label>Largura (mm)<\/label><input type=\"number\" step=\"1\" id=\"f_larguraMm\"><\/div>\n        <div class=\"field\" id=\"f_alturaMm_wrap\"><label>Altura (mm)<\/label><input type=\"number\" step=\"1\" id=\"f_alturaMm\"><\/div>\n        <div class=\"field\" id=\"f_areaEmp_wrap\"><label>Área Emp. (faturada) — m² total<\/label><input type=\"number\" step=\"0.0001\" id=\"f_areaEmp\"><\/div>\n        <div class=\"field\"><label>Data do pedido<\/label><input type=\"date\" id=\"f_datapedido\"><\/div>\n        <div class=\"field\"><label>Previsão de chegada<\/label><input type=\"date\" id=\"f_previsao\"><\/div>\n        <div class=\"field\"><label>Código do pedido ERP<\/label><input type=\"text\" id=\"f_codigoerp\"><\/div>\n        <select id=\"f_statuserp\" hidden aria-hidden=\"true\"><option value=\"\">—<\/option><\/select>\n        <select id=\"f_fase\" hidden aria-hidden=\"true\"><option value=\"\">—<\/option><\/select>\n      <\/div>\n      <div class=\"field\" style=\"margin-top:12px;\"><label>Observações<\/label><textarea id=\"f_obs\" rows=\"2\"><\/textarea><\/div>\n      <div class=\"field\" style=\"margin-top:12px;\">\n        <label>Anexo (nota, lista de compra, etc.)<\/label>\n        <label class=\"import-label\" for=\"f_anexo\" style=\"max-width:260px;\">Escolher arquivo (PDF/imagem)<\/label>\n        <input type=\"file\" id=\"f_anexo\" accept=\".pdf,image/*\" style=\"display:none;\">\n        <div id=\"anexoPreview\" style=\"margin-top:4px;font-size:11.5px;color:var(--ink-soft);\"><\/div>\n      <\/div>\n\n      <div class=\"receb-block\">\n        <h4>Recebimentos<\/h4>\n        <div id=\"recebRows\"><\/div>\n        <button class=\"add-receb\" id=\"btnAddReceb\" type=\"button\">+ Adicionar recebimento<\/button>\n      <\/div>\n\n      <div class=\"errtext\" id=\"formErr\">Preencha ao menos Obra, Nº Pedido, Código ou Descrição e Qtde pedida.<\/div>\n      <div class=\"formfoot\">\n        <button class=\"btn btn-ghost\" id=\"btnCancelar\">Cancelar<\/button>\n        <button class=\"btn btn-primary\" id=\"btnSalvar\">Salvar<\/button>\n      <\/div>\n    <\/div>\n\n    <table>\n      <thead>\n        <tr>\n          <th class=\"rail\"><\/th>\n          <th style=\"width:30px;padding:10px 6px;\"><input type=\"checkbox\" id=\"chkSelecionarTodos\" title=\"Selecionar todos os itens visíveis\"><\/th>\n          <th class=\"sortable\" data-sort=\"obra\">Obra<\/th><th class=\"sortable\" data-sort=\"pedido\">Pedido<\/th><th class=\"sortable\" data-sort=\"fornecedor\">Fornecedor<\/th><th class=\"sortable\" data-sort=\"codigo\">Código<\/th><th class=\"sortable\" data-sort=\"descricao\">Descrição<\/th><th class=\"sortable\" data-sort=\"categoria\">Categoria<\/th>\n          <th class=\"col-perfil-only\">Peso (kg/m)<\/th><th class=\"col-perfil-only\">Barra (m)<\/th><th class=\"col-perfil-only\">Peso (Barra)<\/th><th class=\"col-perfil-only\">Peso (Total)<\/th>\n          <th class=\"col-vidros-only\">Largura (mm)<\/th><th class=\"col-vidros-only\">Altura (mm)<\/th><th class=\"col-vidros-only\">Área Real (m²)<\/th><th class=\"col-vidros-only\">Área Emp. (m²)<\/th><th class=\"col-vidros-only\">Diferença (m²)<\/th>\n          <th class=\"sortable\" data-sort=\"qtdePedida\">Qtde pedida<\/th><th class=\"sortable\" data-sort=\"qtdeRecebida\">Qtde recebida<\/th><th>Notas recebidas<\/th><th class=\"sortable\" data-sort=\"valorPedido\">Valor pedido<\/th><th class=\"col-perfil-only\">Valor recebido<\/th><th class=\"col-perfil-only\">Diferença<\/th><th class=\"col-variacao col-perfil-only\">Valor unit. / status<\/th><th class=\"sortable\" data-sort=\"previsao\">Previsão<\/th><th>Cód. ERP<\/th><th class=\"sortable\" data-sort=\"status\">Status<\/th><th><\/th>\n        <\/tr>\n      <\/thead>\n      <tbody id=\"tbody\"><\/tbody>\n    <\/table>\n    <div class=\"empty\" id=\"emptyMsg\" style=\"display:none;\">Nenhum item cadastrado ainda. Importe uma planilha ou clique em \"Novo item\".<\/div>\n  <\/div>\n\n  <\!-- ===================== VIEW: DASHBOARD ===================== -->\n  <div class=\"view active\" id=\"view-dashboard\">\n    <div class=\"hero-card\" id=\"heroCard\">\n      <div class=\"hero-greeting\">\n        <div class=\"hero-hello\" id=\"heroHello\">Bem-vindo<\/div>\n        <div class=\"hero-date\" id=\"heroDate\"><\/div>\n      <\/div>\n      <div class=\"hero-stats\">\n        <div class=\"hero-stat\"><div class=\"hero-stat-value\" id=\"heroStatObras\">0<\/div><div class=\"hero-stat-label\">obras ativas<\/div><\/div>\n        <div class=\"hero-stat\"><div class=\"hero-stat-value\" id=\"heroStatItens\">0<\/div><div class=\"hero-stat-label\">itens cadastrados<\/div><\/div>\n        <div class=\"hero-stat\"><div class=\"hero-stat-value\" id=\"heroStatAtrasados\">0<\/div><div class=\"hero-stat-label\">atrasados<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div id=\"dashCardsView\">\n      <div class=\"cards-grid\" id=\"dashCardsGrid\"><\/div>\n      <div class=\"empty\" id=\"dashObraEmpty\" style=\"display:none;\">Nenhum item cadastrado ainda — importe uma planilha ou cadastre um item pra começar.<\/div>\n    <\/div>\n\n    <div id=\"dashDrillWrap\" style=\"display:none;margin-top:20px;\">\n      <button class=\"rowbtn\" id=\"btnVoltarCards\" style=\"color:var(--steel);font-weight:600;margin-bottom:10px;\">← Voltar aos cards<\/button>\n      <h2 class=\"section-title\" id=\"dashDrillTitulo\" style=\"margin-top:0;\">Obra — Categoria<\/h2>\n      <div class=\"toolbar\">\n        <div style=\"display:flex;align-items:center;gap:10px;\">\n          <label style=\"font-size:12px;color:var(--ink-soft);\">Pedido<\/label>\n          <select class=\"selectbox\" id=\"dashDrillPedido\"><option value=\"\">Todos os pedidos<\/option><\/select>\n        <\/div>\n        <div style=\"display:flex;gap:8px;\">\n          <button class=\"btn btn-ghost\" id=\"btnImportarNoCard\">Anexar planilha<\/button>\n          <button class=\"btn btn-ghost\" id=\"btnPrintDash\">Gerar relatório<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"client-kpis\">\n        <div class=\"client-kpi\"><div class=\"label\">Itens<\/div><div class=\"value\" id=\"dkTotal\">0<\/div><\/div>\n        <div class=\"client-kpi\"><div class=\"label\">% recebido (valor R$)<\/div><div class=\"value\" id=\"dkPct\">0%<\/div>\n          <div class=\"progress-bar\"><div class=\"progress-fill\" id=\"dkProgressFill\" style=\"width:0%;\"><\/div><\/div>\n        <\/div>\n        <div class=\"client-kpi\"><div class=\"label\">Pendentes / Parciais<\/div><div class=\"value\" id=\"dkFaltando\" style=\"color:var(--rust);\">0<\/div><\/div>\n        <div class=\"client-kpi\"><div class=\"label\">Completos<\/div><div class=\"value\" id=\"dkCompletos\" style=\"color:var(--green);\">0<\/div><\/div>\n        <div class=\"client-kpi\"><div class=\"label\">Com sobra<\/div><div class=\"value\" id=\"dkSobra\" style=\"color:var(--steel);\">0<\/div><\/div>\n      <\/div>\n\n      <div style=\"max-width:280px;margin:0 auto 22px;\" id=\"dashDrillPieWrap\"><\/div>\n\n      <div style=\"max-width:520px;margin:0 auto 26px;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;\">\n          <label style=\"font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);\">Observações sobre este gráfico (ex: pra apresentação)<\/label>\n          <button class=\"rowbtn\" id=\"btnCopiarComentario\" style=\"color:var(--steel);font-weight:600;\">Copiar texto<\/button>\n        <\/div>\n        <textarea id=\"dashComentario\" rows=\"3\" placeholder=\"Anote aqui um comentário sobre esse gráfico específico (obra + categoria + pedido selecionados). Fica salvo automaticamente.\" style=\"width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;font-family:'Figtree',sans-serif;color:var(--ink);background:var(--input-bg);resize:vertical;\"><\/textarea>\n        <div id=\"dashComentarioStatus\" style=\"font-size:11px;color:var(--ink-faint);margin-top:4px;height:14px;\"><\/div>\n      <\/div>\n\n      <table>\n        <thead>\n          <tr>\n            <th class=\"rail\"><\/th>\n            <th>Pedido<\/th><th>Código<\/th><th>Descrição<\/th><th>Qtde pedida<\/th><th>Qtde recebida<\/th><th>Status<\/th><th><\/th>\n          <\/tr>\n        <\/thead>\n        <tbody id=\"dashDrillTbody\"><\/tbody>\n      <\/table>\n      <div class=\"empty\" id=\"dashDrillEmpty\" style=\"display:none;\">Nenhum item para essa combinação.<\/div>\n    <\/div>\n  <\/div>\n\n  <\!-- ===================== VIEW: RECEBIMENTO ===================== -->\n  <div class=\"view\" id=\"view-recebimento\">\n    <h2 class=\"section-title\">Recebimento<\/h2>\n    <p class=\"subnote\">Escolha a obra e a categoria pra ver os pedidos e acompanhar o que já chegou.<\/p>\n    <div class=\"obra-buttons\" id=\"recObraButtons\"><\/div>\n    <div class=\"empty\" id=\"recObraEmpty\" style=\"display:none;\">Nenhuma obra cadastrada ainda.<\/div>\n\n    <div id=\"recCategoriaWrap\" style=\"display:none;margin-top:20px;\">\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><p class=\"subnote\" id=\"recCategoriaLabel\" style=\"flex:1;min-width:200px\">Categoria em [obra]<\/p><button class=\"btn btn-excel rec-xl\" id=\"btnXlsxRecObra\" type=\"button\" title=\"Baixar em Excel os itens desta obra (na categoria escolhida, se houver)\">Baixar Excel (.xlsx)<\/button><\/div>\n      <div class=\"chips\" id=\"recCategoriaChips\"><\/div>\n    <\/div>\n\n    <div id=\"recPedidosView\" style=\"display:none;margin-top:22px;\">\n      <div class=\"cards-grid\" id=\"recPedidosGrid\"><\/div>\n      <div class=\"empty\" id=\"recPedidosEmpty\" style=\"display:none;\">Nenhum pedido cadastrado ainda nessa obra/categoria.<\/div>\n    <\/div>\n\n    <div id=\"recItensView\" style=\"display:none;margin-top:20px;\">\n      <button class=\"rowbtn\" id=\"btnVoltarRecPedidos\" style=\"color:var(--steel);font-weight:600;margin-bottom:12px;\">← Voltar aos pedidos<\/button>\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;\"><h3 class=\"section-title\" id=\"recItensTitulo\" style=\"margin:0;font-size:16px;flex:1;min-width:200px;\"><\/h3><button class=\"btn btn-excel rec-xl\" id=\"btnXlsxRecPedido\" type=\"button\" title=\"Baixar os itens deste pedido em Excel\">Baixar Excel (.xlsx)<\/button><button class=\"btn btn-ghost\" id=\"btnEditarGrupo\" type=\"button\">✎ Editar pedido, obra e fornecedor<\/button><\/div>\n      <table>\n        <thead>\n          <tr>\n            <th class=\"rail\"><\/th>\n            <th>Código<\/th><th>Descrição<\/th><th>Qtde pedida<\/th><th>Qtde recebida<\/th><th>Notas recebidas<\/th><th>Previsão<\/th><th>Status<\/th><th><\/th>\n          <\/tr>\n        <\/thead>\n        <tbody id=\"recItensTbody\"><\/tbody>\n      <\/table>\n    <\/div>\n  <\/div>\n\n  <\!-- ===================== VIEW: OBRAS ===================== -->\n  <div class=\"view\" id=\"view-obras\">\n    <div id=\"obraListaWrap\">\n      <div class=\"toolbar\">\n        <div><\/div>\n        <button class=\"btn btn-primary\" id=\"btnNovaObra\">+ Nova obra<\/button>\n      <\/div>\n      <div class=\"formpanel\" id=\"obraForm\">\n        <h3 id=\"obraFormTitle\">Nova obra<\/h3>\n        <div class=\"formgrid\">\n          <div class=\"field\"><label>Nome<\/label><input type=\"text\" id=\"of_nome\"><\/div>\n          <div class=\"field\"><label>Ativa<\/label><select id=\"of_ativo\"><option value=\"Sim\">Sim<\/option><option value=\"Não\">Não<\/option><\/select><\/div>\n          <div class=\"field\"><label>Budget (R$) — opcional<\/label><input type=\"number\" step=\"0.01\" id=\"of_budget\"><\/div>\n        <\/div>\n        <div class=\"errtext\" id=\"obraErr\">Informe o nome da obra.<\/div>\n        <div class=\"formfoot\">\n          <button class=\"btn btn-ghost\" id=\"btnCancelarObra\">Cancelar<\/button>\n          <button class=\"btn btn-primary\" id=\"btnSalvarObra\">Salvar<\/button>\n        <\/div>\n      <\/div>\n      <p class=\"subnote\">Clique no nome de uma obra pra ver o painel completo dela.<\/p>\n      <div class=\"cards-grid postit-grid\" id=\"obrasCardsGrid\"><\/div>\n      <div class=\"empty\" id=\"obrasEmpty\" style=\"display:none;\">Nenhuma obra cadastrada ainda.<\/div>\n    <\/div>\n\n    <div id=\"obraDashWrap\" style=\"display:none;\">\n      <button class=\"rowbtn\" id=\"btnVoltarObraLista\" style=\"color:var(--steel);font-weight:600;margin-bottom:10px;\">← Voltar à lista de obras<\/button>\n      <h2 class=\"section-title\" id=\"obraDashTitulo\" style=\"margin-top:0;\">Obra<\/h2>\n\n      <div class=\"config-block\" style=\"margin-bottom:18px;\">\n        <h3>Budget<\/h3>\n        <div style=\"display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;\">\n          <div>\n            <label style=\"font-size:11px;color:var(--ink-soft);\">Budget da obra (R$)<\/label><br>\n            <input type=\"number\" step=\"0.01\" id=\"obraDashBudgetInput\" style=\"width:180px;margin-top:4px;\">\n            <button class=\"btn btn-ghost btn-small\" id=\"btnSalvarBudget\" style=\"margin-left:6px;\">Salvar<\/button>\n          <\/div>\n          <div style=\"flex:1;min-width:220px;\">\n            <div style=\"font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;\" id=\"obraDashBudgetLabel\">Sem budget definido.<\/div>\n            <div class=\"progress-bar\"><div class=\"progress-fill\" id=\"obraDashBudgetFill\" style=\"width:0%;\"><\/div><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"toolbar\">\n        <div style=\"display:flex;align-items:center;gap:10px;\">\n          <label style=\"font-size:12px;color:var(--ink-soft);\">Pedido<\/label>\n          <select class=\"selectbox\" id=\"obraDashPedidoSelect\"><option value=\"\">Todos os pedidos<\/option><\/select>\n        <\/div>\n        <button class=\"btn btn-primary\" id=\"btnNovoPedidoObra\">+ Novo pedido / Anexar planilha<\/button>\n      <\/div>\n\n      <div class=\"client-kpis\">\n        <div class=\"client-kpi\"><div class=\"label\">Itens<\/div><div class=\"value\" id=\"odkTotal\">0<\/div><\/div>\n        <div class=\"client-kpi\"><div class=\"label\">% recebido (valor R$)<\/div><div class=\"value\" id=\"odkPct\">0%<\/div>\n          <div class=\"progress-bar\"><div class=\"progress-fill\" id=\"odkProgressFill\" style=\"width:0%;\"><\/div><\/div>\n        <\/div>\n        <div class=\"client-kpi\"><div class=\"label\">Pendentes / Parciais<\/div><div class=\"value\" id=\"odkFaltando\" style=\"color:var(--rust);\">0<\/div><\/div>\n        <div class=\"client-kpi\"><div class=\"label\">Completos<\/div><div class=\"value\" id=\"odkCompletos\" style=\"color:var(--green);\">0<\/div><\/div>\n        <div class=\"client-kpi\"><div class=\"label\">Com sobra<\/div><div class=\"value\" id=\"odkSobra\" style=\"color:var(--steel);\">0<\/div><\/div>\n      <\/div>\n\n      <div style=\"max-width:280px;margin:0 auto 26px;\" id=\"obraDashPieWrap\"><\/div>\n\n      <p class=\"subnote\">Pedidos de compra dessa obra, com o status geral de cada um:<\/p>\n      <table>\n        <thead><tr><th class=\"rail\"><\/th><th>Pedido<\/th><th>Categoria(s)<\/th><th>Itens<\/th><th>Status<\/th><th><\/th><\/tr><\/thead>\n        <tbody id=\"obraDashPedidosTbody\"><\/tbody>\n      <\/table>\n      <div class=\"empty\" id=\"obraDashPedidosEmpty\" style=\"display:none;\">Nenhum pedido cadastrado ainda nessa obra.<\/div>\n    <\/div>\n  <\/div>\n\n  <\!-- ===================== VIEW: VALORES ===================== -->\n  <div class=\"view\" id=\"view-valores\">\n    <h2 class=\"section-title\">Valores — inicial x faturado<\/h2>\n    <p class=\"subnote\">Escolha uma obra e uma categoria para comparar o valor unitário do pedido com o valor de cada nota recebida.<\/p>\n    <div class=\"obra-buttons\" id=\"valObraButtons\"><\/div>\n    <div class=\"empty\" id=\"valObraEmpty\" style=\"display:none;\">Nenhuma obra cadastrada ainda.<\/div>\n\n    <div id=\"valCategoriaWrap\" style=\"display:none;margin-top:20px;\">\n      <p class=\"subnote\" id=\"valCategoriaLabel\">Categoria em [obra]<\/p>\n      <div class=\"chips\" id=\"valCategoriaChips\"><\/div>\n    <\/div>\n\n    <div id=\"valContent\" style=\"display:none;margin-top:20px;\">\n      <div class=\"val-kpis\">\n        <div class=\"client-kpi\"><div class=\"label\">Manteve o valor<\/div><div class=\"value\" id=\"vkManteve\" style=\"color:var(--green);\">0<\/div><\/div>\n        <div class=\"client-kpi\"><div class=\"label\">Abaixou<\/div><div class=\"value\" id=\"vkAbaixou\" style=\"color:var(--steel);\">0<\/div><\/div>\n        <div class=\"client-kpi\"><div class=\"label\">Alterou (subiu)<\/div><div class=\"value\" id=\"vkAlterou\" style=\"color:var(--amber-text);\">0<\/div><\/div>\n      <\/div>\n      <table>\n        <thead>\n          <tr>\n            <th class=\"rail\"><\/th>\n            <th>Pedido<\/th><th>Código<\/th><th>Descrição<\/th><th>NF<\/th><th>Data<\/th>\n            <th>Valor unit. inicial<\/th><th>Valor unit. nota<\/th><th>Variação<\/th><th>Status<\/th>\n          <\/tr>\n        <\/thead>\n        <tbody id=\"valTbody\"><\/tbody>\n      <\/table>\n      <div class=\"empty\" id=\"valEmpty\" style=\"display:none;\">Nenhuma nota recebida com valor unitário inicial pra comparar nessa combinação.<\/div>\n    <\/div>\n  <\/div>\n\n  <\!-- ===================== VIEW: FORNECEDORES ===================== -->\n  <div class=\"view\" id=\"view-fornecedores\">\n    <h2 class=\"section-title\">Fornecedores<\/h2>\n    <p class=\"subnote\">Escolha uma obra e uma categoria pra ver, por fornecedor, quantos itens variaram de preço e quanto tempo leva até a primeira nota chegar.<\/p>\n    <div class=\"obra-buttons\" id=\"fornObraButtons\"><\/div>\n    <div class=\"empty\" id=\"fornObraEmpty\" style=\"display:none;\">Nenhuma obra cadastrada ainda.<\/div>\n\n    <div id=\"fornCategoriaWrap\" style=\"display:none;margin-top:20px;\">\n      <p class=\"subnote\" id=\"fornCategoriaLabel\">Categoria em [obra]<\/p>\n      <div class=\"chips\" id=\"fornCategoriaChips\"><\/div>\n    <\/div>\n\n    <div id=\"fornContent\" style=\"display:none;margin-top:20px;\">\n      <table>\n        <thead>\n          <tr>\n            <th>Fornecedor<\/th><th>Itens<\/th>\n            <th>Manteve<\/th><th>Abaixou<\/th><th>Alterou (subiu)<\/th>\n            <th>Prazo médio até 1ª nota<\/th><th><\/th>\n          <\/tr>\n        <\/thead>\n        <tbody id=\"fornTbody\"><\/tbody>\n      <\/table>\n      <div class=\"empty\" id=\"fornEmpty\" style=\"display:none;\">Nenhum item com fornecedor preenchido nessa combinação.<\/div>\n      <p class=\"subnote\" style=\"margin-top:10px;\">Editar ou excluir um fornecedor vale para todos os itens com esse nome, em todas as obras e categorias.<\/p>\n    <\/div>\n  <\/div>\n\n  <\!-- ===================== VIEW: CONFIGURAÇÕES ===================== -->\n  <div class=\"view\" id=\"view-config\">\n    <div class=\"config-block\">\n      <h3>Categorias<\/h3>\n      <p class=\"subnote\">Usadas para classificar cada item de pedido (Perfil, Acessórios, Uso e Consumo, ou as que você preferir).<\/p>\n      <div id=\"categoriasList\"><\/div>\n      <div style=\"display:flex;gap:8px;margin-top:10px;\">\n        <input type=\"text\" class=\"search\" id=\"novaCategoria\" placeholder=\"Nova categoria\" style=\"width:220px;\">\n        <button class=\"btn btn-ghost btn-small\" id=\"btnAddCategoria\">Adicionar<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"config-block\">\n      <h3>Opções de Status ERP<\/h3>\n      <p class=\"subnote\">As opções que aparecem no campo \"Status ERP\" do cadastro de item. Edite, remova ou adicione as que fizerem sentido pra sua empresa.<\/p>\n      <div id=\"statusErpList\"><\/div>\n      <div style=\"display:flex;gap:8px;margin-top:10px;\">\n        <input type=\"text\" class=\"search\" id=\"novoStatusErp\" placeholder=\"Novo status\" style=\"width:220px;\">\n        <button class=\"btn btn-ghost btn-small\" id=\"btnAddStatusErp\">Adicionar<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"config-block\">\n      <h3>Fases do fluxo de trabalho<\/h3>\n      <p class=\"subnote\">Defina as etapas do SEU processo (ex: Pedido enviado → Em produção → Em trânsito → Conferido). É independente do status de recebimento — serve pra você acompanhar onde cada item está no fluxo, do jeito que fizer sentido pro seu negócio.<\/p>\n      <div id=\"faseList\"><\/div>\n      <div style=\"display:flex;gap:8px;margin-top:10px;\">\n        <input type=\"text\" class=\"search\" id=\"novaFase\" placeholder=\"Nova fase\" style=\"width:220px;\">\n        <button class=\"btn btn-ghost btn-small\" id=\"btnAddFase\">Adicionar<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"config-block\">\n      <h3>Regras por categoria<\/h3>\n      <p class=\"subnote\">Cada categoria tem suas próprias regras de alerta e cálculo — perfil, acessórios e uso e consumo funcionam de forma diferente.<\/p>\n      <div class=\"chips\" id=\"configCatTabs\" style=\"margin-bottom:16px;\"><\/div>\n      <div id=\"configCatBody\"><\/div>\n    <\/div>\n    <div class=\"config-block\">\n      <h3>Planilhas importadas<\/h3>\n      <p class=\"subnote\">Cada importação de Excel fica registrada aqui. Remover uma planilha apaga só os itens que vieram dela — itens cadastrados manualmente não são afetados.<\/p>\n      <table>\n        <thead><tr><th>Data<\/th><th>Arquivo<\/th><th>Tipo<\/th><th>Obra / Pedido<\/th><th>Categoria<\/th><th>Itens<\/th><th><\/th><\/tr><\/thead>\n        <tbody id=\"importacoesBody\"><\/tbody>\n      <\/table>\n      <div class=\"empty\" id=\"importacoesEmpty\" style=\"display:none;\">Nenhuma planilha importada ainda.<\/div>\n    <\/div>\n    <div class=\"config-block\">\n      <h3>Armazenamento<\/h3>\n      <p class=\"subnote\">Estimativa de quanto os dados desse painel (itens, anexos, backups internos) estão ocupando no navegador. Pra evitar erro ao anexar arquivo, fique de olho quando estiver perto do limite.<\/p>\n      <div class=\"progress-bar\" style=\"margin-bottom:6px;\"><div class=\"progress-fill\" id=\"storageProgressFill\" style=\"width:0%;\"><\/div><\/div>\n      <div id=\"storageUsageText\" style=\"font-size:12px;color:var(--ink-soft);\">Calculando…<\/div>\n    <\/div>\n    <div class=\"config-block\">\n      <h3>Backup completo<\/h3>\n      <p class=\"subnote\">Baixa um arquivo com tudo (pedidos, obras, categorias e configurações) pra guardar num lugar seguro — ex: Google Drive. Diferente do backup em Excel, esse arquivo permite restaurar a página inteira, exatamente como estava.<\/p>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center;\">\n        <button class=\"btn btn-primary\" id=\"btnBackupExport\">Baixar backup completo (.json)<\/button>\n        <label class=\"import-label\" for=\"backupImportFile\">Restaurar backup completo<\/label>\n        <input type=\"file\" id=\"backupImportFile\" accept=\".json\" style=\"display:none;\">\n      <\/div>\n      <div class=\"import-status\" id=\"backupStatus\"><\/div>\n    <\/div>\n    <div class=\"config-block\">\n      <h3>Zona de risco<\/h3>\n      <p class=\"subnote\">Apaga todos os itens de pedido cadastrados (de todas as categorias) e o histórico de planilhas importadas. As obras e as configurações continuam salvas — é só pra você recomeçar o cadastro de itens do zero.<\/p>\n      <button class=\"btn btn-ghost\" id=\"btnLimparItens\" style=\"border-color:var(--rust);color:var(--rust);\">Limpar todos os itens cadastrados<\/button>\n      <div class=\"import-status\" id=\"limparStatus\"><\/div>\n    <\/div>\n  <\/div>\n\n  <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"novaComboOverlay\" style=\"display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;padding:20px;\">\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;max-width:360px;width:100%;\">\n    <h3 style=\"margin:0 0 14px;font-family:'Bricolage Grotesque',sans-serif;font-size:15px;\">Nova obra / categoria<\/h3>\n    <div class=\"field\" style=\"margin-bottom:12px;\"><label>Obra<\/label><input type=\"text\" id=\"novaComboObra\" list=\"obraDatalist\"><\/div>\n    <div class=\"field\" style=\"margin-bottom:18px;\"><label>Categoria<\/label><select id=\"novaComboCategoria\"><\/select><\/div>\n    <div style=\"display:flex;justify-content:flex-end;gap:8px;\">\n      <button class=\"btn btn-ghost\" id=\"novaComboCancelar\">Cancelar<\/button>\n      <button class=\"btn btn-primary\" id=\"novaComboContinuar\">Continuar<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"obsOverlay\" style=\"display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;padding:20px;\">\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;max-width:560px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,0.3);\">\n    <h3 id=\"obsTitle\" style=\"margin:0 0 4px;font-family:'Bricolage Grotesque',sans-serif;font-size:16px;\"><\/h3>\n    <p id=\"obsSubtitle\" style=\"margin:0 0 16px;font-size:12px;color:var(--ink-soft);\"><\/p>\n    <div id=\"obsGrid\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:16px;font-size:12.5px;\"><\/div>\n    <div id=\"obsNotasWrap\" style=\"margin-bottom:14px;\">\n      <p style=\"margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);\">Notas recebidas<\/p>\n      <div id=\"obsNotas\" style=\"font-size:12.5px;color:var(--ink);\"><\/div>\n    <\/div>\n    <p style=\"margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);\">Observações<\/p>\n    <textarea id=\"obsText\" rows=\"3\" style=\"width:100%;color:var(--ink);font-size:13px;line-height:1.5;background:var(--neutral-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 18px;resize:vertical;font-family:'Figtree',sans-serif;\"><\/textarea>\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;\">\n      <button class=\"rowbtn\" id=\"obsEditarBtn\" style=\"color:var(--steel);\">Editar completo (notas, anexo)<\/button>\n      <div style=\"display:flex;gap:8px;\">\n        <button class=\"btn btn-ghost\" id=\"obsCloseBtn\">Fechar<\/button>\n        <button class=\"btn btn-primary\" id=\"obsSalvarBtn\">Salvar<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"undoToast\" style=\"display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:9998;display:none;align-items:center;gap:14px;box-shadow:0 6px 24px rgba(0,0,0,0.3);font-size:13px;\">\n  <span id=\"undoToastMsg\"><\/span>\n  <button id=\"undoToastBtn\" style=\"background:none;border:none;color:var(--steel);font-weight:700;cursor:pointer;font-size:13px;\">Desfazer<\/button>\n<\/div>\n\n<div id=\"relatorioImpressao\"><\/div>\n\n<div id=\"fornEditOverlay\" style=\"display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;padding:20px;\">\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;max-width:400px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,0.3);\">\n    <h3 style=\"margin:0 0 4px;font-family:'Bricolage Grotesque',sans-serif;font-size:15px;\">Editar fornecedor<\/h3>\n    <p id=\"fornEditInfo\" style=\"margin:0 0 14px;font-size:12px;color:var(--ink-soft);\"><\/p>\n    <div class=\"field\" style=\"margin-bottom:6px;\"><label>Nome do fornecedor<\/label><input type=\"text\" id=\"fornEditNome\" list=\"fornecedorDatalist\"><\/div>\n    <div class=\"errtext\" id=\"fornEditErr\">Informe o nome do fornecedor.<\/div>\n    <p id=\"fornEditMerge\" style=\"display:none;margin:6px 0 0;font-size:11.5px;color:var(--amber-text);\">Já existe um fornecedor com esse nome — os itens serão juntados nele.<\/p>\n    <div style=\"display:flex;justify-content:flex-end;gap:8px;margin-top:16px;\">\n      <button class=\"btn btn-ghost\" id=\"fornEditCancelar\">Cancelar<\/button>\n      <button class=\"btn btn-primary\" id=\"fornEditSalvar\">Salvar<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"grpEditOverlay\" style=\"display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;padding:20px;\">\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;max-width:460px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,0.3);max-height:92vh;overflow:auto;\">\n    <h3 style=\"margin:0 0 4px;font-family:'Bricolage Grotesque',sans-serif;font-size:15px;\">Editar pedido<\/h3>\n    <p id=\"grpEditInfo\" style=\"margin:0 0 14px;font-size:12px;color:var(--ink-soft);\"><\/p>\n    <div class=\"field\"><label>Nº do pedido<\/label><input type=\"text\" id=\"grpPedido\" list=\"pcDatalist\" placeholder=\"Ex.: PC22\"><\/div>\n    <div class=\"field\"><label>Obra<\/label><select id=\"grpObra\" class=\"pyobra\"><option value=\"\">Selecione a obra<\/option><\/select><\/div>\n    <div class=\"field\"><label>Fornecedor<\/label><input type=\"text\" id=\"grpForn\" list=\"fornecedorDatalist\" placeholder=\"Nome do fornecedor\"><\/div>\n    <div class=\"field\"><label>Nº do pedido no ERP<\/label><input type=\"text\" id=\"grpErp\" placeholder=\"Deixe em branco para manter\"><\/div>\n    <div class=\"field\"><label>Previsão de chegada<\/label><input type=\"date\" id=\"grpPrev\"><\/div>\n    <div class=\"errtext\" id=\"grpEditErr\">Informe o número do pedido e a obra.<\/div>\n    <p id=\"grpEditMerge\" style=\"display:none;margin:6px 0 0;font-size:11.5px;color:var(--amber-text);\">Já existe esse pedido nessa obra e categoria: os itens serão juntados nele.<\/p>\n    <div style=\"display:flex;justify-content:flex-end;gap:8px;margin-top:16px;\">\n      <button class=\"btn btn-ghost\" id=\"grpEditCancelar\" type=\"button\">Cancelar<\/button>\n      <button class=\"btn btn-primary\" id=\"grpEditSalvar\" type=\"button\">Salvar em todos os itens<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"confirmOverlay\"style=\"display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;\">\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,0.3);\">\n    <p id=\"confirmMsg\" style=\"color:var(--ink);font-size:14px;line-height:1.5;margin:0 0 18px;\"><\/p>\n    <div style=\"display:flex;justify-content:flex-end;gap:8px;\">\n      <button class=\"btn btn-ghost\" id=\"confirmCancelBtn\">Cancelar<\/button>\n      <button class=\"btn btn-primary\" id=\"confirmOkBtn\" style=\"background:var(--rust);\">Confirmar<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\script>\nlet undoToastTimer = null;\nfunction mostrarAviso(msg, duracaoMs){\n  const toast = document.getElementById('undoToast');\n  const btn = document.getElementById('undoToastBtn');\n  document.getElementById('undoToastMsg').textContent = msg;\n  btn.style.display = 'none';\n  toast.style.display = 'flex';\n  if(undoToastTimer) clearTimeout(undoToastTimer);\n  undoToastTimer = setTimeout(()=>{ toast.style.display = 'none'; btn.style.display = ''; }, duracaoMs||4000);\n}\nfunction mostrarDesfazer(msg, aoDesfazer){\n  const toast = document.getElementById('undoToast');\n  const btn = document.getElementById('undoToastBtn');\n  btn.style.display = '';\n  document.getElementById('undoToastMsg').textContent = msg;\n  toast.style.display = 'flex';\n  if(undoToastTimer) clearTimeout(undoToastTimer);\n  const novoBtn = btn.cloneNode(true);\n  btn.parentNode.replaceChild(novoBtn, btn);\n  novoBtn.addEventListener('click', ()=>{\n    clearTimeout(undoToastTimer);\n    toast.style.display = 'none';\n    aoDesfazer();\n  });\n  undoToastTimer = setTimeout(()=>{ toast.style.display = 'none'; }, 6000);\n}\nfunction confirmarAcao(msg){\n  return new Promise((resolve)=>{\n    const overlay = document.getElementById('confirmOverlay');\n    document.getElementById('confirmMsg').textContent = msg;\n    overlay.style.display = 'flex';\n    const okBtn = document.getElementById('confirmOkBtn');\n    const cancelBtn = document.getElementById('confirmCancelBtn');\n    function limpar(){\n      overlay.style.display = 'none';\n      okBtn.removeEventListener('click', onOk);\n      cancelBtn.removeEventListener('click', onCancel);\n    }\n    function onOk(){ limpar(); resolve(true); }\n    function onCancel(){ limpar(); resolve(false); }\n    okBtn.addEventListener('click', onOk);\n    cancelBtn.addEventListener('click', onCancel);\n  });\n}\nlet pedidos = [];\nlet obras = [];\nlet importacoes = [];\nlet config = {\n  categorias: ['Perfil','Acessórios','Uso e Consumo'],\n  porCategoria: {\n    'Perfil': { diasAlerta: 10, usaFormula: true, valorKg: 35, taxaPercent: 2.5 },\n    'Acessórios': { diasAlerta: 10, usaFormula: false },\n    'Uso e Consumo': { diasAlerta: 10, usaFormula: false },\n  },\n  statusErpOptions: [\n    {label:'Em aprovação', color:'azul-piscina'},\n    {label:'Não atendido', color:'amarelo'},\n    {label:'Atendido', color:'verde'},\n  ],\n  faseOptions: [\n    {label:'Pedido enviado', color:'cinza'},\n    {label:'Em produção no fornecedor', color:'amarelo'},\n    {label:'Em trânsito', color:'azul-piscina'},\n    {label:'Conferido', color:'verde'},\n  ],\n};\nlet editingId = null;\nlet editingObraId = null;\nlet selectedIds = new Set(); // itens marcados na tabela (persiste entre filtros/abas) para o botão \"Baixar selecionados\"\nlet currentFilter = 'todos';\nlet currentCategoria = 'Perfil';\nlet currentObraFilter = '';\nlet currentConfigCat = 'Perfil';\nlet recebFormRows = [];\nlet pendingAnexoPedido = null;\nlet sortState = {col:'', dir:1};\n\nfunction getCatConfig(cat){\n  if(!config.porCategoria) config.porCategoria = {};\n  if(!config.porCategoria[cat]) config.porCategoria[cat] = { diasAlerta: 10, usaFormula: false };\n  return config.porCategoria[cat];\n}\n\nfunction todayStr(){ return new Date().toISOString().slice(0,10); }\nfunction parseDate(s){ return s ? new Date(s+'T00:00:00') : null; }\nfunction fmtDate(s){ if(!s) return '—'; const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; }\nfunction fmtMoney(v){ if(v===''||v===null||v===undefined||isNaN(v)) return '—'; return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }\nfunction fmtQtd(v){ if(v===''||v===null||v===undefined||isNaN(v)) return '—'; const n=Number(v); return n%1===0? String(n) : n.toFixed(2); }\nfunction qtdNaoInteiraAviso(v){\n  if(v===''||v===null||v===undefined||isNaN(v)) return '';\n  const n = Number(v);\n  if(n===0 || n%1===0) return '';\n  return ` <span title=\"Quantidade não é um número inteiro — confira se não foi digitada errada (ex: área em vez de quantidade).\" style=\"color:var(--amber);cursor:help;\">⚠<\/span>`;\n}\nfunction fmtPeso(v){ if(v===''||v===null||v===undefined||isNaN(v)) return '—'; const n=Number(v); return n%1===0? String(n) : n.toFixed(3).replace(/0+$/,'').replace(/\\.$/,''); }\nfunction formatRecebimentosCell(recebimentos){\n  if(!recebimentos || recebimentos.length===0) return '<span style=\"color:var(--ink-faint);\">—<\/span>';\n  return recebimentos.map(r=>{\n    const nf = r.nf || 'S/N';\n    const data = r.data ? fmtDate(r.data) : '—';\n    const qtd = fmtQtd(r.qtd);\n    const valor = fmtMoney(r.valor);\n    return `<div class=\"mono\" style=\"font-size:11px;white-space:nowrap;\" title=\"NF ${nf} · ${data} · Qtd ${qtd} · ${valor}\"><b>${nf} · ${data} · ${qtd}un · ${valor}<\/b><\/div>`;\n  }).join('');\n}\nfunction uid(p){ return p+Date.now()+Math.floor(Math.random()*10000); }\n\n/* ---------- Persistence (Claude storage with localStorage fallback) ---------- */\nfunction on(id, evt, handler){\n  try{\n    const el = document.getElementById(id);\n    if(el) el.addEventListener(evt, handler);\n    else console.warn('[painel] elemento não encontrado para listener:', id);\n  }catch(e){ console.error('[painel] falha ao registrar listener em', id, e); }\n}\non('btnSidebarToggle', 'click', ()=>{\n  const sb = document.getElementById('sidebar');\n  const backdrop = document.getElementById('sidebarBackdrop');\n  sb.classList.toggle('mobile-open');\n  backdrop.classList.toggle('show', sb.classList.contains('mobile-open'));\n});\non('sidebarBackdrop', 'click', ()=>{\n  document.getElementById('sidebar').classList.remove('mobile-open');\n  document.getElementById('sidebarBackdrop').classList.remove('show');\n});\ndocument.getElementById('sidebar').addEventListener('click', (e)=>{\n  if(e.target.closest('.tab')){\n    document.getElementById('sidebar').classList.remove('mobile-open');\n    document.getElementById('sidebarBackdrop').classList.remove('show');\n  }\n});\nfunction aplicarTema(tema){\n  document.documentElement.dataset.theme = tema;\n  const btn = document.getElementById('btnTheme');\n  if(btn) btn.innerHTML = tema==='dark' ? '<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z\"/><\/svg>' : '<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/><\/svg>';\n}\non('btnTheme', 'click', async ()=>{\n  const atual = document.documentElement.dataset.theme;\n  const novo = atual==='dark' ? 'light' : 'dark';\n  aplicarTema(novo);\n  try{ await Storage.set('tema', novo, false); }catch(e){}\n});\nwindow.addEventListener('error', (e)=>{\n  console.error('[painel] erro não tratado:', e.error||e.message);\n  try{\n    const status = document.getElementById('importStatus') || document.getElementById('limparStatus');\n    if(status && !status.textContent) status.textContent = 'Ocorreu um erro inesperado na página. Veja o console (F12) para detalhes, ou recarregue a página.';\n  }catch(e2){}\n});\n\n/* ===== modo consulta (outros setores): só leitura, sem Obras/Valores/Fornecedores, com exportação Excel ===== */\nconst CONSULTA = (()=>{ try{ return !!(window.parent && window.parent.pyroConsulta && window.parent.pyroConsulta()); }catch(e){ return false; } })();\nif(CONSULTA) document.documentElement.setAttribute('data-consulta','');\nfunction _roDoc(d){ const no=()=>Promise.reject(new Error('Somente leitura')); return { get:(...a)=>d.get(...a), onSnapshot:(...a)=>d.onSnapshot(...a), set:no, update:no, delete:no }; }\nfunction _roCol(c){ const no=()=>Promise.reject(new Error('Somente leitura')); return { get:(...a)=>c.get(...a), onSnapshot:(...a)=>c.onSnapshot(...a), doc:id=>_roDoc(c.doc(id)), add:no,\n  where:(...a)=>c.where(...a), orderBy:(...a)=>c.orderBy(...a), limit:(...a)=>c.limit(...a) }; }\nfunction _roDb(d){ return { collection:n=>_roCol(d.collection(n)), doc:p=>_roDoc(d.doc(p)) }; }\nlet _dbCap = null, _dbChecked = false, _dbRo = null;\nasync function getDb(){\n  if(CONSULTA && _dbChecked) return _dbCap ? (_dbRo || (_dbRo=_roDb(_dbCap))) : null;\n  if(_dbChecked) return _dbCap;\n  for(let tentativa=0; tentativa<10; tentativa++){\n    try{\n      if(window.claude && typeof window.claude.use==='function'){\n        _dbCap = await window.claude.use('db');\n        _dbChecked = true;\n        if(CONSULTA && _dbCap) return (_dbRo = _dbRo || _roDb(_dbCap));\n        return _dbCap;\n      }\n    }catch(e){}\n    await new Promise(r=>setTimeout(r, 300));\n  }\n  _dbChecked = true;\n  _dbCap = null;\n  return _dbCap;\n}\nlet _assetsCap = null, _assetsChecked = false;\nasync function getAssets(){\n  if(_assetsChecked) return _assetsCap;\n  for(let tentativa=0; tentativa<10; tentativa++){\n    try{\n      if(window.claude && typeof window.claude.use==='function'){\n        _assetsCap = await window.claude.use('assets');\n        _assetsChecked = true;\n        return _assetsCap;\n      }\n    }catch(e){}\n    await new Promise(r=>setTimeout(r, 300));\n  }\n  _assetsChecked = true;\n  _assetsCap = null;\n  return _assetsCap;\n}\n\nconst Storage = {\n  async get(key, shared){\n    const db = await getDb();\n    if(db){\n      try{\n        const snap = await db.doc('painel_meta/'+key).get();\n        return snap.exists ? {key, value: snap.data().value, shared:!!shared} : null;\n      }catch(e){}\n    }\n    try{ const v = window.localStorage.getItem('pedidos_'+key); return v!=null ? {key, value:v, shared:!!shared} : null; }catch(e){ return null; }\n  },\n  async set(key, value, shared){\n    if(CONSULTA) return {key, value, shared:!!shared};\n    const db = await getDb();\n    if(db){\n      try{ await db.doc('painel_meta/'+key).set(_pr({value})); return {key, value, shared:!!shared}; }catch(e){}\n    }\n    try{ window.localStorage.setItem('pedidos_'+key, value); return {key, value, shared:!!shared}; }catch(e){ return null; }\n  },\n};\n\nconst _saved = {};\nfunction _pr(o){ const t = JSON.stringify(o); try{ if(window.parent && window.parent !== window && window.parent.JSON) return window.parent.JSON.parse(t); }catch(e){} return JSON.parse(t); }\nfunction _stab(v){ if(Array.isArray(v)) return '['+v.map(_stab).join(',')+']'; if(v && typeof v==='object') return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+_stab(v[k])).join(',')+'}'; return JSON.stringify(v===undefined?null:v); }\nfunction _savedSet(col, arr){ _saved[col] = new Map(arr.map(x=>[x.id, _stab(x)])); }\nasync function salvarColecao(nomeColecao, itens){\n  if(CONSULTA) return {usouDb:true,total:0,falharam:0};\n  const db = await getDb();\n  if(!db) return {usouDb:false};\n  const _m = _saved[nomeColecao] || (_saved[nomeColecao] = new Map());\n  itens = itens.filter(it=>it && it.id && _m.get(it.id)!==_stab(it));\n  const TAMANHO_LOTE = 15;\n  let falharam = [];\n  for(let i=0; i<itens.length; i+=TAMANHO_LOTE){\n    const lote = itens.slice(i, i+TAMANHO_LOTE);\n    const resultados = await Promise.allSettled(lote.map(item=>db.collection(nomeColecao).doc(item.id).set(_pr(item))));\n    resultados.forEach((r, idx)=>{ if(r.status==='rejected') falharam.push(lote[idx]); else _m.set(lote[idx].id, _stab(lote[idx])); });\n  }\n  if(falharam.length){\n    const aindaFalharam = [];\n    for(const item of falharam){\n      try{ await db.collection(nomeColecao).doc(item.id).set(_pr(item)); _m.set(item.id, _stab(item)); }\n      catch(e){ aindaFalharam.push(item); }\n    }\n    falharam = aindaFalharam;\n  }\n  if(falharam.length){\n    console.error(`[painel] ${falharam.length} de ${itens.length} registro(s) de \"${nomeColecao}\" não foram salvos no banco.`, falharam);\n  }\n  return {usouDb:true, total:itens.length, falharam: falharam.length};\n}\nasync function saveData(){\n  const r = await salvarColecao('painel_pedidos', pedidos);\n  if(!r.usouDb){ try{ await Storage.set('pedidos', JSON.stringify(pedidos), false); }catch(e){} return; }\n  if(r.falharam>0) mostrarAviso(`Atenção: ${r.falharam} de ${r.total} item(ns) não foram salvos no banco (falha passageira de conexão). Tente salvar de novo em alguns segundos.`, 8000);\n}\nasync function deletePedidoDocs(ids){\n  const db = await getDb();\n  if(_saved.painel_pedidos) (ids||[]).forEach(id=>_saved.painel_pedidos.delete(id));\n  if(db && ids && ids.length){ try{ await Promise.all(ids.map(id=>db.collection('painel_pedidos').doc(id).delete())); }catch(e){} }\n}\nasync function saveObras(){\n  const r = await salvarColecao('painel_obras', obras);\n  if(!r.usouDb){ try{ await Storage.set('obras', JSON.stringify(obras), false); }catch(e){} return; }\n  if(r.falharam>0) mostrarAviso(`Atenção: ${r.falharam} de ${r.total} obra(s) não foram salvas no banco. Tente de novo em alguns segundos.`, 8000);\n}\nasync function deleteObraDoc(id){\n  const db = await getDb();\n  if(db){ try{ await db.collection('painel_obras').doc(id).delete(); }catch(e){} }\n}\nasync function saveConfig(){ try{ await Storage.set('config', JSON.stringify(config), false); }catch(e){} }\nasync function saveImportacoes(){\n  const r = await salvarColecao('painel_importacoes', importacoes);\n  if(!r.usouDb){ try{ await Storage.set('importacoes', JSON.stringify(importacoes), false); }catch(e){} return; }\n  if(r.falharam>0) mostrarAviso(`Atenção: ${r.falharam} de ${r.total} importação(ões) não foram salvas no banco.`, 8000);\n}\nasync function deleteImportacaoDoc(id){\n  const db = await getDb();\n  if(db){ try{ await db.collection('painel_importacoes').doc(id).delete(); }catch(e){} }\n}\n\nfunction dataUrlToBlob(dataUrl){\n  const [header, base64] = dataUrl.split(',');\n  const mimeMatch = header.match(/:(.*?);/);\n  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';\n  const binary = atob(base64);\n  const bytes = new Uint8Array(binary.length);\n  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);\n  return new Blob([bytes], {type: mime});\n}\n\nlet anexoCachePedido = {};\nasync function saveAnexoPedido(itemId, fileObj){\n  const assets = await getAssets();\n  const db = await getDb();\n  if(assets && db){\n    try{\n      const blob = dataUrlToBlob(fileObj.dataUrl);\n      const res = await assets.upload(blob);\n      const meta = {assetId: res.id, url: res.url, nome: fileObj.nome, tipo: fileObj.tipo};\n      await db.doc('painel_anexos/'+itemId).set(_pr(meta));\n      anexoCachePedido[itemId] = meta;\n      return true;\n    }catch(e){ console.error('[painel] erro ao subir anexo', e); }\n  }\n  const resultado = await Storage.set('anexo_pedido_'+itemId, JSON.stringify(fileObj), false);\n  if(resultado){ anexoCachePedido[itemId] = fileObj; return true; }\n  return false;\n}\nasync function atualizarUsoArmazenamento(){\n  const textEl = document.getElementById('storageUsageText');\n  const fillEl = document.getElementById('storageProgressFill');\n  if(!textEl) return;\n  textEl.textContent = 'Calculando…';\n  const db = await getDb();\n  if(db){\n    const assets = await getAssets();\n    let usageBytes = 0;\n    if(assets){\n      try{ const info = await assets.list(); if(info && info.usage && info.usage.bytesUsed!=null) usageBytes = info.usage.bytesUsed; }catch(e){}\n    }\n    const totalDocs = pedidos.length + obras.length + importacoes.length + 2;\n    textEl.textContent = `Banco de dados do Claude: ${totalDocs} documento(s) de dados${assets?`, ${(usageBytes/(1024*1024)).toFixed(2)} MB em anexos`:''}. Sem limite fixo por navegador — os dados ficam salvos no link publicado.`;\n    fillEl.style.width = '0%';\n    return;\n  }\n  let total = 0;\n  total += JSON.stringify(pedidos).length;\n  total += JSON.stringify(obras).length;\n  total += JSON.stringify(config).length;\n  total += JSON.stringify(importacoes).length;\n  total += JSON.stringify(comentariosGraficos).length;\n\n  const itensComAnexo = pedidos.filter(p=>p.hasAnexo);\n  for(const p of itensComAnexo){\n    try{\n      const a = await loadAnexoPedido(p.id);\n      if(a) total += JSON.stringify(a).length;\n    }catch(e){}\n  }\n\n  const LIMITE_ESTIMADO = 5 * 1024 * 1024; // ~5MB, limite tipico de localStorage\n  const pct = Math.min(100, Math.round((total/LIMITE_ESTIMADO)*100));\n  const totalMB = (total/(1024*1024)).toFixed(2);\n  fillEl.style.width = pct+'%';\n  fillEl.style.background = pct>=85 ? 'var(--rust)' : pct>=60 ? 'var(--amber)' : 'var(--green)';\n  textEl.textContent = `~${totalMB} MB usados de ~5 MB (estimativa — o limite real varia por navegador). ${itensComAnexo.length} anexo(s) contado(s).`;\n}\nasync function loadAnexoPedido(itemId){\n  if(anexoCachePedido[itemId]) return anexoCachePedido[itemId];\n  const db = await getDb();\n  if(db){\n    try{\n      const snap = await db.doc('painel_anexos/'+itemId).get();\n      if(snap.exists){ const v = snap.data(); anexoCachePedido[itemId]=v; return v; }\n    }catch(e){}\n  }\n  try{ const r = await Storage.get('anexo_pedido_'+itemId, false); if(r){ const v = JSON.parse(r.value); anexoCachePedido[itemId]=v; return v; } }catch(e){}\n  return null;\n}\nasync function viewAnexoPedido(itemId){\n  const a = await loadAnexoPedido(itemId);\n  if(!a){ mostrarAviso('Anexo não encontrado — pode não ter sido salvo corretamente. Tente anexar de novo.'); return; }\n  const src = a.url || a.dataUrl;\n  const w = window.open();\n  if(a.tipo && a.tipo.startsWith('image/')){ w.document.write(`<img src=\"${src}\" style=\"max-width:100%;\">`); }\n  else{ w.location.href = src; }\n}\nfunction verObservacoes(itemId){\n  const p = pedidos.find(x=>x.id===itemId);\n  if(!p) return;\n  const st = itemStats(p);\n  document.getElementById('obsTitle').textContent = `${p.codigo} — ${p.descricao||'sem descrição'}`;\n  document.getElementById('obsSubtitle').textContent = `${p.obra} · Pedido ${p.pedido} · ${p.categoria}`;\n\n  const ce = (label, id, tipo, valor, opcoes)=>{\n    let input;\n    if(tipo==='select'){\n      input = `<select data-editfield=\"${id}\" style=\"width:100%;font-size:12.5px;padding:4px 6px;\">\n        <option value=\"\">—<\/option>\n        ${(opcoes||[]).map(o=>`<option value=\"${o.label}\" ${o.label===valor?'selected':''}>${o.label}<\/option>`).join('')}\n      <\/select>`;\n    }else{\n      const listAttr = id==='fornecedor' ? 'list=\"fornecedorDatalist\"' : id==='tipo' ? 'list=\"tipoDatalist\"' : '';\n      input = `<input type=\"${tipo}\" data-editfield=\"${id}\" value=\"${valor!=null?valor:''}\" ${listAttr} style=\"width:100%;font-size:12.5px;padding:4px 6px;\">`;\n    }\n    return `<div><div style=\"font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);margin-bottom:2px;\">${label}<\/div>${input}<\/div>`;\n  };\n  const ro = (label, val)=>`<div><div style=\"font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);\">${label}<\/div><div class=\"mono\" style=\"color:var(--ink);\">${val}<\/div><\/div>`;\n\n  let camposHtml = [\n    ce('Fornecedor', 'fornecedor', 'text', p.fornecedor||''),\n    ce('Acabamento', 'acabamento', 'text', p.acabamento||''),\n    ce('Tipo', 'tipo', 'text', p.tipo||''),\n  ];\n  if(p.categoria==='Perfil'){\n    camposHtml.push(\n      ce('Peso (kg/m)', 'pesoKgM', 'number', p.pesoKgM||''),\n      ce('Barra (m)', 'barra', 'number', p.barra||''),\n      ro('Peso (Barra)', pesoBarraCalc(p)!=null?fmtQtd(pesoBarraCalc(p)):'—'),\n      ro('Peso (Total)', pesoTotalCalc(p)!=null?fmtQtd(pesoTotalCalc(p)):'—'),\n    );\n  }\n  if(ehCategoriaVidros(p.categoria)){\n    const diffArea = areaEmpDiferencaCalc(p);\n    camposHtml.push(\n      ce('Largura (mm)', 'larguraMm', 'n  const b=document.getElementById(id); if(b) b.style.display='none'; });\n  }\n  document.getElementById('obsOverlay').style.display = 'flex';\n  document.getElementById('obsEditarBtn').onclick = ()=>{\n    document.getElementById('obsOverlay').style.display = 'none';\n    irParaItemNaAba(itemId);\n  };\n  document.getElementById('obsSalvarBtn').onclick = ()=>{\n    const camposNum = ['pesoKgM','barra','larguraMm','alturaMm','areaEmp','qtdePedida','valorPedido'];\n    const atualizado = {...p};\n    document.querySelectorAll('#obsGrid [data-editfield]').forEach(el=>{\n      const campo = el.dataset.editfield;\n      let val = el.value;\n      if(camposNum.includes(campo)) val = val;\n      atualizado[campo] = val;\n    });\n    atualizado.obs = document.getElementById('obsText').value.trim();\n    if(atualizado.qtdePedida==='' || Number(atualizado.qtdePedida)<=0){\n      mostrarAviso('Qtde pedida precisa ser maior que zero.');\n      return;\n    }\n    atualizado.qtdePedida = Number(atualizado.qtdePedida);\n    pedidos = pedidos.map(x=>x.id===itemId?atualizado:x);\n    garantirObraCadastrada(atualizado.obra);\n    saveData(); render(); renderObraDatalist(); renderFornecedorDatalist(); renderObraFilterOptions(); renderCategoriaFilterOptions(); renderPedidoFilterOptions(); renderDashboardHome(); renderValoresHome(); renderFornecedoresHome(); renderRecebimentoHome();\n    document.getElementById('obsOverlay').style.display = 'none';\n    mostrarAviso('Alterações salvas.', 1800);\n  };\n}\non('obsCloseBtn', 'click', ()=>{ document.getElementById('obsOverlay').style.display = 'none'; });\n\nasync function loadData(){\n  try{ if(parent.pyroTheme) aplicarTema(parent.pyroTheme()); }catch(e){}\n  const db = await getDb();\n  if(db){\n    try{\n      const [pedidosSnap, obrasSnap, importSnap] = await Promise.all([\n        db.collection('painel_pedidos').get(),\n        db.collection('painel_obras').get(),\n        db.collection('painel_importacoes').get(),\n      ]);\n      pedidos = pedidosSnap.docs.map(d=>d.data());\n      obras = obrasSnap.docs.map(d=>d.data());\n      importacoes = importSnap.docs.map(d=>d.data());\n      _savedSet('painel_pedidos', pedidos); _savedSet('painel_obras', obras); _savedSet('painel_importacoes', importacoes);\n    }catch(e){\n      console.error('[painel] erro ao carregar do banco de dados', e);\n      pedidos=[]; obras=[]; importacoes=[];\n    }\n  }else{\n    try{ const r=await Storage.get('pedidos', false); pedidos = r?JSON.parse(r.value):[]; }catch(e){ pedidos=[]; }\n    try{ const r=await Storage.get('obras', false); obras = r?JSON.parse(r.value):[]; }catch(e){ obras=[]; }\n    try{ const r=await Storage.get('importacoes', false); importacoes = r?JSON.parse(r.value):[]; }catch(e){ importacoes=[]; }\n  }\n  try{ const r=await Storage.get('comentariosGraficos', false); comentariosGraficos = r?JSON.parse(r.value):{}; }catch(e){ comentariosGraficos={}; }\n  try{\n    const r=await Storage.get('config', false);\n    if(r){\n      const loaded = JSON.parse(r.value);\n      if(!loaded.porCategoria){\n        const legacyDias = loaded.diasAlerta || 10;\n        const legacyKg = loaded.valorKg || 35;\n        const legacyTaxa = loaded.taxaPercent || 2.5;\n        loaded.porCategoria = {\n          'Perfil': { diasAlerta: legacyDias, usaFormula: true, valorKg: legacyKg, taxaPercent: legacyTaxa },\n          'Acessórios': { diasAlerta: legacyDias, usaFormula: false },\n          'Uso e Consumo': { diasAlerta: legacyDias, usaFormula: false },\n        };\n      }\n      if(Array.isArray(loaded.statusErpOptions) && loaded.statusErpOptions.length && typeof loaded.statusErpOptions[0]==='string'){\n        const coresPadrao = {'Em aprovação':'azul-piscina', 'Não atendido':'amarelo', 'Atendido':'verde', 'A/C fiscal':'cinza'};\n        loaded.statusErpOptions = loaded.statusErpOptions.map(label=>({label, color: coresPadrao[label] || 'cinza'}));\n      }\n      config = Object.assign({}, config, loaded);\n    }\n  }c ions); }\nfunction railColor(code){ return {PENDENTE:'var(--rail-idle)', PARCIAL:'var(--amber)', COMPLETO:'var(--green)', SOBRA:'var(--steel)', ATRASADO:'var(--rust)'}[code]||'var(--rail-idle)'; }\n\n/* ---------- Categorias / Obras option renderers ---------- */\nfunction renderCategoriaOptions(){\n  const sel = document.getElementById('f_categoria');\n  sel.innerHTML = config.categorias.map(c=>`<option value=\"${c}\">${c}<\/option>`).join('') + '<option value=\"Não classificado\">Não classificado<\/option>';\n}\nfunction renderStatusErpOptions(){\n  const sel = document.getElementById('f_statuserp');\n  const current = sel.value;\n  sel.innerHTML = '<option value=\"\">—<\/option>' + config.statusErpOptions.map(s=>`<option value=\"${s.label}\">${s.label}<\/option>`).join('');\n  if(config.statusErpOptions.some(s=>s.label===current)) sel.value = current;\n}\nfunction renderFaseOptions(){\n  const sel = document.getElementById('f_fase');\n  if(!sel) return;\n  const current = sel.value;\n  sel.innerHTML = '<option value=\"\">—<\/option>' + config.faseOptions.map(s=>`<option value=\"${s.label}\">${s.label}<\/option>`).join('');\n  if(config.faseOptions.some(s=>s.label===current)) sel.value = current;\n}\nfunction _e(v){ return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\ndocument.addEventListener('change',ev=>{ if(ev.target && ev.target.id==='pc_obra') renderPcDatalist(); });\nfunction _pyLists(){ try{ return (parent.pyroLists && parent.pyroLists()) || {obras:[],fornecedores:[]}; }catch(e){ return {obras:[],fornecedores:[]}; } }\nfunction _nn(s){ return String(s||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim(); }\nfunction obraOpcoes(){\n  const py=_pyLists().obras, rec=[...new Set([...obras.map(o=>o.nome), ...pedidos.map(p=>p.obra)].filter(Boolean))];\n  const out=[], usados=new Set();\n  rec.forEach(n=>{ const o=py.find(o=>[o.nome,...(o.aliases||[])].some(a=>_nn(a)===_nn(n))); if(o) usados.add(o.nome); out.push({v:n, l: o && _nn(o.nome)!==_nn(n) ? n+'  ·  '+o.nome : n}); });\n  py.forEach(o=>{ if(!usados.has(o.nome) && !out.some(x=>_nn(x.v)===_nn(o.nome))) out.push({v:o.nome, l:o.nome}); });\n  return out.sort((a,b)=>a.v.localeCompare(b.v));\n}\nfunction renderObraDatalist(){\n  const dl = document.getElementById('obraDatalist');\n  const ops = obraOpcoes();\n  dl.innerHTML = ops.map(o=>`<option value=\"${_e(o.v)}\">${o.l!==o.v?_e(o.l):''}<\/option>`).join('');\n  document.querySelectorAll('select.pyobra').forEach(sel=>{ const cur=sel.value, first=sel.options[0]?sel.options[0].outerHTML:'';\n    sel.innerHTML = first + ops.map(o=>`<option value=\"${_e(o.v)}\">${_e(o.l)}<\/option>`).join('');\n    if(cur && !ops.some(o=>o.v===cur)) sel.insertAdjacentHTML('beforeend',`<option value=\"${_e(cur)}\">${_e(cur)}<\/option>`);\n    sel.value = cur; });\n  renderPcDatalist();\n}\nfunction renderPcDatalist(){\n  const dl=document.getElementById('pcDatalist'); if(!dl) return;\n  const ob=(document.getElementById('pc_obra')||{}).value||'';\n  const pcs=[...new Set(pedidos.filter(p=>!ob||_nn(p.obra)===_nn(ob)).map(p=>p.pedido).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));\n  const nums=pcs.map(x=>parseInt(String(x).replace(/\\D/g,''),10)).filter(n=>!isNaN(n)), prox=nums.length?'PC'+String(Math.max(...nums)+1).padStart(2,'0'):'';\n  dl.innerHTML=(prox?`<option value=\"${prox}\">próximo número<\/option>`:'')+pcs.map(x=>`<option value=\"${_e(x)}\">já existe<\/option>`).join('');\n}\nfunction renderObraFilterOptions(){\n  const sel = document.getElementById('obraFilter');\n  const current = sel.value;\n  const nomes = [...new Set([...obras.map(o=>o.nome), ...pedidos.map(p=>p.obra)].filter(Boolean))].sort((a,b)=>a.localeCompare(b));\n  sel.innerHTML = '<option value=\"\">Todas as obras<\/option>' + nomes.map(n=>`<option value=\"${n}\">${n}<\/option>`).join('');\n  if(nomes.includes(current)) sel.value = current;\n}\nfunction renderCategoriaFilterOptions(){\n  /* categoria filter dropdown removed — category is now chosen via the Perfil/Acessórios/Uso e Consumo tabs */\n}\nfunction renderPedidoFilterOptions(){\n  const sel = document.getElementById('pedidoFilter');\n  const current = sel.value;\n  /* só os pedidos da obra escolhida (e da aba aberta) */\n  const obraF = (document.getElementById('obraFilter')||{}).value || '';\n  const base = pedidos.filter(p=>(!obraF || p.obra===obraF) && (!currentCategoria || belongsToCategoria(p, currentCategoria)));\n  const nums = [...new Set(base.map(p=>p.pedido).filter(Boolean))].sort((a,b)=>a.localeCompare(b, undefined, {numeric:true}));\n  sel.innerHTML = '<option value=\"\">Todos os pedidos'+(obraF?' desta obra':'')+'<\/option>' + nums.map(n=>`<option value=\"${xlsxEsc(n)}\">${xlsxEsc(n)}<\/option>`).join('');\n  sel.value = nums.includes(current) ? current : '';\n}\nfunction renderFornecedorDatalist(){\n  const dl = document.getElementById('fornecedorDatalist');\n  if(!dl) return;\n  const nomes = [...new Set([...pedidos.map(p=>p.fornecedor), ..._pyLists().fornecedores].filter(Boolean).map(n=>String(n).trim()))].sort((a,b)=>a.localeCompare(b));\n  dl.innerHTML = nomes.map(n=>`<option value=\"${_e(n)}\"><\/option>`).join('');\n}\nfunction garantirObraCadastrada(nome){\n  if(!nome) return;\n  const existe = obras.some(o=>o.nome.trim().toLowerCase()===nome.trim().toLowerCase());\n  if(!existe){ obras.push({id:uid('o'), nome, ativo:'Sim'}); saveObras(); }\n}\n\n/* ---------- Tabs ---------- */\nfunction renderCategoriaTabs(){\n  const wrap = document.getElementById('categoriaTabsWrap');\n  if(!wrap) return;\n  wrap.innerHTML = config.categorias.map(cat=>\n    `<button class=\"tab ${cat===currentCategoria && document.getElementById('view-itens') && document.getElementById('view-itens').classList.contains('active') ? 'active':''}\" data-view=\"itens\" data-categoria=\"${cat}\"><span class=\"tab-label\">${cat}<\/span><\/button>`\n  ).join('');\n  if(!config.categorias.includes(currentCategoria)) currentCategoria = config.categorias[0] || '';\n}\nfunction ativarTab(t){\n  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));\n  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));\n  t.classList.add('active');\n  document.getElementById('view-'+t.dataset.view).classList.add('active');\n  if(t.dataset.view==='itens'){\n    currentCategoria = t.dataset.categoria;\n    currentFilter = 'todos';\n    document.querySelectorAll('#chips .chip').forEach(c=>c.classList.remove('active'));\n    document.querySelector('#chips [data-filter=\"todos\"]').classList.add('active');\n    document.getElementById('search').value='';\n    document.getElementById('pedidoFilter').value='';\n    renderObraFilterOptions();\n    document.getElementById('obraFilter').value = currentObraFilter;\n    renderPedidoFilterOptions();\n    render();\n  }\n  if(t.dataset.view==='dashboard'){ renderDashboardHome(); }\n  if(t.dataset.view==='valores'){ renderValoresHome(); }\n  if(t.dataset.view==='fornecedores'){ renderFornecedoresHome(); }\n  if(t.dataset.view==='recebimento'){ renderRecebimentoHome(); }\n  if(t.dataset.view==='obras'){ renderObras(); }\n}\ndocument.querySelector('.tabs').addEventListener('click', (e)=>{\n  const t = e.target.closest('.tab');\n  if(t) ativarTab(t);\n});\non('btnConfig', 'click', ()=>{\n  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));\n  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));\n  document.getElementById('view-config').classList.add('active');\n  renderConfigView();\n});\n\nfunction belongsToCategoria(p, cat){\n  if(cat==='Perfil') return p.categoria==='Perfil' || p.categoria==='Não classificado' || !p.categoria;\n  return p.categoria===cat;\n}\n\n/* ---------- Render main table ---------- */\nfunction render(){\n  const search = document.getElementById('search').value.trim().toLowerCase();\n  const obraF = document.getElementById('obraFilter').value;\n  const pedF = document.getElementById('pedidoFilter').value;\n  const heading = document.getElementById('itensHeading');\n  if(heading) heading.textContent = obraF ? `${currentCategoria} — ${obraF}` : currentCategoria;\n\n  let list = pedidos.filter(p=>belongsToCategoria(p, currentCategoria)).map(p=>({...p, st: itemStats(p)}));\n\n  if(obraF) list = list.filter(p=>p.obra===obraF);\n  if(pedF) list = list.filter(p=>p.pedido===pedF);\n  if(search) list = list.filter(p=> (p.pedido||'').toLowerCase().includes(search) || (p.codigo||'').toLowerCase().includes(search) || (p.descricao||'').toLowerCase().includes(search));\n\n  document.getElementById('kpiTotal').textContent = list.length;\n  document.getElementById('kpiPendente').textContent = list.filter(p=>p.st.code==='PENDENTE').length;\n  document.getElementById('kpiParcial').textContent = list.filter(p=>p.st.code==='PARCIAL').length;\n  document.getElementById('kpiCompleto').textContent = list.filter(p=>p.st.code==='COMPLETO').length;\n  document.getElementById('kpiSobra').textContent = list.filter(p=>p.st.code==='SOBRA').length;\n\n  if(currentFilter!=='todos') list = list.filter(p=>p.st.displayCode===currentFilter);\n\n  const sortAccessors = {\n    obra: p=>(p.obra||'').toLowerCase(),\n    pedido: p=>(p.pedido||'').toLowerCase(),\n    fornecedor: p=>(p.fornecedor||'').toLowerCase(),\n    codigo: p=>(p.codigo||'').toLowerCase(),\n    descricao: p=>(p.descricao||'').toLowerCase(),\n    categoria: p=>(p.categoria||'').toLowerCase(),\n    qtdePedida: p=>Number(p.qtdePedida)||0,\n    qtdeRecebida: p=>p.st.qtdRecebida,\n    valorPedido: p=>Number(p.valorPedido)||0,\n    previsao: p=>p.previsaoChegada||'',\n    status: p=>p.st.label||'',\n    fase: p=>(p.fase||'').toLowerCase(),\n  };\n  if(sortState.col && sortAccessors[sortState.col]){\n    const acc = sortAccessors[sortState.col];\n    list.sort((a,b)=>{\n      const va=acc(a), vb=acc(b);\n      if(v mtQtd(pesoTotalCalc(p)):'—'}<\/td>\n      <td class=\"mono col-vidros-only\">${p.larguraMm?fmtQtd(p.larguraMm):'—'}<\/td>\n      <td class=\"mono col-vidros-only\">${p.alturaMm?fmtQtd(p.alturaMm):'—'}<\/td>\n      <td class=\"mono col-vidros-only\">${areaRealCalc(p)!=null?areaRealCalc(p).toFixed(2):'—'}<\/td>\n      <td class=\"mono col-vidros-only\">${p.areaEmp?Number(p.areaEmp).toFixed(2):'—'}<\/td>\n      <td class=\"mono col-vidros-only\">${(()=>{ const d=areaEmpDiferencaCalc(p); return d ? `+${d.diff.toFixed(3)} m² (${d.pct.toFixed(1)}%)` : '—'; })()}<\/td>\n      <td class=\"mono\">${fmtQtd(p.qtdePedida)}${p.unidade?' <span style=\"color:var(--ink-soft);font-size:11px\">'+xlsxEsc(p.unidade)+'<\/span>':''}${qtdNaoInteiraAviso(p.qtdePedida)}<\/td>\n      <td class=\"mono\">${fmtQtd(p.st.qtdRecebida)}${qtdNaoInteiraAviso(p.st.qtdRecebida)}<\/td>\n      <td>${formatRecebimentosCell(p.recebimentos)}<\/td>\n      <td class=\"mono\">${fmtMoney(p.valorPedido)}<\/td>\n      <td class=\"mono col-perfil-only\">${p.st.valorRecebido?fmtMoney(p.st.valorRecebido):'—'}<\/td>\n      <td class=\"mono col-perfil-only\">${fmtQtd(p.st.diferenca)}<\/td>\n      <td class=\"col-variacao col-perfil-only\" id=\"tdVariacao-${p.id}\">${priceVariationCell(p, p.st)}<\/td>\n      <td class=\"mono\">${fmtDate(p.previsaoChegada)}<\/td>\n      <td class=\"mono\">${p.codigoErp||'—'}<\/td>\n      <td><span class=\"status-pill ${pillClass(p.st.displayCode)}\">${p.st.label}<\/span><\/td>\n      <td style=\"white-space:nowrap;\">\n        <button class=\"rowbtn\" data-verobs=\"${p.id}\" title=\"Ver detalhes do item\" style=\"color:var(--steel);\">👁<\/button>\n        ${p.hasAnexo ? `<button class=\"rowbtn\" data-veranexo=\"${p.id}\" title=\"Ver anexo\">Anexo<\/button>` : ''}\n        <button class=\"rowbtn\" data-addnota=\"${p.id}\" style=\"color:var(--steel);font-weight:600;\">+ Nota<\/button>\n        <button class=\"rowbtn\" data-edit=\"${p.id}\">Editar<\/button>\n        <button class=\"rowbtn\" data-del=\"${p.id}\">Excluir<\/button>\n      <\/td>\n    `;\n    tbody.appendChild(tr);\n  }\n  tbody.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>openForm(b.dataset.edit)));\n  tbody.querySelectorAll('[data-addnota]').forEach(b=>b.addEventListener('click', ()=>openForm(b.dataset.addnota, true)));\n  tbody.querySelectorAll('[data-veranexo]').forEach(b=>b.addEventListener('click', ()=>viewAnexoPedido(b.dataset.veranexo)));\n  tbody.querySelectorAll('[data-verobs]').forEach(b=>b.addEventListener('click', ()=>verObservacoes(b.dataset.verobs)));\n  tbody.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{\n    const item = pedidos.find(p=>p.id===b.dataset.del);\n    pedidos = pedidos.filter(p=>p.id!==b.dataset.del);\n    deletePedidoDocs([b.dataset.del]);\n    render(); renderDashboardHome(); renderValoresHome(); renderFornecedoresHome(); renderRecebimentoHome();\n    if(item){\n      mostrarDesfazer(`Item \"${item.codigo}\" excluído.`, ()=>{\n        pedidos.push(item);\n        saveData(); render(); renderDashboardHome(); renderValoresHome(); renderFornecedoresHome(); renderRecebimentoHome();\n      });\n    }\n  }));\n  document.querySelectorAll('.col-perfil-only').forEach(el=>{ el.style.display = (currentCategoria==='Perfil') ? '' : 'none'; });\n  document.querySelectorAll('.col-vidros-only').forEach(el=>{ el.style.display = ehCategoriaVidros(currentCategoria) ? '' : 'none'; });\n\n  // ---- Seleção de itens (checkboxes) pro botão \"Baixar selecionados\" ----\n  tbody.querySelectorAll('.chk-selecionar-item').forEach(chk=>chk.addEventListener('change', (e)=>{\n    const id = e.target.dataset.id;\n    if(e.target.checked) selectedIds.add(id); else selectedIds.delete(id);\n    atualizarSelecaoUi(list.map(p=>p.id));\n  }));\n  atualizarSelecaoUi(list.map(p=>p.id));\n}\nfunction atualizarSelecaoUi(idsVisiveis){\n  const chkTodos = document.getElementById('chkSelecionarTodos');\n  if(chkTodos){\n    const selecionad
