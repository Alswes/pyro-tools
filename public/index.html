<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}</style><script src="sanitiza.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="demo-local.js"></script><script src="fb-bridge.js"></script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#E8590C"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Pyro"><link rel="apple-touch-icon" href="icons/pyro-180.png"></head><body>
<title>Pyro Tools · Empresa Exemplo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Shrikhand&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Cinzel:wght@600;700&display=swap">
<style>
/* Layout: menu lateral fixo no desktop (barra inferior no celular), conteúdo em coluna de até 1280px. Marca: brasa (laranja) para ações, verde-água (cobra/dados) para progresso e informação. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface2:#ECEEF4; --line:#DDE0EA; --fg:#161A28; --muted:#5C6478;
  --accent:#D9460F; --accent-ink:#FFFFFF; --accent-soft:#FDE7DD; --accent-2:#F5A524;
  --info:#0B8A80; --info-soft:#D6F0ED;
  --ok:#1B8756; --ok-soft:#DCF3E7; --warn:#A96A00; --warn-soft:#FBEBC8; --bad:#C62E3A; --bad-soft:#FADDDF;
  --c1:#E0601C; --c2:#0E8F86; --c3:#5A64D8; --c4:#C23E7E;
  --brand-grad:linear-gradient(135deg,#E0480F,#F28A1B);
  --hero-grad:linear-gradient(120deg,#FFF1E8 0%,#FFFFFF 55%,#E6F6F4 100%);
  --shadow:0 1px 2px rgba(22,26,40,.06),0 10px 30px rgba(22,26,40,.07);
  --f-ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-disp:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-brand:'Shrikhand','Bricolage Grotesque',Georgia,serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0F16; --surface:#151823; --surface2:#1E2230; --line:#2A2F41; --fg:#ECEFF7; --muted:#9299AE;
  --accent:#FF7A3D; --accent-ink:#1B0A02; --accent-soft:#3A1E10; --accent-2:#FFB84D;
  --info:#3DD3C6; --info-soft:#0F3431;
  --ok:#4CC58C; --ok-soft:#143225; --warn:#E5A93E; --warn-soft:#3A2D10; --bad:#F27C82; --bad-soft:#3D1B1E;
  --c1:#E5652A; --c2:#1FA89C; --c3:#7A75EE; --c4:#D9579A;
  --brand-grad:linear-gradient(135deg,#FF6B2C,#FFB020);
  --hero-grad:linear-gradient(120deg,#2A1A12 0%,#151823 55%,#0F2A28 100%);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F16; --surface:#151823; --surface2:#1E2230; --line:#2A2F41; --fg:#ECEFF7; --muted:#9299AE;
  --accent:#FF7A3D; --accent-ink:#1B0A02; --accent-soft:#3A1E10; --accent-2:#FFB84D;
  --info:#3DD3C6; --info-soft:#0F3431;
  --ok:#4CC58C; --ok-soft:#143225; --warn:#E5A93E; --warn-soft:#3A2D10; --bad:#F27C82; --bad-soft:#3D1B1E;
  --c1:#E5652A; --c2:#1FA89C; --c3:#7A75EE; --c4:#D9579A;
  --brand-grad:linear-gradient(135deg,#FF6B2C,#FFB020);
  --hero-grad:linear-gradient(120deg,#2A1A12 0%,#151823 55%,#0F2A28 100%);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em;font-family:var(--f-disp)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell: sidebar + content */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;min-width:0}
.brand svg{flex:none}
.brand b{display:block;font:400 25px/1.05 var(--f-brand);letter-spacing:0}
.brand b i{font-style:normal;background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{color:var(--muted);font-size:11.5px}
.side .lbl{font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 12px 4px}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;border:0;background:transparent;color:var(--muted);font-weight:500;text-decoration:none;text-align:left;font-size:14px}
.nv:hover{background:var(--surface2);color:var(--fg)}
.nv[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nv .ext{margin-left:auto;opacity:.55;display:flex}
.side .grow{flex:1}
.bkcard{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.bkcard .t{font-weight:600;display:flex;align-items:center;gap:8px}
.bkcard .s{font-size:12px;color:var(--muted)}
.sidefoot{padding:8px 8px 0;font:11.5px var(--f-mono);color:var(--muted);display:flex;flex-direction:column;gap:2px}
.content{min-width:0;display:flex;flex-direction:column}
.topbar2{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500;min-width:0}
.crumb b{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .mob b{font:400 20px/1 var(--f-brand);background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.crumb .mob{display:none;align-items:center;gap:8px}
.tools{display:flex;align-items:center;gap:4px;position:relative}
.ibtn{position:relative;width:38px;height:38px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.ibtn:hover{background:var(--surface2);color:var(--fg)}
.ibtn[aria-pressed="true"],.ibtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.dot{position:absolute;top:1px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font:600 10px/17px var(--f-mono);text-align:center}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-right:8px;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.live.off i{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.bottomnav{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar2{padding:10px 16px}
  .crumb .mob{display:flex}.crumb .desk{display:none}
  .live span{display:none}
  .bottomnav{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottomnav .nv{flex-direction:column;gap:3px;padding:6px 2px;font-size:10.5px;text-align:center;justify-content:center;border-radius:10px;align-items:center}
  .bottomnav .nv .ext{display:none}
  main{padding-bottom:96px!important}
}
.wm{position:fixed;right:14px;bottom:10px;z-index:20;font:500 11px var(--f-mono);letter-spacing:.04em;color:var(--muted);opacity:.6;pointer-events:none;display:flex;align-items:center;gap:6px;text-shadow:0 0 8px var(--bg)}
.wm i{width:6px;height:6px;border-radius:50%;background:var(--brand-grad)}
@media(max-width:900px){.wm{bottom:calc(74px + env(safe-area-inset-bottom,0px));right:10px;font-size:10px}}
.bellpanel{position:absolute;right:0;top:46px;width:min(380px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:40}
.bellpanel h3{font-size:13px;padding:12px 14px;border-bottom:1px solid var(--line)}
.bellpanel button{display:flex;gap:10px;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 14px}
.bellpanel button:hover{background:var(--surface2)}
.bellpanel .empty{padding:18px 14px;color:var(--muted)}

main{max-width:1280px;width:100%;margin:0 auto;padding-inline:24px;padding-block:24px 40px;display:flex;flex-direction:column;gap:28px}
@media(max-width:600px){main{padding-inline:16px}}
footer{max-width:1280px;width:100%;margin:0 auto;padding:0 24px 32px;color:var(--muted);font:12px var(--f-mono);display:flex;flex-wrap:wrap;gap:6px 16px}
@media(max-width:600px){footer{padding-inline:16px}}
.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 28px;border:1px solid var(--line);border-radius:22px;background:var(--hero-grad);box-shadow:var(--shadow);overflow:hidden}
.hero>div:first-child{min-width:0;display:flex;flex-direction:column;gap:12px}
.hero p.lead{margin:0;color:var(--muted);max-width:56ch}
.hero-art{flex:none;display:grid;place-items:center}
@media(max-width:700px){.hero{padding:20px}.hero-art{display:none}}

/* sections */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head>div{min-width:0}
.eyebrow{font:500 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
h1{font-size:clamp(24px,3.4vw,34px);font-weight:800;line-height:1.1;letter-spacing:-.02em}
h2{font-size:16px;font-weight:600}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h .sub{color:var(--muted);font-size:12.5px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.toggle{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);padding:5px 12px 5px 6px;border-radius:999px;font-weight:500}
.toggle .sw{width:34px;height:20px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);position:relative;transition:.15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:.15s}
.toggle[aria-pressed="true"]{border-color:var(--warn);}
.toggle[aria-pressed="true"] .sw{background:var(--warn);border-color:var(--warn)}
.toggle[aria-pressed="true"] .sw::after{left:16px;background:#fff}
select.f,input.f,textarea.f{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
input.f::placeholder{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand-grad);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(224,72,15,.28)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2);color:var(--fg)}
.ro .w{display:none!important}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.kpi{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;min-width:0}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .v{font:500 clamp(15px,1.6vw,24px)/1.15 var(--f-mono);white-space:nowrap;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px}
.kpi.bad .v{color:var(--bad)} .kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)}

/* pills, badges */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface2);color:var(--fg);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--info-soft);color:var(--info)}
.pill.muted{color:var(--muted)}
.tag{font:500 10.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid currentColor;white-space:nowrap}
.tag.a{color:var(--warn)} .tag.c{color:var(--bad)}

/* progress */
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--info);border-radius:4px}
.bar.ok>i{background:var(--ok)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.bar.lg{height:12px;border-radius:6px}

/* obra cards */
.grid-obras{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:16px}
.obra{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;text-align:left;cursor:pointer;min-width:0;transition:border-color .15s,box-shadow .15s}
.obra:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.obra .top1{display:flex;justify-content:space-between;gap:12px}
.obra .top1>div{min-width:0}
.obra h3{font-size:15.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.obra .cli{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.obra .pct{font:500 30px/1 var(--f-mono);letter-spacing:-.03em}
.obra .meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12.5px;margin-top:6px;flex-wrap:wrap}
.linha{display:flex;gap:8px;align-items:flex-start;font-weight:500;overflow-wrap:anywhere}
.linha svg{flex:none;margin-top:2px}
.linha.ok{color:var(--ok)} .linha.warn{color:var(--warn)} .linha.bad{color:var(--bad)} .linha.muted{color:var(--muted)}
.garg{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.garg.bad{border-color:var(--bad);background:var(--bad-soft)}
.garg .k{font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.garg.bad .k{color:var(--bad)}
.garg .t{font-weight:600;overflow-wrap:anywhere}
.garg .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fases{display:flex;flex-wrap:wrap;gap:6px}
.fase{font-size:12px;border:1px solid var(--line);border-radius:7px;padding:3px 8px;display:flex;gap:6px;align-items:center}
.fase b{font:500 11.5px var(--f-mono)}
.fase.full{border-color:var(--ok);color:var(--ok)}

/* panels & tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;min-width:0;box-shadow:var(--shadow)}
.panel>.sec-h{padding:14px 16px 0;margin:0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
a.btn{color:var(--fg);text-decoration:none}
td:first-child{min-width:120px}
td.mono{white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--surface2) 55%,transparent)}
td .t{font-weight:600;overflow-wrap:anywhere}
td .s{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
td.r,th.r{text-align:right}
/* painel da obra (sempre escuro, com as cores do Pyro) */
.db{--dbg:#FBFAF8;--dcard:#FFFFFF;--dline:#E4E6EE;--dfg:#161A28;--dmuted:#5C6478;--dfaint:#8A90A3;--dl:#E5531A;--k1:#E0601C;--k2:#0E8F86;--k3:#5A64D8;--k4:#C23E7E;--dbad:#C62E3A;--dtrack:rgba(22,26,40,.06);--dcross:rgba(22,26,40,.25);--dinput:#F3F4F8;--dbar0:#D5D9E3;--dkv1:#161A28;--dkv2:#8A3410;--dhover:#CDD1DC;--dborder:#E4E6EE;--dg1:rgba(255,107,44,.10);--dg2:rgba(255,184,77,.10);--dg3:rgba(122,117,238,.06);--dshadow:0 1px 2px rgba(22,26,40,.05),0 10px 24px -16px rgba(22,26,40,.25);--dhl:#B4480F;
  position:relative;color:var(--dfg);background:radial-gradient(900px 380px at 12% -10%,var(--dg1),transparent 60%),radial-gradient(700px 360px at 95% 0%,var(--dg2),transparent 60%),radial-gradient(800px 500px at 60% 110%,var(--dg3),transparent 60%),var(--dbg);
  border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px;margin:18px 0 22px;border:1px solid var(--dborder)}

<div id="app"></div>
<div id="recHost" aria-label="Pedidos e Recebimento"></div>

<div id="toast" role="status"></div>

<script>
'use strict';
/* ============ constantes ============ */
const APP={name:'Pyro Tools',version:'0.9.27',pre:'beta.51',build:'20261023.3',codename:'Ember',autor:'Wallety_IT'};
const CHANGELOG=[
 {v:'0.9.27-beta.51',build:'20261023.3',date:'2026-10-23',items:['O tema Infernal passa a se chamar Carmesim (mesmo visual).']},
 {v:'0.9.27-beta.50',build:'20261023.2',date:'2026-10-23',items:['Modo consulta para outros setores: quem recebe o Pyro como Visualizador abre direto em Pedidos e Recebimento (Dashboard, Recebimento e categorias), ao vivo, sem editar e com exportação em Excel.','Obras, Valores, Fornecedores, notas fiscais, entregas e pedidos de compra ficam bloqueados no banco para quem só visualiza.','Recebimento: botões “Baixar Excel” na obra/categoria e no pedido aberto.','Configurações > Acesso: botão para pré-visualizar como outro setor.']},
 {v:'0.9.27-beta.49',build:'20261023.1',date:'2026-10-23',items:['Animação de fogo só nos botões do menu (Pyro Tools e menu lateral do Pedidos e Recebimento). Os demais botões não pegam mais fogo.']},
 {v:'0.9.27-beta.48',build:'20261022.25',date:'2026-10-22',items:['Pedido ganhou a opção “Aprovado, ainda não faturado”: entra no consumo do budget antes da nota, como na planilha de faturamento direto. Quando a nota chega, ela substitui o valor.','Conferência com a planilha de controle de pedidos: consumo do Pyro igual ao da planilha.']},
 {v:'0.9.27-beta.47',build:'20261022.24',date:'2026-10-22',items:['Consumo do budget: nota lançada em duplicidade (mesmo fornecedor, número, valor e vencimento) entra uma vez só na soma; o painel avisa quantas foram ignoradas. Parcelas de boleto e notas divididas entre pedidos continuam somando.']},
 {v:'0.9.27-beta.46',build:'20261022.23',date:'2026-10-22',items:['Números batem em todo o painel: Home, cards das obras, painel da obra e Pedidos e Recebimento usam a mesma régua de itens (linhas do Recebimento).','“Lotes por fase” virou “Recebido por fase”: inclui “Sem fase”, segue os filtros de categoria e fornecedor e soma igual ao Material recebido; clicar numa fase filtra o painel e a lista.','O painel da obra passa a respeitar também o filtro de fase.','“Valor por categoria” virou “Consumido por categoria” (notas + só budget), somando o mesmo valor do consumo do budget.','Desempenho por fornecedor mostra os lançamentos só budget na coluna Pedidos.','Sincronização: itens repetidos no pedido são removidos; pedido recebido fecha também o card de entrega.','Recebimento: botões das obras mostram o nome do Pyro e o progresso de itens.']},
 {v:'0.9.27-beta.45',build:'20261022.22',date:'2026-10-22',items:['Tema Infernal escuro: fundo começa em vermelho no topo e desce em degradê para grafite quase preto; cartões em grafite.']},
 {v:'0.9.27-beta.44',build:'20261022.21',date:'2026-10-22',items:['Resumo do dia: na primeira vez que você abre o Pyro no dia aparece um pop-up com entregas atrasadas, chegadas de hoje e da semana, boletos e as prioridades. Dá para abrir em outra janela (segunda tela) e rever pelo link “ver resumo do dia” na Home.']},
 {v:'0.9.27-beta.43',build:'20261022.20',date:'2026-10-22',items:['Pedidos e Recebimento (tema Infernal): faixa de boas-vindas em vermelho escuro.']},
 {v:'0.9.27-beta.42',build:'20261022.19',date:'2026-10-22',items:['Fogo ao clicar agora é uma chama contínua que envolve o botão (sem bolinhas).','Menu: saiu o atalho Painéis.']},
 {v:'0.9.27-beta.41',build:'20261022.18',date:'2026-10-22',items:['Tema Infernal: ao clicar, o botão inteiro pega fogo (chamas por toda a largura e brilho em brasa).']},
 {v:'0.9.27-beta.40',build:'20261022.17',date:'2026-10-22',items:['Tema Infernal: seleções (filtros, abas, períodos, menu) em vermelho e chamas subindo do botão ao clicar.']},
 {v:'0.9.27-beta.39',build:'20261022.16',date:'2026-10-22',items:['Busca do topo: saiu o “( / )” do texto da caixa (o atalho / continua funcionando).']},
 {v:'0.9.27-beta.38',build:'20261022.15',date:'2026-10-22',items:['Tema Infernal escuro: fundo e cartões em vermelho quase preto, sem o tom marrom.']},
 {v:'0.9.27-beta.37',build:'20261022.14',date:'2026-10-22',items:['Tema Infernal: o dourado fica só nos botões e nos títulos. Molduras dos cartões, menu, topo e campos passam a ter borda neutra de pedra (escuro) ou pergaminho (claro).']},
 {v:'0.9.27-beta.36',build:'20261022.13',date:'2026-10-22',items:['Tema Infernal claro: fundo de pergaminho, molduras em dourado escuro, títulos em ouro envelhecido e vermelho-sangue nos destaques. O botão de tema (claro/escuro/automático) agora alterna entre a versão clara e a escura do Infernal, também em Pedidos e Recebimento.']},
 {v:'0.9.27-beta.35',build:'20261022.12',date:'2026-10-22',items:['Tema Infernal aplicado como padrão para todos, inclusive em Pedidos e Recebimento e no Entregas e Coletas. Os outros visuais (Studio, Alumínio, Clássico) seguem em Configurações → Aparência.']},
 {v:'0.9.27-beta.34',build:'20261022.11',date:'2026-10-22',items:['Tema Infernal: volta o mascote de sempre, só recolorido em vermelho-sangue, com antenas douradas e barriga em brasa.']},
 {v:'0.9.27-beta.33',build:'20261022.10',date:'2026-10-22',items:['Tema Infernal: o mascote Pyro de sempre, só com as cores do tema (vermelho-sangue, antenas douradas, olhos âmbar).']},
 {v:'0.9.27-beta.32',build:'20261022.9',date:'2026-10-22',items:['Tema de teste “Infernal” (fantasia sombria: pedra escura, vermelho sangue e molduras douradas) em Configurações → Aparência.','Visual Studio aplicado como padrão (paleta alumínio no claro, grafite no escuro). Gráficos e medidores do Painel da obra no laranja Pyro sólido. Pedidos e Recebimento e Entregas e Coletas com as mesmas cores. O visual antigo continua em Configurações → Aparência → Clássico.']},
 {v:'0.9.27-beta.31',build:'20261022.8',date:'2026-10-22',items:['Amostra Studio com a paleta alumínio: no claro, fundo cinza frio, cartões brancos e texto grafite; no escuro, grafite frio quase preto. Laranja só no botão principal, logo, menu ativo e alertas.']},
 {v:'0.9.27-beta.30',build:'20261022.7',date:'2026-10-22',items:['Nova amostra de visual “Studio escuro”: menu fino só com ícones, blocos grandes arredondados, indicadores em cartões coloridos empilhados, botões em pílula e o laranja Pyro com o mascote. Só aparência.']},
 {v:'0.9.27-beta.29',build:'20261022.6',date:'2026-10-22',items:['Amostra: paleta alumínio (cinza frio, branco, grafite) com laranja de segurança vivo só nos destaques; saiu o fundo creme.']},
 {v:'0.9.27-beta.28',build:'20261022.5',date:'2026-10-22',items:['Amostra Prancheta técnica, versão moderna: mesmas cores de papel, cantos arredondados, linhas mais claras, sombra leve e o mascote de volta no menu e no início.']},
 {v:'0.9.27-beta.27',build:'20261022.4',date:'2026-10-22',items:['Amostra do visual “Prancheta técnica” (papel milimetrado, linhas finas, cantos retos, IBM Plex, laranja de segurança só nos destaques). Ligue em Configurações → Aparência → Visual. Só muda a aparência; os dados não são tocados.']},
 {v:'0.9.27-beta.26',build:'20261022.3',date:'2026-10-22',items:['Unidade de medida: lista completa (contagem, embalagem, comprimento, área, volume, peso, líquidos, tempo e serviço), com a sigla e o nome de cada unidade no cadastro.']},
 {v:'0.9.27-beta.25',build:'20261022.2',date:'2026-10-22',items:['Pedidos e Recebimento: a lista de pedidos mostra só os pedidos da obra escolhida (e da aba aberta). Ao trocar de obra, a lista é refeita.']},
 {v:'0.9.27-beta.24',build:'20261022.1',date:'2026-10-22',items:['Pedidos e Recebimento: saíram as colunas Status ERP e Fase da tabela e esses campos do cadastro e dos detalhes do item. No cadastro entrou Unidade de medida ao lado da Quantidade pedida; a unidade aparece junto da quantidade na tabela e vai para os itens do pedido no Pyro.']},
 {v:'0.9.27-beta.23',build:'20261021.3',date:'2026-10-21',items:['Relatório semanal: as linhas de atrasadas, próximas chegadas e parciais mostram o nº ERP e os códigos dos itens que ainda faltam receber (até 8, depois “e mais N”). No pedido com vários fornecedores, aparecem só os itens do nº ERP daquele fornecedor.']},
 {v:'0.9.27-beta.22',build:'20261021.2',date:'2026-10-21',items:['Relatório semanal: cada pedido aparece uma vez só. Pedido com vários fornecedores mostra atraso e próximas chegadas por fornecedor, com a previsão de cada um.','Salvar pedido: o botão fica travado enquanto salva, para um clique duplo não criar cards repetidos em Entregas. Cards repetidos sem histórico são apagados sozinhos.']},
 {v:'0.9.27-beta.21',build:'20261021.1',date:'2026-10-21',items:['Relatório diário por obra em tempo real: ao mudar um pedido no painel (status, previsão, reprogramação, chegada), a linha dele no relatório é atualizada na hora, pedidos novos entram e os que saíram somem. O que você editou nas outras linhas é mantido.']},
 {v:'0.9.27-beta.20',build:'20261020.5',date:'2026-10-20',items:['Novo pedido: o botão agora também abre PDF com tabela de itens (código, descrição, quantidade). A prévia mostra o que foi reconhecido antes de salvar.']},
 {v:'0.9.27-beta.19',build:'20261020.4',date:'2026-10-20',items:['Relatório diário no novo padrão: Categoria - PC · item - situação · Previsão em negrito. Textos que você já editou não mudam; use "Restaurar esta obra" para gerar no padrão novo.']},
 {v:'0.9.27-beta.18',build:'20261020.3',date:'2026-10-20',items:['Importar planilha no Recebimento: agora acha o cabeçalho mesmo com título e linhas de grupo acima (ex.: planilhas SC02 de perfis), lê Qtd pedida, fornecedor e obra da coluna Obra, e ignora a linha TOTAL.']},
 {v:'0.9.27-beta.17',build:'20261020.2',date:'2026-10-20',items:['Editar o número do pedido (ou obra/fornecedor) no card do Recebimento: se a troca chegar só em parte das linhas, o Pyro agora aplica o número novo em todas, em vez de separar o pedido em dois cards (ex.: 24 e PC24) com a chegada parcial dividida entre eles.']},
 {v:'0.9.27-beta.16',build:'20261020.1',date:'2026-10-20',items:['Pedidos e Recebimento: os botões Baixar Excel (.xlsx) e Baixar selecionados agora salvam o arquivo (o download passa pelo Pyro, como nos relatórios).']},
 {v:'0.9.27-beta.15',build:'20261019.9',date:'2026-10-19',items:['Pedidos e Recebimento: removida a legenda “Pyro Tools · mesmo banco do follow-up” acima do título.']},
 {v:'0.9.27-beta.14',build:'20261019.8',date:'2026-10-19',items:['Obras: ao editar o nome ou o “nome no Recebimento” de uma obra, o nome antigo some da lista de obras do Recebimento (quando nenhuma linha usa), em vez de ficar duplicado.']},
 {v:'0.9.27-beta.13',build:'20261019.7',date:'2026-10-19',items:['Textos voltados às compras: saiu “liberar lote / montagem / linha de produção”. Agora aparece “Faltam receber N itens”, “Compras concluídas: todos os itens recebidos” e “Atenção · item mais urgente das compras”.']},
 {v:'0.9.27-beta.12',build:'20261019.6',date:'2026-10-19',items:['Pedido com vários fornecedores: não existe mais fornecedor principal. Ao clicar em “Comprar em vários fornecedores”, o fornecedor e o valor de cima somem e todos os fornecedores ficam em linhas iguais (valor, status, nº no ERP e previsão). Com um só fornecedor volta ao formulário simples.']},
 {v:'0.9.27-beta.11',build:'20261019.5',date:'2026-10-19',items:['Pedido com vários fornecedores: corrigida a aparência dos campos (texto ilegível no tema escuro). Agora cada campo tem rótulo (Fornecedor, Valor, Status, Nº no ERP, Previsão de entrega) e segue as cores do tema.']},
 {v:'0.9.27-beta.10',build:'20261019.4',date:'2026-10-19',items:['Pedido com vários fornecedores: cada fornecedor tem o seu status (em cotação, em análise, aguardando aprovação da obra ou interna, comprado, recebido), o seu nº no ERP e a sua previsão de entrega, porque a obra aprova cada compra. O status do pedido mãe é calculado pelos fornecedores e o relatório diário mostra a situação de cada um.']},
 {v:'0.9.27-beta.9',build:'20261019.3',date:'2026-10-19',items:['Pedido com vários fornecedores: no pedido, “Adicionar outro fornecedor” (fornecedor, valor e entregue). O valor do pedido passa a somar todos. Em Registrar chegada, escolha qual fornecedor entregou e marque se ele concluiu; o card mostra “2 de 3 fornecedores entregues” e o pedido mãe fecha sozinho quando o último entrega (também fecha pelo Recebimento quando todos os itens chegam). O texto do relatório diário já editado não é alterado.']},
 {v:'0.9.27-beta.8',build:'20261019.2',date:'2026-10-19',items:['Relatório diário por obra: cada caixa agora é um editor com barra de formatação (tamanho da fonte, negrito, itálico, sublinhado, lista, link). O botão Copiar e-mail do dia copia com a formatação, para colar direto no e-mail.']},
 {v:'0.9.27-beta.7',build:'20261019.1',date:'2026-10-19',items:['Relatórios: novo “Relatório diário por obra” para o e-mail de fim de expediente. Uma linha por OP (OP · categoria · item · início da cotação · situação), sem valores, notas fiscais ou boletos. O texto é editável, tem botão Copiar e-mail do dia e Abrir no e-mail.']},
 {v:'0.9.26-beta.6',build:'20261016.4',date:'2026-10-16',items:['Registrar chegada: ao anexar o romaneio (PDF ou foto), o Claude já lê o documento e preenche as quantidades, a NF, o romaneio e a data, sem precisar clicar no botão. Se houver romaneio anexado e todos os itens estiverem marcados como chegados sem a leitura, o Pyro avisa antes de confirmar, para não fechar o pedido por engano como chegada final.']},
 {v:'0.9.26-beta.5',build:'20261016.3',date:'2026-10-16',items:['Registrar chegada: o pedido pode chegar em mais de uma nota e mais de um romaneio. Use “Adicionar outra nota / romaneio” (cada documento tem NF, romaneio, valor e vencimento) e remova o que não precisar. Cada nota vira uma nota fiscal ligada ao pedido; quando os itens vêm em notas diferentes, escolha a NF de cada item na tabela.','O percentual que já chegou agora é calculado sozinho: pelas quantidades dos itens ou, quando o pedido não tem itens, pelo valor das notas sobre o valor do pedido (somando as chegadas anteriores). Você ainda pode digitar o percentual; apague o campo para voltar ao automático.','A leitura do romaneio preenche o documento certo: se já houver outro romaneio na chegada, ela cria um novo documento em vez de sobrescrever.']},
 {v:'0.9.26-beta.4',build:'20261016.2',date:'2026-10-16',items:['Notas fiscais: nova caixa “Simples remessa (não gera financeiro)”. A nota continua ligada ao pedido e à entrega, mas fica sem boleto e sem vencimento e não entra em Notas a pagar, vencidas, valor em notas nem no consumo do budget. Aparece na lista com a etiqueta “simples remessa”.']},
 {v:'0.9.26-beta.3',build:'20261016.1',date:'2026-10-16',items:['Painel da obra: os gráficos “Valor por categoria” e “Mix por fornecedor” agora mostram o valor das notas fiscais (antes mostravam o maior entre comprometido e notas). O comprometido continua no detalhe ao passar o mouse e na tabela de fornecedores.']},
 {v:'0.9.26-beta.2',build:'20261015.1',date:'2026-10-15',items:['Pedidos: ao editar o número do pedido, obra ou fornecedor no card, a sincronização agora espera todos os itens terminarem de salvar antes de decidir o nome. Antes ela podia reverter parte dos itens e o pedido aparecia duplicado em dois cards (ex.: PC15 e PC15 - FASE 3).']},
 {v:'0.9.26-beta.1',build:'20261014.1',date:'2026-10-14',items:['Registrar chegada: anexe o romaneio (PDF ou foto) e clique em “Ler romaneio anexado e preencher os itens”. O Claude lê o documento, confere com os itens pendentes do pedido e preenche as quantidades, o número do romaneio, a NF, a data e o valor; peças anotadas como devolvidas ou quebradas ficam de fora. Você revisa e confirma, e o Recebimento é lançado item a item.']},
 {v:'0.9.25-beta.1',build:'20261008.3',date:'2026-10-08',items:['Número de romaneio digitado no campo de NF do Recebimento (mais de 9 dígitos ou começando com ROM) não vira mais nota fiscal em Notas Fiscais.']},
 {v:'0.9.24-beta.1',build:'20261008.2',date:'2026-10-08',items:['Pedidos e Recebimento: gravações feitas dentro da tela (editar item, editar pedido no card, importar) agora chegam ao banco. Antes o banco do Pyro recusava os dados criados dentro da tela embutida e aparecia “1 de 1 item(ns) não foram salvos”.']},
 {v:'0.9.23-beta.1',build:'20261008.1',date:'2026-10-08',items:['Pedidos e Recebimento: corrigido o erro que fazia a edição de itens importados por planilha (ex.: vidros) voltar ao valor anterior. O banco recusava a gravação por causa de um campo vazio do anexo; agora salva.']},
 {v:'0.9.22-beta.1',build:'20261007.5',date:'2026-10-07',items:['Pedidos e Recebimento: item sem código agora pode ser editado e salvo (basta ter descrição). Antes o formulário exigia o código e não salvava.','Ao colar itens de planilha, linhas de resumo como “Nº de linhas”, “Diferença” e “Total” sem código são ignoradas.']},
 {v:'0.9.21-beta.1',build:'20261007.4',date:'2026-10-07',items:['Consumo do budget = notas fiscais + lançamentos “só budget” que ainda não têm nota (ex.: orçamento aprovado de um fornecedor e serviços feitos pela própria empresa), igual à “Porcentagem Consumida Contrato” das planilhas de gerenciamento.']},
 {v:'0.9.20-beta.1',build:'20261007.3',date:'2026-10-07',items:['Consumo do budget igual à planilha de controle: agora é o total faturado (notas fiscais, sem as pagas pela empresa) sobre o contrato. O valor comprometido em pedidos (inclui o que ainda não foi faturado) aparece logo abaixo, como informação extra.']},
 {v:'0.9.19-beta.1',build:'20261007.2',date:'2026-10-07',items:['Budget sem arredondamento: percentuais de consumo com duas casas (ex.: 0,28%) e valores com centavos no painel da obra, nos cards das obras, na Home e nos relatórios.']},
 {v:'0.9.18-beta.1',build:'20261007.1',date:'2026-10-07',items:['Painel da obra: consumo do budget abaixo de 10% aparece com uma casa decimal (ex.: 0,3%) em vez de arredondar para 0%.']},
 {v:'0.9.17-beta.1',build:'20261006.4',date:'2026-10-06',items:['Backup: quando o navegador permite, abre a janela "Salvar como" para escolher a pasta, e lembra a última pasta usada. Se não permitir, baixa como antes.']},
 {v:'0.9.16-beta.1',build:'20261006.3',date:'2026-10-06',items:['Pedidos e Recebimento: botão Editar em cada card de pedido (e dentro do pedido) para trocar nº do pedido, obra, fornecedor, nº do ERP e previsão de todos os itens de uma vez. A mudança sobe para o pedido no Pyro, Entregas e Notas; dá para desfazer.']},
 {v:'0.9.15-beta.1',build:'20261006.2',date:'2026-10-06',items:['Excluir em Pedidos e Recebimento agora vale: quando todos os itens de um pedido são apagados lá, o pedido sai do Pyro e de Entregas (antes o Pyro recriava um item vazio). Se o pedido já tiver nota fiscal ou chegada registrada, ele continua só no budget.']},
 {v:'0.9.14-beta.1',build:'20261006.1',date:'2026-10-06',items:['Tudo conversa na hora: a nota fiscal lançada no Pyro pode ser ligada ao pedido (o Pyro sugere quando só há um pedido aberto daquela obra e fornecedor, ou quando a nota cita o PC ou o nº do ERP).','Ao salvar a nota ligada a um pedido, o Pyro abre a confirmação da chegada com os itens que faltam: o que você marcar vai direto para Pedidos e Recebimento, a entrega fica parcial ou recebida e o pedido fecha sozinho quando tudo chega.','Registrar chegada em Entregas também lança item a item no Recebimento (antes a chegada parcial não chegava lá).','Nota ligada a pedido sem chegada registrada aparece como pendência na Home, em Entregas e em Notas Fiscais, com o botão para registrar.','Importação de notas em lote ganhou a coluna Pedido.','Se o número da NF for corrigido no Recebimento, a nota com o número antigo sai de Notas Fiscais (quando ninguém mexeu nela).']},
 {v:'0.9.13-beta.1',build:'20261005.14',date:'2026-10-05',items:['Tabelas cabem na tela sem arrastar para o lado: no computador o texto quebra linha, o botão do próximo passo fica abaixo do status e nomes de anexos longos são abreviados (nome completo ao passar o mouse); em telas menores (tablet e celular) cada linha vira um cartão com os títulos das colunas.','Painel da obra: valores dos cartões (ex.: Notas a pagar) e do budget aparecem completos, sem cortar os centavos.']},
 {v:'0.9.12-beta.1',build:'20261005.13',date:'2026-10-05',items:['Painéis (obra e notas fiscais) mostram os valores exatos, com centavos, em vez de arredondados (ex.: R$ 774.567,29 em vez de R$ 775 mil).']},
 {v:'0.9.11-beta.1',build:'20261005.12',date:'2026-10-05',items:['Notas Fiscais: opção "Pago pela empresa (fora do budget da obra)". A nota continua na lista, com a etiqueta "pago pela empresa", mas não conta no budget nem nos gastos da obra.']},
 {v:'0.9.10-beta.1',build:'20261005.11',date:'2026-10-05',items:['Painel da obra: nota sem pedido ligado entra na categoria do fornecedor (ex.: nota de um fornecedor de perfis conta em Perfis), então o filtro por categoria bate com o Controle de Notas.','Com filtro de categoria, o aviso de budget diz "sem budget de Perfis cadastrado na obra" em vez de "obra sem budget".']},
 {v:'0.9.9-beta.1',build:'20261005.10',date:'2026-10-05',items:['Notas Fiscais: filtro de período (este mês, 3 meses, 6 meses, este ano) e os indicadores do topo passam a respeitar os filtros.','Novo painel "Gastos em notas fiscais": total gasto, pago, a pagar e vencido; gasto por fornecedor, por obra e por mês; participação por fornecedor e tabela-resumo com total, pago, a pagar e vencido de cada fornecedor. Clique numa barra ou no nome para filtrar e baixe o resumo em .csv.']},
 {v:'0.9.8-beta.1',build:'20261005.9',date:'2026-10-05',items:['Painel da obra segue o tema (claro ou escuro).','Conferência dos números do painel: em "Tudo", o valor em notas inclui todas as notas da obra; a contagem de notas considera parcelas e notas divididas entre pedidos como uma nota só; Pedidos, Ticket médio, Recebimento por categoria e a tabela de fornecedores não contam mais os pedidos só budget (eles seguem só no consumo do budget).']},
 {v:'0.9.7-beta.1',build:'20261005.8',date:'2026-10-05',items:['Pedidos "só budget" não entram mais como item aguardado: ficam fora do gargalo, do "Aguardando N itens", do % de material recebido e das fases. Continuam contando no consumo do budget.']},
 {v:'0.9.6-beta.1',build:'20261005.7',date:'2026-10-05',items:['Pedidos "só budget": valores aprovados ou já faturados que entram no consumo do contrato sem gerar item no Recebimento nem card em Entregas (ex.: saldo de pedido, serviços da própria empresa).']},
 {v:'0.9.5-beta.1',build:'20261005.6',date:'2026-10-05',items:['Budget comprometido: cada pedido conta pelo maior valor entre o informado, a soma dos itens e as notas fiscais ligadas a ele (antes, um valor digitado errado ou zerado distorcia o percentual).','Registrar chegada com NF que já estava em Notas Fiscais agora usa a mesma nota, sem criar uma duplicada.']},
 {v:'0.9.4-beta.1',build:'20261005.5',date:'2026-10-05',items:['Pedidos: novo status "Em análise" (entre Em cotação e as aprovações) e nova fase "Outros".']},
 {v:'0.9.3-beta.1',build:'20261005.4',date:'2026-10-05',items:['Todo pedido cadastrado no Pyro entra na hora em Pedidos e Recebimento, inclusive os que ainda estão em cotação e os que não têm itens colados (entram como uma linha com a descrição do pedido, que acompanha as mudanças de descrição e valor).','Ao colar os itens depois num pedido que tinha só essa linha automática, a opção Substituir já vem marcada.']},
 {v:'0.9.2-beta.1',build:'20261005.3',date:'2026-10-05',items:['Novo pedido: o botão Abrir planilha aceita Excel (.xlsx, .xls) além de .csv. O painel acha a linha de títulos (código, descrição, quantidade, valor), ignora linhas de total e, se houver várias abas, deixa escolher qual usar.']},
 {v:'0.9.1-beta.1',build:'20261005.2',date:'2026-10-05',items:['Pedidos e Recebimento › Importar: a obra agora é escolhida numa lista com as obras atuais do Pyro (com o nome usado no recebimento e o nome da obra), o Nº do pedido sugere o próximo PC e mostra os que já existem, e o fornecedor lista todos os fornecedores cadastrados.']},
 {v:'0.9.0-beta.1',build:'20261005.1',date:'2026-10-05',items:['Painel da obra no estilo Power BI: filtros de período (30 d, 90 d, 6 m, tudo), categoria e fornecedor que valem para o painel inteiro e para a lista de pedidos.','Novos visuais: consumo do budget (realizado × budget), ticket médio, mix por fornecedor, valor por categoria e top itens.','Clique numa barra, fatia ou fornecedor da tabela para filtrar tudo (clique de novo para tirar o filtro).','Valores de pedidos sem valor informado passam a usar a soma dos itens ou das notas.']},
 {v:'0.9.0-beta.1',build:'20261005.1',date:'2026-10-05',items:['Obra: novo painel escuro com as cores do Pyro, com valor em notas por semana, medidor de material recebido, cartões com mini gráficos, budget × comprometido por categoria, mix por categoria, recebimento por categoria, top fornecedores e tabela de desempenho por fornecedor (ordenável).','Passe o mouse (ou use Tab) nos gráficos para ver os valores.','Cores das categorias revisadas para ficarem distinguíveis também para quem tem daltonismo.']},
 {v:'0.8.1-beta.1',build:'20261001.3',date:'2026-10-01',items:['Importação: vários boletos para a mesma nota (inclusive vários boletos na mesma página ou no mesmo PDF), ligados pelo número do documento ou pelo valor/vencimento de cada parcela.','Importação: vencimento lido do quadro Fatura/Duplicatas, dos rótulos "Venc." e das informações complementares (datas com ano de 2 ou 4 dígitos); se só houver prazo (ex.: 30/60/90 DDL), calcula a partir da emissão e avisa.','Notas com parcelas: lista de boletos na nota (vencimento, valor, paga, linha digitável), indicação "parcela 2/3" na lista e botão "Pagar parcela" que avança para o próximo vencimento.']},
 {v:'0.8.0-beta.1',build:'20261001.2',date:'2026-10-01',items:['Notas Fiscais: arraste (ou escolha) os PDFs/XML das notas e dos boletos de uma vez. O painel lê fornecedor, cliente, número, valor, emissão e vencimento, liga cada boleto à sua nota e mostra uma prévia para conferir e editar antes de salvar.','Prévia com "Aplicar nas selecionadas" (fornecedor, obra, emissão e vencimento em lote), aviso de notas já cadastradas e arquivos anexados automaticamente.','Fornecedor reconhecido pelo CNPJ; se não existir, dá para cadastrar direto da prévia. O CNPJ fica gravado para as próximas importações.','Obras: cadastro de responsáveis (nome, e-mail e cargo) que recebem as notas fiscais.','Enviar ao cliente: monta o e-mail com as notas da obra para os responsáveis e registra a data de envio.']},
 {v:'0.7.1-beta.1',build:'20261001.1',date:'2026-10-01',items:['Configurações > Planilhas: lista as planilhas importadas no Recebimento com botão Excluir planilha (apaga a planilha e os itens dela, com confirmação e aviso de itens que já têm recebimento) ou Só remover da lista (mantém os itens).']},
 {v:'0.7.0-beta.1',build:'20260930.11',date:'2026-09-30',items:['Pedidos e Recebimento agora faz parte do Pyro Tools (menu Pedidos e Recebimento), com o mesmo banco de dados: dashboard, recebimento por item, importação de planilhas, valores e fornecedores continuam iguais.','Sincronização automática nos dois sentidos: item ou pedido cadastrado no Recebimento cria/atualiza o pedido do follow-up (itens, fornecedor, nº ERP, previsão, notas e status), e pedido cadastrado ou colado no follow-up aparece no Recebimento.','Registrar a chegada final no follow-up dá baixa nos itens do Recebimento; quando todos os itens chegam pelo Recebimento, o pedido vira Recebido e a nota entra no Controle de Notas.','Obras têm o campo Nome(s) no Recebimento, para ligar nomes diferentes da mesma obra. Nomes sem vínculo aparecem em Configurações > Completar cadastro.','Excluir um pedido no follow-up também exclui os itens dele no Recebimento.','Os painéis antigos de Pedidos e Recebimento e de Notas e Boletos viraram atalhos para o Pyro Tools. O Controle de Entregas continua separado, com o link em Entregas e Coletas.']},
 {v:'0.6.0-beta.1',build:'20260930.10',date:'2026-09-30',items:['Novo pedido com todos os itens de uma vez: cole as linhas copiadas do Excel ou do ERP (código, descrição, quantidade, unidade, valor unitário) ou abra um arquivo .csv. O painel mostra a prévia antes de salvar.','Se a descrição e o valor ficarem em branco, o pedido usa o primeiro item e a soma dos totais.','Em pedidos que já têm itens, dá para adicionar mais linhas ou substituir a lista.','A busca geral e a busca de pedidos agora encontram também código e descrição dos itens.']},
 {v:'0.5.3-beta.1',build:'20260930.9',date:'2026-09-30',items:['Campos de budget da obra em formato dinheiro (R$ 1.234.567,89, digitando só números)','Corrigido: valores de budget salvos pelo formulário eram multiplicados por 1000 (ponto decimal era removido)','Cards de KPI com valores longos não estouram mais para o card vizinho']},
 {v:'0.5.2-beta.1',build:'20260930.7',date:'2026-09-30',items:[
  'Correção: o botão Salvar do pedido não funcionava (o campo Descrição do item tinha um nome interno que colidia com o formulário do navegador).',
  'Avisos de campo obrigatório agora aparecem em vermelho dentro da janela, com o campo destacado, em vez de sumir na parte de baixo.',
  'Pedido que já estava Comprado (ex.: importado) pode ser salvo sem o nº do ERP; ele continua no alerta até você informar. O ERP só é obrigatório ao marcar Comprado.']},
 {v:'0.5.1-beta.1',build:'20260930.6',date:'2026-09-30',items:[
  'Busca geral no topo (atalho /): encontra pedidos (item, OP, PC, nº do ERP, obra, fornecedor), notas fiscais (NF, romaneio, responsável, observação), fornecedores e obras.',
  'Busca por texto na lista de pedidos da Home e da obra, com filtro por fornecedor.',
  'Entregas e Coletas: filtro por período (de/até) e busca também por ERP, NF e romaneio.',
  'Notas Fiscais: filtro por fornecedor, por período de vencimento, chave Só vencidas e ordenação (chegada, vencimento ou valor).',
  'Configurações > Fornecedores: campo de busca.',
  'Botão Limpar filtros nas telas de Entregas e Notas.']},
 {v:'0.5.0-beta.1',build:'20260930.5',date:'2026-09-30',items:[
  'Bancos unidos: as 13 entregas e coletas do Controle de Entregas e as 109 notas do Painel de Notas e Boletos foram trazidas para cá (42 notas já existiam e foram completadas; 67 são novas). Os apps originais não foram alterados.',
  'Chegada parcial: registre o que chegou (% do pedido, NF, romaneio, observação e nova previsão do restante) sem fechar o pedido.',
  'Anexos de PDF e imagem na NF, no romaneio e em cada chegada.',
  'Nova tela Relatórios: relatório semanal por obra (copiar ou baixar) e cobrança de fornecedores com rascunho de e-mail.',
  'Configurações > Completar cadastro: defina responsável, fase, Curva A e Crítico dos pedidos importados, um a um ou em lote.',
  'Configurações > Acesso: papéis Compras, Fiscal e Somente leitura por pessoa. Obras, fornecedores, colaboradores e acessos só podem ser alterados por quem edita o painel.',
  'Correção: a lista de Fase (Modelo, Tipo, Embasamento, Complemento, Aditivo) aparecia vazia nos pedidos e nos filtros.',
  'Correção: a verificação de permissão de escrita agora é respeitada (antes era ignorada).']},
 {v:'0.4.0-beta.1',build:'20260930.4',date:'2026-09-30',items:[
  'Suíte Pyro Tools: Entregas e Coletas, Notas e Boletos, Pedidos e Recebimento e o hub de Painéis agora usam o mesmo visual, menu e mascote (dados mantidos, tudo responsivo).',
  'Menu com atalhos para Pedidos e Recebimento e para o hub de Painéis.']},
 {v:'0.3.1-beta.1',build:'20260930.3',date:'2026-09-30',items:[
  'Tipografia de destaque: nome Pyro Tools em Shrikhand e títulos em Bricolage Grotesque.']},
 {v:'0.3.0-beta.1',build:'20260930.2',date:'2026-09-30',items:[
  'Novo mascote Pyro: uma chama-robô com antenas, olhos grandes e sorriso.',
  'Campo Nº do pedido no ERP, obrigatório ao marcar o pedido como Comprado (depois de cotado e aprovado).',
  'Nº do ERP aparece nas listas de pedidos e de entregas; pedidos comprados sem o número geram alerta e entram na verificação de integridade.',
  'Pedidos importados receberam o nº do ERP a partir do código ERP do painel antigo (24 de 41).']},
 {v:'0.2.0-beta.1',build:'20260930.1',date:'2026-09-30',items:[
  'Novo nome: Pyro Tools, com o mascote Pyro (cobra de fogo).',
  'Novo visual: menu lateral, tema claro e escuro renovados, versão para celular com barra inferior.',
  'Versionamento no padrão semântico (MAJOR.MINOR.PATCH-pré-lançamento) e marca Desenvolvido por Wallety_IT.',
  'Banco de dados: tabelas, navegador de registros, exportação CSV e verificação de integridade.',
  'Backup completo em arquivo e restauração (mesclar ou substituir).',
  'Menu com atalho para Notas e Boletos.',
  'Correção: ícones de engrenagem e de tema estavam trocados.']},
 {v:'0.1.1',build:2,date:'2026-09-30',items:[
  'Importação do Painel de Pedidos e Recebimento: 3 obras, 41 pedidos (316 itens), entregas, 69 notas fiscais e 17 fornecedores.',
  'Pedidos importados mostram a lista de itens (código, descrição, quantidade pedida e recebida) ao abrir a edição.']},
 {v:'0.1.0',build:1,date:'2026-09-29',items:[
  'Primeira versão: Home com KPIs por obra, filtro Curva A / Críticos e alertas de gargalo.',
  'Cadastro de obras com CNPJ, budget de contrato e budget por categoria.',
  'Pedidos por obra, fase e categoria, com responsável pela cotação, status e justificativa de alteração.',
  'Ao finalizar a cotação, o card de entrega é criado automaticamente em Entregas e Coletas.',
  'Histórico de reprogramações de data por fornecedor (alerta de inconstância).',
  'Registro de chegada com nota fiscal e romaneio, alimentando o Controle de Notas Fiscais.',
  'Configurações: obras, fornecedores, colaboradores, tema e versão.']}
