nt-types\">\n<Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/>\n<Default Extension=\"xml\" ContentType=\"application/xml\"/>\n<Override PartName=\"/xl/workbook.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml\"/>\n<Override PartName=\"/xl/worksheets/sheet1.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml\"/>\n<Override PartName=\"/xl/styles.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml\"/>\n<\/Types>`;\n}\nfunction xlsxRootRelsXml(){\n  return `<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">\n<Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"xl/workbook.xml\"/>\n<\/Relationships>`;\n}\nfunction xlsxSheetXml({cols, rows, merges, freezeRow}){\n  const colsXml = cols.length ? `<cols>${cols.map((c,i)=>`<col min=\"${i+1}\" max=\"${i+1}\" width=\"${c.width}\" customWidth=\"1\"/>`).join('')}<\/cols>` : '';\n  const dim = `A1:${xlsxColLetter(cols.length)}${rows.length}`;\n  const rowsXml = rows.map((row, ri)=>{\n    const r = ri+1;\n    const cellsXml = row.cells.map((cell, ci)=>{\n      if(cell == null) return '';\n      const ref = `${xlsxColLetter(ci+1)}${r}`;\n      const s = cell.style != null ? ` s=\"${cell.style}\"` : '';\n      if(cell.type === 's'){\n        if(cell.value === '' || cell.value == null) return `<c r=\"${ref}\"${s}/>`;\n        return `<c r=\"${ref}\"${s} t=\"inlineStr\"><is><t xml:space=\"preserve\">${xlsxEsc(cell.value)}<\/t><\/is><\/c>`;\n      }\n      if(cell.value === '' || cell.value == null) return `<c r=\"${ref}\"${s}/>`;\n      return `<c r=\"${ref}\"${s}><v>${cell.value}<\/v><\/c>`;\n    }).join('');\n    const h = row.height ? ` ht=\"${row.height}\" customHeight=\"1\"` : '';\n    return `<row r=\"${r}\"${h}>${cellsXml}<\/row>`;\n  }).join('');\n  const mergesXml = merges && merges.length ? `<mergeCells count=\"${merges.length}\">${merges.map(m=>`<mergeCell ref=\"${m}\"/>`).join('')}<\/mergeCells>` : '';\n  const paneXml = freezeRow ? `<sheetViews><sheetView workbookViewId=\"0\"><pane ySplit=\"${freezeRow-1}\" topLeftCell=\"A${freezeRow}\" activePane=\"bottomLeft\" state=\"frozen\"/><\/sheetView><\/sheetViews>` : '<sheetViews><sheetView workbookViewId=\"0\"/><\/sheetViews>';\n  return `<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<worksheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" xmlns:r=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships\">\n<dimension ref=\"${dim}\"/>\n${paneXml}\n${colsXml}\n<sheetData>${rowsXml}<\/sheetData>\n${mergesXml}\n<\/worksheet>`;\n}\n\nasync function construirXlsxEstilizado(lista){\n  lista = lista || pedidos;\n  const fixedCols = [\n    { header: 'OBRA', width: 20 },\n    { header: 'CATEGORIA', width: 14 },\n    { header: 'Nº PEDIDO', width: 13 },\n    { header: 'FORNECEDOR', width: 22 },\n    { header: 'CÓDIGO', width: 14 },\n    { header: 'DESCRIÇÃO', width: 42 },\n    { header: 'ACABAMENTO', width: 16 },\n    { header: 'QTDE PEDIDA', width: 12 },\n    { header: 'VALOR PEDIDO', width: 15 },\n    { header: 'DATA DO PEDIDO', width: 14 },\n    { header: 'STATUS', width: 15 },\n    { header: 'OBSERVAÇÕES', width: 30 },\n  ];\n  const recebSubCols = ['NF', 'DATA', 'QNT', 'VALOR'];\n  const recebColWidths = [12, 12, 9, 13];\n  const maxGrupos = Math.max(1, Math.min(4, lista.reduce((m,p)=> Math.max(m, (p.recebimentos||[]).length), 1)));\n\n  const cols = fixedCols.map(c=>({width:c.width}));\n  for(let g=0; g<maxGrupos; g++) recebSubCols.forEach((_,si)=>cols.push({width:recebColWidths[si]}));\n\n  const rows = [];\n  const row1Cells = fixedCols.map(c=>({type:'s', value:c.header, style:XS.HEADER}));\n  const row2Cells = fixedCols.map(()=>({type:'s', value:'', style:XS.HEADER}));\n  for(let g=0; g<maxGrupos; g++){\n    row1Cells.push({type:'s', value:`RECEBIMENTO ${maxGrupos>1?(g+1):''}`.trim(), style:XS.HEADER});\n    row1Cells.push(null, null, null);\n    recebSubCols.forEach(label=>row2Cells.push({type:'s', value:label, style:XS.SUBHEADER}));\n  }\n  rows.push({cells: row1Cells, height:22});\n  rows.push({cells: row2Cells, height:18});\n\n  lista.forEach((p)=>{\n    let st;\n    try{ st = itemStats(p); }catch(e){ st = {label:''}; }\n    const cells = [\n      {type:'s', value:p.obra||'', style:XS.DATA},\n      {type:'s', value:p.categoria||'', style:XS.DATA},\n      {type:'s', value:p.pedido||'', style:XS.DATA},\n      {type:'s', value:p.fornecedor||'', style:XS.DATA},\n      {type:'s', value:p.codigo||'', style:XS.DATA},\n      {type:'s', value:p.descricao||'', style:XS.DATA},\n      {type:'s', value:p.acabamento||'', style:XS.DATA},\n      {type:'n', value:p.qtdePedida||0, style:XS.DATA},\n      {type:'n', value:Number(p.valorPedido)||0, style:XS.CURRENCY},\n      p.dataPedido ? {type:'n', value:xlsxDateSerial(p.dataPedido), style:XS.DATE} : {type:'n', value:'', style:XS.DATA},\n      {type:'s', value:st.label||'', style:XS.DATA},\n      {type:'s', value:p.obs||'', style:XS.DATA},\n    ];\n    const recebs = p.recebimentos||[];\n    for(let g=0; g<maxGrupos; g++){\n      const r = recebs[g];\n      cells.push({type:'s', value: r ? (r.nf||'') : '', style:XS.DATA});\n      cells.push(r && r.data ? {type:'n', value:xlsxDateSerial(r.data), style:XS.DATE} : {type:'n', value:'', style:XS.DATA});\n      cells.push({type:'n', value: r ? (Number(r.qtd)||0) : '', style:XS.DATA});\n      cells.push({type:'n', value: r ? (Number(r.valor)||0) : '', style:XS.CURRENCY});\n    }\n    rows.push({cells});\n  });\n\n  const merges = [];\n  fixedCols.forEach((c,i)=>{ const col=xlsxColLetter(i+1); merges.push(`${col}1:${col}2`); });\n  for(let g=0; g<maxGrupos; g++){\n    const startCol = fixedCols.length + g*4 + 1;\n    merges.push(`${xlsxColLetter(startCol)}1:${xlsxColLetter(startCol+3)}1`);\n  }\n\n  const sheetXml = xlsxSheetXml({cols, rows, merges, freezeRow:3});\n  const zip = new JSZip();\n  zip.file('[Content_Types].xml', xlsxContentTypesXml());\n  zip.file('_rels/.rels', xlsxRootRelsXml());\n  zip.file('xl/workbook.xml', xlsxWorkbookXml('Pedidos'));\n  zip.file('xl/_rels/workbook.xml.rels', xlsxWorkbookRelsXml());\n  zip.file('xl/styles.xml', xlsxStylesXml());\n  zip.file('xl/worksheets/sheet1.xml', sheetXml);\n  const buf = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});\n  return buf;\n}\n\n// A biblioteca JSZip pode ainda estar sendo baixada do CDN no exato momento em que a\n// pessoa clica no botão (ex: clique rápido logo após abrir a página, ou conexão mais\n// lenta) — por isso esperamos alguns segundos com tentativas repetidas, em vez de\n// falhar na primeira checagem.\nasync function waitForJSZip(timeoutMs){\n  const inicio = Date.now();\n  while(typeof JSZip === 'undefined' && (Date.now()-inicio) < timeoutMs){\n    await new Promise(r=>setTimeout(r, 250));\n  }\n  return typeof JSZip !== 'undefined';\n}\n\nfunction exportarXlsxSimples(filenameBase, lista){\n  // Fallback sem estilo, usando a biblioteca XLSX (mais leve, já usada na importação),\n  // pra garantir que o download sempre aconteça mesmo se a versão estilizada (JSZip) falhar.\n  lista = lista || pedidos;\n  const rows = lista.map(p=>{\n    let st;\n    try{ st = itemStats(p); }catch(e){ st = {qtdRecebida:'', valorRecebido:'', label:''}; }\n    return {\n      'Obra': p.obra, 'Categoria': p.categoria, 'Nº Pedido': p.pedido, 'Fornecedor': p.fornecedor||'', 'Código': p.codigo, 'Descrição': p.descricao,\n      'Acabamento': p.acabamento, 'Tipo': p.tipo||'', 'Qtde Pedida': p.qtdePedida, 'Qtde Recebida': st.qtdRecebida,\n      'Valor Pedido': p.valorPedido, 'Valor Recebido': st.valorRecebido, 'Data do Pedido': p.dataPedido||'',\n      'Status': st.label, 'Observações': p.obs||'',\n    };\n  });\n  const ws = XLSX.utils.json_to_sheet(rows);\n  const wb = XLSX.utils.book_new();\n  XLSX.utils.book_append_sheet(wb, ws, 'Pedidos');\n  const wbArray = XLSX.write(wb, {bookType:'xlsx', type:'array'});\n  return { blob: new Blob([wbArray], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), filename: `${filenameBase}.xlsx` };\n}\n\nasync function baixarBlob(blob, filename){\n  let baixou = false;\n  try{ if(window.parent && window.parent.pyroSave){ const ok0 = await window.parent.pyroSave(filename, blob); if(ok0) return true; } }catch(e){ console.error('[painel] pyroSave', e); }\n  try{ const dl0 = window.claude && await window.claude.use('downloads'); if(dl0){ await dl0.save({filename, data: blob}); return true; } }catch(e){ if(e && e.code==='declined') return true; }\n  try{\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url; a.download = filename;\n    document.body.appendChild(a);\n    a.click();\n    document.body.removeChild(a);\n    setTimeout(()=>URL.revokeObjectURL(url), 30000);\n    baixou = true;\n  }catch(e){ console.error('[painel] falha ao baixar via Blob/anchor', e); }\n\n  if(!baixou && window.claude && typeof window.claude.use==='function'){\n    try{\n      const dl = await window.claude.use('downloads');\n      if(dl){ await dl.save({filename, data: blob}); baixou = true; }\n    }catch(e){ console.error('[painel] falha ao baixar via capability downloads', e); }\n  }\n  return baixou;\n}\n\nasync function baixarListaExcel(lista, base){\n  if(!lista || !lista.length){ mostrarAviso('Não há itens para exportar.', 4000); return; }\n  const nome = String(base||'Pedidos').replace(/[\\\\/:*?\"<>|]+/g,' ').replace(/\\s+/g,'_').slice(0,80)+'_'+todayStr();\n  let blob=null, filename=nome+'.xlsx';\n  try{\n    const ok = typeof JSZip !== 'undefined' || await waitForJSZip(6000);\n    if(ok) blob = await Promise.race([construirXlsxEstilizado(lista), new Promise((_,rej)=>setTimeout(()=>rej(new Error('tempo')),15000))]);\n  }catch(e){ blob=null; }\n  if(!blob){ const s = exportarXlsxSimples(nome, lista); blob=s.blob; filename=s.filename; }\n  const baixou = await baixarBlob(blob, filename);\n  mostrarAviso(baixou?'Planilha Excel baixada.':'Não foi possível baixar o Excel. Tente de novo.', baixou?3000:6000);\n}\non('btnXlsxRecObra','click',()=>{ const l=pedidos.filter(p=>p.obra===recDrillObra && (!recDrillCategoria || belongsToCategoria(p, recDrillCategoria))); baixarListaExcel(l, recDrillObra+(recDrillCategoria?' '+recDrillCategoria:'')); });\nif(CONSULTA){ const _t=document.getElementById('dashComentario'); if(_t){ _t.readOnly=true; _t.placeholder='Sem observações para este gráfico.'; } }\non('btnXlsxRecPedido','click',()=>{ baixarListaExcel(itensDoGrupo(recDrillPedidoAberto), recDrillObra+' '+recDrillPedidoAberto); });\non('btnExportXlsx', 'click', async ()=>{\n  try{\n    if(!pedidos.length){\n      mostrarAviso('Não há itens para exportar ainda.', 4000);\n      return;\n    }\n    const filename = `Backup_Pedidos_${todayStr()}.xlsx`;\n\n    const jsZipOk = typeof JSZip !== 'undefined' || await waitForJSZip(8000);\n    if(!jsZipOk){\n      console.error('[painel] JSZip não carregou a tempo — usando exportação simples (sem estilo) como alternativa.');\n      const { blob, filename: fnSimples } = exportarXlsxSimples(`Backup_Pedidos_${todayStr()}`);\n      const baixou = await baixarBlob(blob, fnSimples);\n      if(baixou) mostrarAviso('A versão estilizada não carregou a tempo — baixamos uma planilha simples (sem a formatação do modelo) pra não te deixar sem o arquivo. Tente de novo em alguns segundos pra ter a versão estilizada.', 9000);\n      else mostrarAviso('Não foi possível baixar o Excel nesse navegador/aba. Tente novamente ou use o backup completo (.json) como alternativa.', 8000);\n      return;\n    }\n\n    // Rede de segurança extra: se a geração/compactação do zip travar por algum motivo\n    // (sem lançar erro, só nunca terminando), não deixa o clique \"morto\" pra sempre —\n    // desiste depois de um tempo e cai na exportação simples.\n    let blob;\n    try{\n      blob = await Promise.race([\n        construirXlsxEstilizado(),\n        new Promise((_,rej)=>setTimeout(()=>rej(new Error('tempo esgotado ao gerar a planilha estilizada')), 15000)),\n      ]);\n    }catch(eGerar){\n      console.error('[painel] geração da planilha estilizada travou ou falhou — usando exportação simples.', eGerar);\n      const fallback0 = exportarXlsxSimples(`Backup_Pedidos_${todayStr()}`);\n      const baixouFallback0 = await baixarBlob(fallback0.blob, fallback0.filename);\n      if(baixouFallback0) mostrarAviso('Não consegui gerar a versão estilizada a tempo, mas baixei uma versão simples da planilha.', 7000);\n      else mostrarAviso('Não foi possível baixar o Excel nesse navegador/aba. Tente novamente ou use o backup completo (.json) como alternativa.', 8000);\n      return;\n    }\n    const baixou = await baixarBlob(blob, filename);\n    if(baixou) mostrarAviso('Planilha Excel baixada.', 3000);\n    else{\n      // Rede de segurança: se nem o Blob/âncora nem a capability de downloads funcionaram\n      // (ex: navegador/aba bloqueando downloads automáticos), tenta a exportação simples\n      // como último recurso antes de desistir.\n      console.error('[painel] download da planilha estilizada falhou nos dois métodos — tentando exportação simples como último recurso.');\n      const fallback = exportarXlsxSimples(`Backup_Pedidos_${todayStr()}`);\n      const baixouFallback = await baixarBlob(fallback.blob, fallback.filename);\n      if(baixouFallback) mostrarAviso('Não consegui baixar a versão estilizada, mas baixei uma versão simples da planilha.', 7000);\n      else mostrarAviso('Não foi possível baixar o Excel nesse navegador/aba. Tente novamente, clicando diretamente no botão (sem esperar), ou use o backup completo (.json) como alternativa.', 9000);\n    }\n  }catch(e){\n    console.error('[painel] erro ao exportar xlsx', e);\n    // Mesmo com erro na geração estilizada, tenta a versão simples antes de desistir.\n    try{\n      const fallback = exportarXlsxSimples(`Backup_Pedidos_${todayStr()}`);\n      const baixouFallback = await baixarBlob(fallback.blob, fallback.filename);\n      if(baixouFallback){ mostrarAviso('Ocorreu um erro ao gerar a planilha estilizada, mas baixei uma versão simples no lugar.', 8000); return; }\n    }catch(e2){ console.error('[painel] fallback também falhou', e2); }\n    mostrarAviso('Ocorreu um erro ao gerar o Excel: ' + (e && e.message ? e.message : e), 8000);\n  }\n});\n\non('btnExportXlsxSelecionados', 'click', async ()=>{\n  try{\n    if(!selectedIds.size){\n      mostrarAviso('Marque ao menos um item na tabela antes de baixar os selecionados.', 4000);\n      return;\n    }\n    const selecionados = pedidos.filter(p=>selectedIds.has(p.id));\n    if(!selecionados.length){\n      mostrarAviso('Não há itens para exportar ainda.', 4000);\n      return;\n    }\n    const filename = `Selecionados_Pedidos_${todayStr()}.xlsx`;\n\n    const jsZipOk = typeof JSZip !== 'undefined' || await waitForJSZip(8000);\n    if(!jsZipOk){\n      console.error('[painel] JSZip não carregou a tempo — usando exportação simples (sem estilo) como alternativa.');\n      const { blob, filename: fnSimples } = exportarXlsxSimples(`Selecionados_Pedidos_${todayStr()}`, selecionados);\n      const baixou = await baixarBlob(blob, fnSimples);\n      if(baixou) mostrarAviso('A versão estilizada não carregou a tempo — baixamos uma planilha simples (sem a formatação do modelo) pra não te deixar sem o arquivo. Tente de novo em alguns segundos pra ter a versão estilizada.', 9000);\n      else mostrarAviso('Não foi possível baixar o Excel nesse navegador/aba. Tente novamente ou use o backup completo (.json) como alternativa.', 8000);\n      return;\n    }\n\n    let blob;\n    try{\n      blob = await Promise.race([\n ult);\n  }));\n});\ndocument.addEventListener('click', (e)=>{\n  const wrap = document.getElementById('globalSearchResults');\n  if(!wrap) return;\n  if(!e.target.closest('#globalSearch') && !e.target.closest('#globalSearchResults')){\n    wrap.style.display = 'none';\n  }\n});\nfunction gerarRelatorioPedido(){\n  const pedidoSel = document.getElementById('dashDrillPedido').value;\n  let itens = pedidos.filter(p=>p.obra===dashDrillObra && belongsToCategoria(p, dashDrillCategoria));\n  if(pedidoSel) itens = itens.filter(p=>p.pedido===pedidoSel);\n  itens = itens.map(p=>({...p, st:itemStats(p)}));\n\n  const counts = {COMPLETO:0, VAICHEGAR:0, PENDENTE:0, SOBRA:0};\n  for(const p of itens){\n    if(p.st.code==='COMPLETO') counts.COMPLETO++;\n    else if(p.st.code==='SOBRA') counts.SOBRA++;\n    else if(p.st.code==='PARCIAL') counts.VAICHEGAR++;\n    else counts.PENDENTE++;\n  }\n  const slices = [\n    {value:counts.COMPLETO, color:'#3F7D5C'},\n    {value:counts.VAICHEGAR, color:'#C99A2E'},\n    {value:counts.PENDENTE, color:'#C4501F'},\n    {value:counts.SOBRA, color:'#2C5F8A'},\n  ];\n  const svg = itens.length ? buildPieSVG(slices, 160) : '';\n  const valorPedidoTotal = itens.reduce((s,p)=> s + (Number(p.valorPedido)||0), 0);\n  const valorRecebidoTotal = itens.reduce((s,p)=> s + p.st.valorRecebido, 0);\n  const pct = valorPedidoTotal ? Math.min(100, (valorRecebidoTotal/valorPedidoTotal)*100) : 0;\n\n  const mostrarPeso = dashDrillCategoria==='Perfil';\n  const chave = dashDrillObra+'||'+dashDrillCategoria+'||'+(pedidoSel||'geral');\n  const comentario = comentariosGraficos[chave] || '';\n\n  const linhas = itens.map(p=>`\n    <tr>\n      <td>${p.fornecedor||'—'}<\/td>\n      <td>${p.codigo||'—'}<\/td>\n      <td>${p.descricao||'—'}<\/td>\n      ${mostrarPeso ? `<td>${p.pesoKgM?fmtPeso(p.pesoKgM):'—'}<\/td><td>${p.barra?fmtQtd(p.barra):'—'}<\/td><td>${pesoTotalCalc(p)!=null?fmtQtd(pesoTotalCalc(p)):'—'}<\/td>` : ''}\n      <td>${fmtQtd(p.qtdePedida)}<\/td>\n      <td>${fmtQtd(p.st.qtdRecebida)}<\/td>\n      <td style=\"font-size:10px;\">${(p.recebimentos||[]).map(r=>`${r.nf||'S/N'} · ${fmtDate(r.data)} · ${fmtQtd(r.qtd)}un`).join('<br>')||'—'}<\/td>\n      <td>${fmtMoney(p.valorPedido)}<\/td>\n      <td>${p.st.valorRecebido?fmtMoney(p.st.valorRecebido):'—'}<\/td>\n      <td>${p.st.label}<\/td>\n    <\/tr>`).join('');\n\n  document.getElementById('relatorioImpressao').innerHTML = `\n    <div style=\"font-family:Arial,sans-serif;padding:10px 0;\">\n      <h1 style=\"font-size:18px;margin:0 0 2px;\">Relatório de Pedido<\/h1>\n      <p style=\"margin:0 0 14px;color:#333;font-size:12px;\">${dashDrillObra} · ${dashDrillCategoria} · Pedido ${pedidoSel||'(todos)'} · Gerado em ${new Date().toLocaleString('pt-BR')}<\/p>\n      <div style=\"display:flex;gap:24px;align-items:flex-start;margin-bottom:16px;\">\n        <table style=\"width:auto;\">\n          <tr><td><b>Itens<\/b><\/td><td>${itens.length}<\/td><\/tr>\n          <tr><td><b>% recebido (valor R$)<\/b><\/td><td>${pct.toFixed(0)}%<\/td><\/tr>\n          <tr><td><b>% recebido (qtde de itens)<\/b><\/td><td>${itens.length ? Math.round(((counts.COMPLETO+counts.SOBRA)/itens.length)*100) : 0}%<\/td><\/tr>\n          <tr><td><b>Completos<\/b><\/td><td>${counts.COMPLETO}<\/td><\/tr>\n          <tr><td><b>Com sobra<\/b><\/td><td>${counts.SOBRA}<\/td><\/tr>\n          <tr><td><b>Chegou parcial<\/b><\/td><td>${counts.VAICHEGAR}<\/td><\/tr>\n          <tr><td><b>Pendentes<\/b><\/td><td>${counts.PENDENTE}<\/td><\/tr>\n          <tr><td><b>Valor total pedido<\/b><\/td><td>${fmtMoney(valorPedidoTotal)}<\/td><\/tr>\n          <tr><td><b>Valor total recebido<\/b><\/td><td>${fmtMoney(valorRecebidoTotal)}<\/td><\/tr>\n        <\/table>\n        <div style=\"text-align:center;\">${svg}<\/div>\n      <\/div>\n      ${comentario ? `<p style=\"font-size:12px;background:#f3f3f3;padding:8px 10px;border-radius:6px;margin-bottom:16px;\"><b>Observações:<\/b> ${comentario}<\/p>` : ''}\n      <table>\n        <thead><tr>\n          <th>Fornecedor<\/th><th>Código<\/th><th>Descrição<\/th>\n          ${mostrarPeso ? '<th>Peso (kg/m)<\/th><th>Barra (m)<\/th><th>Peso (Total)<\/th>' : ''}\n          <th>Qtde Pedida<\/th><th>Qtde Recebida<\/th><th>Notas Recebidas<\/th><th>Valor Pedido<\/th><th>Valor Recebido<\/th><th>Status<\/th>\n        <\/tr><\/thead>\n        <tbody>${linhas}<\/tbody>\n      <\/table>\n    <\/div>\n  `;\n}\non('btnPrintDash', 'click', ()=>{\n  gerarRelatorioPedido();\n  document.body.classList.add('print-report-mode');\n  setTimeout(()=>{\n    window.print();\n    setTimeout(()=>{ document.body.classList.remove('print-report-mode'); }, 300);\n  }, 50);\n});\nwindow.addEventListener('afterprint', ()=>{ document.body.classList.remove('print-report-mode'); });\non('dashDrillPedido', 'change', renderDashDrill);\n\n/* ---------- Valores: comparar valor inicial x valor faturado por NF ---------- */\nlet valDrillObra = '';\nlet valDrillCategoria = '';\n\nfunction renderValoresHome(){\n  const nomes = renderObraButtons('valObraButtons', valDrillObra, selecionarObraValores);\n  document.getElementById('valObraEmpty').style.display = nomes.length?'none':'block';\n  if(valDrillObra && !nomes.includes(valDrillObra)) valDrillObra = '';\n  if(!valDrillObra){\n    document.getElementById('valCategoriaWrap').style.display = 'none';\n    document.getElementById('valContent').style.display = 'none';\n    return;\n  }\n  document.getElementById('valCategoriaWrap').style.display = 'block';\n  document.getElementById('valCategoriaLabel').textContent = `Categoria em ${valDrillObra}`;\n  renderCategoriaChipsWrap('valCategoriaChips', valDrillCategoria, selecionarCategoriaValores);\n  if(!valDrillCategoria){\n    document.getElementById('valContent').style.display = 'none';\n    return;\n  }\n  document.getElementById('valContent').style.display = 'block';\n  renderValoresTabela();\n}\nfunction selecionarObraValores(obra){ valDrillObra = obra; valDrillCategoria=''; renderValoresHome(); }\nfunction selecionarCategoriaValores(cat){ valDrillCategoria = cat; renderValoresHome(); }\n\nfunction statusValor(pctDiff){\n  if(Math.abs(pctDiff) < 1) return {code:'manteve', label:'Manteve-se', cls:'st-manteve'};\n  if(pctDiff < 0) return {code:'abaixou', label:'Abaixou', cls:'st-abaixou'};\n  return {code:'alterou', label:'Alterou', cls:'st-subiu-valor'};\n}\nfunction renderValoresTabela(){\n  const itens = pedidos.filter(p=>p.obra===valDrillObra && belongsToCategoria(p, valDrillCategoria));\n  const linhas = [];\n  for(const p of itens){\n    const qtdePedida = Number(p.qtdePedida)||0;\n    const valorPedido = Number(p.valorPedido)||0;\n    if(qtdePedida<=0 || !valorPedido) continue;\n    const unitInicial = valorPedido/qtdePedida;\n    if(!isFinite(unitInicial) || unitInicial<=0) continue;\n    for(const r of (p.recebimentos||[])){\n      const qtd = Number(r.qtd)||0, valor = Number(r.valor)||0;\n      if(qtd<=0 || !valor) continue;\n      const unitNota = valor/qtd;\n      const pct = ((unitNota-unitInicial)/unitInicial)*100;\n      linhas.push({p, r, unitInicial, unitNota, pct, st: statusValor(pct)});\n    }\n  }\n\n  document.getElementById('vkManteve').textContent = linhas.filter(l=>l.st.code==='manteve').length;\n  document.getElementById('vkAbaixou').textContent = linhas.filter(l=>l.st.code==='abaixou').length;\n  document.getElementById('vkAlterou').textContent = linhas.filter(l=>l.st.code==='alterou').length;\n\n  const tbody = document.getElementById('valTbody');\n  tbody.innerHTML = '';\n  document.getElementById('valEmpty').style.display = linhas.length?'none':'block';\n  const railColorMap = {manteve:'var(--green)', abaixou:'var(--steel)', alterou:'var(--amber)'};\n  for(const l of linhas){\n    const tr = document.createElement('tr');\n    tr.innerHTML = `\n      <td class=\"rail\"><div style=\"background:${railColorMap[l.st.code]}\"><\/div><\/td>\n      <td class=\"mono\">${l.p.pedido}<\/td>\n      <td class=\"mono\">${l.p.codigo}<\/td>\n      <td>${l.p.descricao||'—'}<\/td>\n      <td class=\"mono\">${l.r.nf||'—'}<\/td>\n      <td class=\"mono\">${fmtDate(l.r.data)}<\/td>\n      <td class=\"mono\">${fmtMoney(l.unitInicial)}<\/td>\n      <td class=\"mono\">${fmtMoney(l.unitNota)}<\/td>\n      <td class=\"mono\">${l.pct>0?'+':''}${l.pct.toFixed(1)}%<\/td>\n      <td><span class=\"status-pill ${l.st.cls}\">${l.st.label}<\/span><\/td>\n    `;\n    tbody.appendChild(tr);\n  }\n}\n\n/* ---------- Fornecedores: variação de preço e prazo médio, por fornecedor ---------- */\nlet fornDrillObra = '';\nlet fornDrillCategoria = '';\nfunction renderFornecedoresHome(){\n  const nomes = renderObraButtons('fornObraButtons', fornDrillObra, selecionarObraFornecedores);\n  document.getElementById('fornObraEmpty').style.display = nomes.length?'none':'block';\n  if(fornDrillObra && !nomes.includes(fornDrillObra)) fornDrillObra = '';\n  if(!fornDrillObra){\n    document.getElementById('fornCategoriaWrap').style.display = 'none';\n    document.getElementById('fornContent').style.display = 'none';\n    return;\n  }\n  document.getElementById('fornCategoriaWrap').style.display = 'block';\n  document.getElementById('fornCategoriaLabel').textContent = `Categoria em ${fornDrillObra}`;\n  renderCategoriaChipsWrap('fornCategoriaChips', fornDrillCategoria, selecionarCategoriaFornecedores);\n  if(!fornDrillCategoria){\n    document.getElementById('fornContent').style.display = 'none';\n    return;\n  }\n  document.getElementById('fornContent').style.display = 'block';\n  renderFornecedoresTabela();\n}\nfunction selecionarObraFornecedores(obra){ fornDrillObra = obra; fornDrillCategoria=''; renderFornecedoresHome(); }\nfunction selecionarCategoriaFornecedores(cat){ fornDrillCategoria = cat; renderFornecedoresHome(); }\n\nfunction renderFornecedoresTabela(){\n  const itens = pedidos.filter(p=>p.obra===fornDrillObra && belongsToCategoria(p, fornDrillCategoria) && p.fornecedor);\n  const porFornecedor = {};\n  for(const p of itens){\n    if(!porFornecedor[p.fornecedor]) porFornecedor[p.fornecedor] = {itens:0, manteve:0, abaixou:0, alterou:0, prazos:[]};\n    const grupo = porFornecedor[p.fornecedor];\n    grupo.itens++;\n\n    const qtdePedida = Number(p.qtdePedida)||0;\n    const valorPedido = Number(p.valorPedido)||0;\n    if(qtdePedida>0 && valorPedido){\n      const unitInicial = valorPedido/qtdePedida;\n      for(const r of (p.recebimentos||[])){\n        const qtd = Number(r.qtd)||0, valor = Number(r.valor)||0;\n        if(qtd<=0 || !valor) continue;\n        const unitNota = valor/qtd;\n        const pct = ((unitNota-unitInicial)/unitInicial)*100;\n        const st = statusValor(pct);\n        if(st.code==='manteve') grupo.manteve++;\n        else if(st.code==='abaixou') grupo.abaixou++;\n        else grupo.alterou++;\n      }\n    }\n\n    if(p.dataPedido && p.recebimentos && p.recebimentos.length){\n      const datasValidas = p.recebimentos.map(r=>r.data).filter(Boolean).sort();\n      if(datasValidas.length){\n        const dPedido = new Date(p.dataPedido);\n        const dPrimeira = new Date(datasValidas[0]);\n        const dias = Math.round((dPrimeira-dPedido)/(1000*60*60*24));\n        if(!isNaN(dias) && dias>=0) grupo.prazos.push(dias);\n      }\n    }\n  }\n\n  const nomes = Object.keys(porFornecedor).sort((a,b)=>a.localeCompare(b));\n  const tbody = document.getElementById('fornTbody');\n  tbody.innerHTML = '';\n  document.getElementById('fornEmpty').style.display = nomes.length?'none':'block';\n  for(const nome of nomes){\n    const g = porFornecedor[nome];\n    const prazoMedio = g.prazos.length ? Math.round(g.prazos.reduce((a,b)=>a+b,0)/g.prazos.length) : null;\n    const tr = document.createElement('tr');\n    tr.innerHTML = `\n      <td>${nome}<\/td>\n      <td class=\"mono\">${g.itens}<\/td>\n      <td class=\"mono\" style=\"color:var(--green);\">${g.manteve}<\/td>\n      <td class=\"mono\" style=\"color:var(--steel);\">${g.abaixou}<\/td>\n      <td class=\"mono\" style=\"color:var(--amber-text);\">${g.alterou}<\/td>\n      <td class=\"mono\">${prazoMedio!=null ? prazoMedio+' dia(s)' : '—'}<\/td>\n      <td style=\"white-space:nowrap;\">\n        <button class=\"rowbtn\" data-fornedit=\"${nomes.indexOf(nome)}\">Editar<\/button>\n        <button class=\"rowbtn\" data-forndel=\"${nomes.indexOf(nome)}\" style=\"color:var(--rust);\">Excluir<\/button>\n      <\/td>\n    `;\n    tbody.appendChild(tr);\n  }\n  tbody.querySelectorAll('[data-fornedit]').forEach(b=>b.addEventListener('click', ()=>abrirEdicaoFornecedor(nomes[Number(b.dataset.fornedit)])));\n  tbody.querySelectorAll('[data-forndel]').forEach(b=>b.addEventListener('click', ()=>excluirFornecedor(nomes[Number(b.dataset.forndel)])));\n}\n\n/* ---------- Fornecedores: editar (renomear) e excluir ---------- */\nlet fornEditando = '';\nfunction atualizarTudoAposFornecedor(){\n  render(); renderFornecedorDatalist(); renderDashboardHome(); renderValoresHome(); renderFornecedoresHome(); renderRecebimentoHome();\n}\nfunction abrirEdicaoFornecedor(nome){\n  if(!nome) return;\n  fornEditando = nome;\n  const total = pedidos.filter(p=>p.fornecedor===nome).length;\n  document.getElementById('fornEditInfo').textContent = `\"${nome}\" aparece em ${total} item(ns). O novo nome será aplicado em todos eles.`;\n  document.getElementById('fornEditNome').value = nome;\n  document.getElementById('fornEditErr').style.display = 'none';\n  document.getElementById('fornEditMerge').style.display = 'none';\n  document.getElementById('fornEditOverlay').style.display = 'flex';\n  setTimeout(()=>{ const i=document.getElementById('fornEditNome'); i.focus(); i.select(); }, 30);\n}\nfunction fecharEdicaoFornecedor(){ document.getElementById('fornEditOverlay').style.display = 'none'; fornEditando = ''; }\non('fornEditCancelar', 'click', fecharEdicaoFornecedor);\non('fornEditNome', 'input', (e)=>{\n  const novo = e.target.value.trim();\n  const existe = novo && novo!==fornEditando && pedidos.some(p=>p.fornecedor===novo);\n  document.getElementById('fornEditMerge').style.display = existe ? 'block' : 'none';\n});\non('fornEditNome', 'keydown', (e)=>{ if(e.key==='Enter') document.getElementById('fornEditSalvar').click(); if(e.key==='Escape') fecharEdicaoFornecedor(); });\non('fornEditSalvar', 'click', ()=>{\n  const antigo = fornEditando;\n  const novo = document.getElementById('fornEditNome').value.trim();\n  if(!novo){ document.getElementById('fornEditErr').style.display = 'block'; return; }\n  if(novo===antigo){ fecharEdicaoFornecedor(); return; }\n  const idsAfetados = pedidos.filter(p=>p.fornecedor===antigo).map(p=>p.id);\n  pedidos = pedidos.map(p=>p.fornecedor===antigo ? {...p, fornecedor:novo} : p);\n  saveData();\n  fecharEdicaoFornecedor();\n  atualizarTudoAposFornecedor();\n  mostrarDesfazer(`Fornecedor \"${antigo}\" renomeado para \"${novo}\" em ${idsAfetados.length} item(ns).`, ()=>{\n    const ids = new Set(idsAfetados);\n    pedidos = pedidos.map(p=>ids.has(p.id) ? {...p, fornecedor:antigo} : p);\n    saveData(); atualizarTudoAposFornecedor();\n  });\n});\nasync function excluirFornecedor(nome){\n  if(!nome) return;\n  const idsAfetados = pedidos.filter(p=>p.fornecedor===nome).map(p=>p.id);\n  const ok = await confirmarAcao(`Excluir o fornecedor \"${nome}\"? Ele será removido de ${idsAfetados.length} item(ns) (em todas as obras). Os itens continuam cadastrados, só ficam sem fornecedor.`);\n  if(!ok) return;\n  pedidos = pedidos.map(p=>p.fornecedor===nome ? {...p, fornecedor:''} : p);\n  saveData();\n  atualizarTudoAposFornecedor();\n  mostrarDesfazer(`Fornecedor \"${nome}\" excluído de ${idsAfetados.length} item(ns).`, ()=>{\n    const ids = new Set(idsAfetados);\n    pedidos = pedidos.map(p=>ids.has(p.id) ? {...p, fornecedor:nome} : p);\n    saveData(); atualizarTudoAposFornecedor();\n  });\n}\nfunction buildRingSVG(pct, color, size, strokeWidth){\n  size = size || 64; strokeWidth = strokeWidth || 6;\n  const radius = (size - strokeWidth) / 2;\n  const circunferencia = 2 * Math.PI * radius;\n  const offset = circunferencia * (1 - Math.max(0,Math.min(100,pct))/100);\n  const c = size/2;\n  return `<svg width=\"${size}\" height=\"${size}\" viewBox=\"0 0 ${size} ${size}\" style=\"flex-shrink:0;\">\n    <circle cx=\"${c}\" cy=\"${c}\" r=\"${radius}\" fill=\"none\" stroke=\"var(--neutral-bg)\" stroke-width=\"${strokeWidth}\"/>\n    <circle cx=\"${c}\" cy=\"${c}\" r=\"${radius}\" fill=\"none\" stroke=\"${color}\" stroke-width=\"${strokeWidth}\" stroke-dasharray=\"${circunferencia}\" stroke-dashoffset=\"${offset}\" stroke-linecap=\"round\" transform=\"rotate(-90 ${c} ${c})\"/>\n    <text x=\"${c}\" y=\"${c}\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"${size*0.24}\" font-weight=\"700\" fill=\"var(--ink)\" font-family=\"'Bricolage Grotesque',sans-serif\">${Math.round(pct)}%<\/text>\n  <\/svg>`;\n}\nfunction buildPieSVG(slices, size){\n  size = size || 130;\n  const radius = size/2;\n  const nonZero = slices.filter(s=>s.value>0);\n  if(nonZero.length===0){\n    return `<svg viewBox=\"0 0 ${size} ${size}\" width=\"${size}\" height=\"${size}\"><circle cx=\"${radius}\" cy=\"${radius}\" r=\"${radius-2}\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"2\"><\/circle><\/svg>`;\n  }\n  if(nonZero.length===1){\n    return `<svg viewBox=\"0 0 ${size} ${size}\" width=\"${size}\" height=\"${size}\"><circle cx=\"${radius}\" cy=\"${radius}\" r=\"${radius}\" fill=\"${nonZero[0].color}\"><\/circle><text x=\"${radius}\" y=\"${radius}\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"pie-slice-label\">100%<\/text><\/svg>`;\n  }\n  const total = nonZero.reduce((s,x)=>s+x.value,0);\n  let angle = -Math.PI/2;\n  let paths = '';\n  let labels = '';\n  for(const slice of nonZero){\n    const frac = slice.value/total;\n    const endAngle = angle + frac*2*Math.PI;\n    const x1 = radius + radius*Math.cos(angle), y1 = radius + radius*Math.sin(angle);\n    const x2 = radius + radius*Math.cos(endAngle), y2 = radius + radius*Math.sin(endAngle);\n    const largeArc = frac>0.5 ? 1 : 0;\n    paths += `<path d=\"M ${radius} ${radius} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${radius} ${radius} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z\" fill=\"${slice.color}\"><\/path>`;\n    const midAngle = angle + (endAngle-angle)/2;\n    const lx = radius + radius*0.62*Math.cos(midAngle), ly = radius + radius*0.62*Math.sin(midAngle);\n    const pct = Math.round(frac*100);\n    if(pct>0){\n      labels += `<text x=\"${lx.toFixed(2)}\" y=\"${ly.toFixed(2)}\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"pie-slice-label\">${pct}%<\/text>`;\n    }\n    angle = endAngle;\n  }\n  return `<svg viewBox=\"0 0 ${size} ${size}\" width=\"${size}\" height=\"${size}\">${paths}${labels}<\/svg>`;\n}\n\n/* ---------- Obras CRUD ---------- */\nfunction renderObras(){\n  const grid = document.getElementById('obrasCardsGrid');\n  grid.innerHTML='';\n  document.getElementById('obrasEmpty').style.display = obras.length?'none':'block';\n  for(const o of obras){\n    const card = document.createElement('div');\n    card.className = 'postit-card';\n    card.dataset.oabrir = o.id;\n    card.innerHTML = `\n      <div class=\"postit-accent\" style=\"background:${o.ativo==='Sim'?'var(--green)':'var(--rust)'};\"><\/div>\n      <button class=\"postit-del\" data-odel=\"${o.id}\" title=\"Excluir obra\">×<\/button>\n      <div class=\"postit-nome\">${o.nome}<\/div>\n      <div class=\"postit-foot\">\n        <span class=\"status-pill ${o.ativo==='Sim'?'st-completo':'st-atrasado'}\" style=\"font-size:9.5px;\">${o.ativo==='Sim'?'Ativa':'Inativa'}<\/span>\n        <button class=\"postit-edit\" data-oedit=\"${o.id}\" title=\"Editar obra\">✎<\/button>\n      <\/div>\n    `;\n    grid.appendChild(card);\n  }\n  grid.querySelectorAll('.postit-card').forEach(card=>card.addEventListener('click', (e)=>{\n    if(e.target.closest('[data-oedit]') || e.target.closest('[data-odel]')) return;\n    abrirObraDashboard(obras.find(o= async function put(col,obj,quiet){
  obj.id=obj.id||uid();

  const i=S[col].findIndex(x=>x.id===obj.id); if(i>=0)S[col][i]=obj; else S[col].push(obj);
  if(db){try{await db.collection(col).doc(obj.id).set(JSON.parse(JSON.stringify(obj)))}catch(e){if(!quiet)toast('Não foi possível salvar: '+(e.message||e.code||'erro'));else console.warn('[pyro] gravação',col,e)}}
  else persistLocal();
  scheduleRender();return obj;
}
async function del(col,id,quiet){

  else persistLocal();

}

const fold=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function hay(...a){return fold(a.join(' '))}
const matchQ=(h,q)=>fold(q).split(/\s+/).filter(Boolean).every(t=>h.includes(t));
const pedHay=p=>hay(p.item,(p.itens||[]).map(i=>(i.cod||'')+' '+(i.desc||'')).join(' '),p.op,p.pc,p.erpPedido,nm('obras',p.obraId,''),nm('fornecedores',p.fornecedorId,''),catNome(p.categoria),p.fase,PSTAT[p.status],nm('colaboradores',p.respId,''));
const nfItemHay=n=>{const p=n.pedidoId&&by('pedidos',n.pedidoId);return p?hay(p.item,...(p.itens||[]).map(i=>(i.cod||'')+' '+(i.desc||'')),...linhasDoPedido(p.id).map(r=>(r.codigo||'')+' '+(r.descricao||''))):''};
const nfPedHay=n=>{const p=(n.pedidoId&&by('pedidos',n.pedidoId))||{};return hay(n.erpPedido||'',p.erpPedido||'',p.pc||'',p.op||'',p.item||'')};
const nfHay=n=>hay(n.erpPedido||'',n.numero,n.romaneio,n.resp,n.obs,nm('fornecedores',n.fornecedorId,''),nm('obras',n.obraId,''),NFSTAT[n.status]);
function gsearch(q){
  q=(q||'').trim();if(q.length<2)return null;
  const R={ped:[],nf:[],forn:[],obra:[]};
  R.ped=S.pedidos.filter(p=>matchQ(pedHay(p),q));
  R.nf=S.nfs.filter(n=>matchQ(nfHay(n),q));
  R.forn=S.fornecedores.filter(f=>matchQ(hay(f.nome,f.cnpj,f.contato,f.email),q));
  R.obra=S.obras.filter(o=>matchQ(hay(o.nome,o.cliente,o.cnpj),q));
  return R;
}

let DUP_ENT_EM=0;
async function limparEntDup(){

    for(const e of es){if(e===keep||e.status==='recebido'||(e.recebimentos||[]).length||(e.reagend||[]).length||(e.cobrancas||[]).length||(e.tipo||'entrega')!==(keep.tipo||'entrega'))continue;
      try{await del('entregas',e.id,true)}catch(x){console.warn('[pyro] card repetido',e.id,x)}}}
}
const isLate=e=>!!(e&&e.status!=='recebido'&&e.dataPrevista&&e.dataPrevista<today());
const reagN=e=>e?.reagend?.length||0;
const estLabel=e=>e.parcial&&e.status!=='recebido'?`Parcial${e.pctRec?' '+e.pctRec+'%':''}`:e.status==='aguardando'&&e.tipo==='coleta'?'Aguardando coleta':ESTAT[e.status];
function pedidosDe(obraId,f){return S.pedidos.filter(p=>p.status!=='cancelado'&&(!obraId||p.obraId===obraId)&&(!f||f(p)))}
function gargaloScore(p){const e=entOf(p.id);const d=e?.dataPrevista;return (d?dayDiff(d,today()):9999)*10+(p.curvaA?2:0)+(p.critico?1:0)}
function quem(p){
  const r=by('colaboradores',p.respId);
  if(p.status==='comprado'){const e=entOf(p.id);return e?`${estLabel(e)} · ${nm('fornecedores',p.fornecedorId)}${e.dataPrevista?' · prev. '+fd(e.dataPrevista):''}`:`Comprado · ${nm('fornecedores',p.fornecedorId)}`}
  return `${PSTAT[p.status]}${r?' A/C '+r.nome:''}`;

/* valor do pedido para budget: o maior entre o valor informado, a soma dos itens e as notas ligadas a ele */
function valPed(p){if(p.foraBudget)return 0;const v=+p.valor||0,it=(p.itens||[]).reduce((a,i)=>a+(+i.total||0),0),nf=S.nfs.reduce((a,n)=>a+(n.pedidoId===p.id&&!n.foraBudget&&!n.semFinanceiro?(+n.valor||0):0),0);return Math.max(v,it,nf)}
/* lançamento só budget (linha da planilha sem nota no Pyro): conta o que ainda não tem nota ligada */
function semNotaSB(p){if(!(p.semReceb||p.aprovSemNota)||p.foraBudget||!['comprado','recebido'].includes(p.status))return 0;const v=Math.max(+p.valor||0,(p.itens||[]).reduce((a,i)=>a+(+i.total||0),0)),nf=S.nfs.reduce((a,n)=>a+(n.pedidoId===p.id&&!n.foraBudget&&!n.semFinanceiro?(+n.valor||0):0),0);return Math.max(0,v-nf)}
/* ===== régua única de itens: a mesma do Pedidos e Recebimento =====
   item = linha do Recebimento ligada ao pedido (recebido quando a qtde recebida cobre a pedida).
   Pedido sem linhas (vindo do Controle de Entregas) conta como 1 item. Usado na Home, nas obras, no painel e no Recebimento. */
let ROWS_IDX=null,ROWS_SRC=null;
function rowsIdx(){if(ROWS_SRC!==S.painel_pedidos){ROWS_SRC=S.painel_pedidos;ROWS_IDX=new Map();(S.painel_pedidos||[]).forEach(r=>{if(!r.pyPedidoId)return;const a=ROWS_IDX.get(r.pyPedidoId);a?a.push(r):ROWS_IDX.set(r.pyPedidoId,[r])})}return ROWS_IDX}
const pRows=p=>rowsIdx().get(p.id)||[];
function itN(p){const rs=pRows(p);return rs.length||(p.itens||[]).length||1}
function itR(p){const rs=pRows(p),n=itN(p);if(p.status==='recebido')return n;if(rs.length)return rs.filter(rowDone).length;return Math.min(n,+p.itensRecebidos||0)}
const faseKey=p=>String(p.fase||'').trim()||'-';
const faseNome=k=>k==='-'?'Sem fase':k;
const faseOk=(p,k)=>!k||faseKey(p)===k;
function fasesDe(psM){
  const ks=[...new Set(psM.map(faseKey))].sort((a,b)=>{const x=a==='-'?99:(FASES.indexOf(a)<0?50:FASES.indexOf(a)),y=b==='-'?99:(FASES.indexOf(b)<0?50:FASES.indexOf(b));return x-y||a.localeCompare(b)});
  return ks.map(k=>{const l=psM.filter(p=>faseKey(p)===k);return{key:k,nome:faseNome(k),n:l.length,rec:l.filter(p=>p.status==='recebido').length,it:l.reduce((a,p)=>a+itN(p),0),itRec:l.reduce((a,p)=>a+itR(p),0)}});
}
/* nota lançada duas vezes (mesmo fornecedor, número, valor e vencimento, ou uma cópia zerada) entra uma vez só nas somas.
   Parcelas de boleto (vencimentos diferentes) e notas divididas entre pedidos (valores diferentes) continuam somando. */
let NFDUP=null,NFDUP_SRC=null;
function nfDupSet(){if(NFDUP_SRC===S.nfs)return NFDUP;NFDUP_SRC=S.nfs;NFDUP=new Set();const g=new Map();
  S.nfs.forEach(n=>{const num=String(n.numero||'').replace(/\D/g,'').replace(/^0+/,'');if(!num)return;const k=(n.fornecedorId||'')+'|'+num;(g.get(k)||g.set(k,[]).get(k)).push(n)});
  const peso=n=>(n.chave?8:0)+(n.pedidoId&&by('pedidos',n.pedidoId)?4:0)+((n.anexos||[]).length?2:0)+((n.boletos||[]).length?1:0);
  for(const l of g.values()){if(l.length<2)continue;const ord=l.slice().sort((a,b)=>(+b.valor||0)-(+a.valor||0)||peso(b)-peso(a)||(a.createdAt||0)-(b.createdAt||0));const kept=[];
    for(const n of ord){const v=+n.valor||0;const igual=kept.find(k=>!v||(Math.abs((+k.valor||0)-v)<0.01&&(k.vencimento||'')===(n.vencimento||'')));if(igual)NFDUP.add(n.id);else kept.push(n)}}
  return NFDUP}
const nfDup=n=>nfDupSet().has(n.id);
function obraStats(o,f){
  const ps=pedidosDe(o.id,f), psM=ps.filter(p=>!p.semReceb), rec=psM.filter(p=>p.status==='recebido'), pend=psM.filter(p=>p.status!=='recebido');
  const itens=psM.reduce((a,p)=>a+itN(p),0),itRec=psM.reduce((a,p)=>a+itR(p),0);
  const comp=ps.filter(p=>p.status==='comprado'||p.status==='recebido').reduce((a,p)=>a+valPed(p),0);
  const cat={};CATS.forEach(c=>cat[c.id]={comp:0,orc:+(o.budgetCat?.[c.id])||0,n:0,rec:0});
  ps.forEach(p=>{const c=cat[p.categoria];if(!c)return;if(!p.semReceb){c.n++;if(p.status==='recebido')c.rec++}if(p.status==='comprado'||p.status==='recebido')c.comp+=valPed(p)});
  const fases=fasesDe(psM);
  const atrasos=pend.filter(p=>isLate(entOf(p.id))).length;
  const reag=ps.reduce((a,p)=>a+reagN(entOf(p.id)),0);
  const gargalo=pend.slice().sort((a,b)=>gargaloScore(b)-gargaloScore(a))[0];
  const soltas=f?0:S.nfs.reduce((a,n)=>a+(n.obraId===o.id&&!n.foraBudget&&!n.semFinanceiro&&!nfDup(n)&&!ps.some(p=>p.id===n.pedidoId)?(+n.valor||0):0),0);
  const fat=S.nfs.reduce((a,n)=>a+(!n.foraBudget&&!n.semFinanceiro&&!nfDup(n)&&((!f&&n.obraId===o.id)||ps.some(p=>p.id===n.pedidoId))?(+n.valor||0):0),0)+ps.reduce((a,p)=>a+semNotaSB(p),0);
  return{ps,psM,rec,pend,itens,itRec,pct:itRec===itens?(itens?100:0):Math.min(99,pct(itRec,itens)),comp:comp+soltas,soltas,fat,cat,fases,atrasos,reag,gargalo,orc:+o.budgetTotal||0};
}
function linhaStatus(st){

function resumoDados(){
  const t=today(),ents=S.entregas.filter(e=>{const p=by('pedidos',e.pedidoId);return p&&p.status!=='cancelado'&&e.status!=='recebido'&&entOf(p.id)===e});

function sortPend(a,b){

function erow(e){

  const nfl=(outN.length?`<div class="s">${outN.length===1?'Nota do pedido':outN.length+' notas do pedido'}: ${outN.slice(0,4).map(n=>`<a href="#" data-act="g-nf" data-id="${n.id}">NF ${esc(n.numero)}</a>`).join(', ')}${outN.length>4?` e mais ${outN.length-4}`:''}</div>`:'')+(pendN.length?`<div class="nfpend"><span class="s warnc">${ic('alert',12)} Nota lançada, chegada ainda não registrada:</span>${pendN.map(n=>`<button class="btn sm" data-act="cheg-nf" data-id="${n.id}">${ic('check',12)} NF ${esc(n.numero)}${n.valor?' · '+esc(brl2(n.valor)):''}</button>`).join('')}</div>`:'');
  const jn=e.janela||e.periodo?`<div class="s">Janela: ${esc(e.janela||({manha:'manhã',tarde:'tarde'}[e.periodo]||e.periodo))}</div>`:'';

    tot+=v;if(isP)pago+=v;else aberto+=v;if(isV)venc+=v;notas.add(key(n));
    const f=F[n.fornecedorId||'']||(F[n.fornecedorId||'']={id:n.fornecedorId||'',nome:nm('fornecedores',n.fornecedorId,'Sem fornecedor'),tot:0,pago:0,aberto:0,venc:0,k:new Set()});
    f.tot+=v;if(isP)f.pago+=v;else f.aberto+=v;if(isV)f.venc+=v;f.k.add(key(n));
    const o=O[n.obraId||'']||(O[n.obraId||'']={id:n.obraId||'',nome:nm('obras',n.obraId,'Sem obra'),tot:0});o.tot+=v;

/* rótulo do pedido sem repetir o PC nem a categoria que já vêm no nome (ex.: "SC01 · Perfis (21 itens)") */
function pcCod(p){const s=String(p.pc||'').trim();if(!s)return '';if(/^\d+$/.test(s))return 'PC'+s.padStart(2,'0');return s.replace(/^pc\s*[-·.]?\s*/i,'PC')}
function itemLimpo(p){
  let t=String(p.item||'').trim();const pc=String(p.pc||'').trim(),cod=pcCod(p),rx=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  [cod,pc,/^\d+$/.test(pc)?'PC'+pc:'',/^\d+$/.test(pc)?String(+pc).padStart(2,'0'):''].filter(Boolean).forEach(c=>{t=t.replace(new RegExp('^'+rx(c)+'\\s*[·\\-–:]\\s*','i'),'')});
  const m=t.match(/^(perfis|vidros|acess[oó]rios|servi[cç]os|outros|[a-zçãõéêíóú ]{3,30})?\s*\((\d+) itens?\)$/i);
  if(m&&(!m[1]||NRM(m[1]).trim()===NRM(catNome(p.categoria)).trim()||/^(perfis|vidros|acess|servi|outros)/i.test(m[1])))return m[2]+(m[2]==='1'?' item':' itens');
  if(cod&&NRM(t)===NRM(cod))return '';
  return t;
}
function rotPed(p){const i=itemLimpo(p),c=catNome(p.categoria);return i?i+(i.endsWith('itens')||i.endsWith('item')?' de '+c.toLowerCase():''):c}
function repSections(o){
  const t=today(),st=obraStats(o),ps=st.ps,l=linhaStatus(st);
  const en=S.entregas.filter(e=>{const p=by('pedidos',e.pedidoId);return p&&p.obraId===o.id&&p.status!=='cancelado'&&entOf(p.id)===e});
  const multi=e=>{const p=by('pedidos',e.pedidoId);return !!(p&&p.fornecs&&p.fornecs.length>1)};
  const fl=[];en.filter(multi).forEach(e=>{const p=by('pedidos',e.pedidoId);p.fornecs.forEach(x=>{if(x.recebido||x.status!=='comprado'||!x.dataPrevista)return;fl.push({p,x})})});
  const LF=({p,x})=>`${rotPed(p)} · ${nm('fornecedores',x.fornecedorId)}${pcCod(p)?' · '+pcCod(p):''}${p.op?' · '+rdOp(p.op):''}${x.erp?' · ERP '+x.erp:''}${codPend(p,x.erp)}`;
  const fAtr=fl.filter(f=>f.x.dataPrevista<t).sort((a,b)=>a.x.dataPrevista<b.x.dataPrevista?-1:1);
  const fProx=fl.filter(f=>f.x.dataPrevista>=t&&dayDiff(f.x.dataPrevista,t)<=7).sort((a,b)=>a.x.dataPrevista<b.x.dataPrevista?-1:1);
  /* códigos dos itens que ainda faltam (no pedido com vários fornecedores, só os do nº ERP daquele fornecedor) */
  const codPend=(p,erp)=>{const ms=String(erp||'').split(/[,;\s]+/).filter(Boolean);
    let it=(p.itens||[]).filter(i=>!(+i.qtd&&(+i.rec||0)>=+i.qtd)),rot='Itens';
    if(ms.length){/* só separa por fornecedor quando os itens trazem os nº ERP de mais de um fornecedor */
      const fm=(p.fornecs||[]).map(x=>String(x.erp||'').trim()).filter(Boolean),im=new Set(it.map(i=>String(i.erp||'').trim()));
      if(fm.filter(m=>im.has(m)).length>1)it=it.filter(i=>ms.includes(String(i.erp||'').trim()));else rot='Itens do pedido'}
    const cs=[...new Set(it.map(i=>String(i.cod||'').trim()||String(i.desc||'').trim().slice(0,40)).filter(Boolean))];
    return cs.length?` · ${rot}: ${cs.slice(0,8).join(', ')}${cs.length>8?` e mais ${cs.length-8}`:''}`:''};
  const L=e=>{const p=by('pedidos',e.pedidoId);return `${rotPed(p)} · ${nm('fornecedores',p.fornecedorId)}${pcCod(p)?' · '+pcCod(p):''}${p.op?' · '+rdOp(p.op):''}${p.erpPedido?' · ERP '+p.erpPedido:''}${e.status==='recebido'?'':codPend(p,'')}`};
  const dd=x=>dayDiff(t,x);
  const recSem=en.filter(e=>e.status==='recebido'&&e.dataChegada&&dd(e.dataChegada)>=0&&dd(e.dataChegada)<=7);
  const parc=en.filter(e=>e.parcial&&e.status!=='recebido');
  const prox=en.filter(e=>!multi(e)&&e.status!=='recebido'&&e.dataPrevista&&e.dataPrevista>=t&&dayDiff(e.dataPrevista,t)<=7).sort((a,b)=>a.dataPrevista<b.dataPrevista?-1:1);
  const atr=en.filter(e=>!multi(e)&&isLate(e)).sort((a,b)=>a.dataPrevista<b.dataPrevista?-1:1);
  const cot=ps.filter(p=>['cotacao','analise','aprov_obra','aprov_int'].includes(p.status));
  const nfsO=S.nfs.filter(n=>n.obraId===o.id&&!n.semFinanceiro&&n.status!=='paga'&&n.vencimento);
  const nv=nfsO.filter(n=>n.vencimento<t),n7=nfsO.filter(n=>n.vencimento>=t&&dayDiff(n.vencimento,t)<=7);
  const g=st.gargalo,cats=CATS.map(c=>{const x=st.cat[c.id];return x.orc||x.comp?`${c.nome}: ${brl2(x.comp)}${x.orc?' de '+brl2(x.orc)+' ('+pctB(x.comp,x.orc)+'%)':' (sem budget)'}`:''}).filter(Boolean);
  const resumo=[`Suprimentos recebidos: ${st.pct}% (${st.rec.length} de ${st.psM.length} itens)`,`Situação das compras: ${l.txt}`,
    `Consumido: ${brl2(st.fat)}${st.orc?' de '+brl2(st.orc)+' ('+pctB(st.fat,st.orc)+'%)':' (obra sem budget cadastrado)'} · comprometido em pedidos: ${brl2(st.comp)}`,
    ...(g?[`Item mais urgente: ${g.item} (${catNome(g.categoria)}${g.fase?' · '+g.fase:''}) · ${quem(g)}`]:[]),
    ...(st.reag?[`Reprogramações de data pelos fornecedores: ${st.reag}`]:[])];
  return {obra:o.nome,cliente:o.cliente||'',resumo,secoes:[
    {t:'Atrasadas',l:atr.map(e=>`${L(e)} · previsto ${fdy(e.dataPrevista)} (${dayDiff(t,e.dataPrevista)} d de atraso)${reagN(e)?' · reprogramado '+reagN(e)+'x':''}`).concat(fAtr.map(f=>`${LF(f)} · previsto ${fdy(f.x.dataPrevista)} (${dayDiff(t,f.x.dataPrevista)} d de atraso)`))},
    {t:'Chegam nos próximos 7 dias',l:prox.map(e=>`${fdy(e.dataPrevista)} · ${L(e)}`).concat(fProx.map(f=>`${fdy(f.x.dataPrevista)} · ${LF(f)}`))},
    {t:'Comprados sem previsão de entrega (pedir data ao fornecedor)',l:en.filter(e=>!multi(e)&&e.status!=='recebido'&&!e.dataPrevista&&(by('pedidos',e.pedidoId)||{}).status==='comprado').map(e=>`${L(e)}`)},
    {t:'Chegadas parciais (falta material)',l:parc.map(e=>`${L(e)} · chegada parcial${e.pctRec?' ('+e.pctRec+'% recebido)':''}${e.dataPrevista?' · restante previsto '+fdy(e.dataPrevista):''}`)},
    {t:'Recebido nos últimos 7 dias',l:recSem.map(e=>`${fdy(e.dataChegada)} · ${L(e)}${e.nf?' · NF '+e.nf:''}`)},
    {t:'Em cotação, análise ou aprovação',l:cot.map(p=>`${rotPed(p)}${pcCod(p)?' · '+pcCod(p):''} · ${PSTAT[p.status]}${p.respId?' · A/C '+nm('colaboradores',p.respId):''}${p.inicioCotacao?' · há '+dayDiff(t,p.inicioCotacao)+' d':''}`)},
    {t:'Boletos vencidos',l:nv.map(n=>`NF ${n.numero} · ${nm('fornecedores',n.fornecedorId)} · ${brl2(n.valor)} · venceu ${fdy(n.vencimento)}`)},
    {t:'Boletos que vencem em 7 dias',l:n7.map(n=>`NF ${n.numero} · ${nm('fornecedores',n.fornecedorId)} · ${brl2(n.valor)} · vence ${fdy(n.vencimento)}`)},
    {t:'Budget por categoria',l:cats}]};
}

let RDIA={};
try{RDIA=JSON.parse(localStorage.getItem('pyro_rdia2')||'{}');if(RDIA.d!==today())RDIA={d:today(),t:{}};RDIA.t=RDIA.t||{};RDIA.b=RDIA.b||{}}catch(e){RDIA={d:today(),t:{},b:{}}}
function rdSave(){try{localStorage.setItem('pyro_rdia2',JSON.stringify(RDIA))}catch(e){}}
const rdOp=op=>{op=String(op||'').trim();return !op?'':/^\d+$/.test(op)?'OP'+op:op};
const rdB=d=>`<b>${esc(fdy(d))}</b>`;
function rdSit(p){
  const t=today(),e=entOf(p.id),gp=fornProg(p);
  if(gp)return gp.lista.map(x=>`${esc(x.nome)} ${x.ok?'recebido':esc(FST_TXT[x.st]||x.st)}${!x.ok&&x.st==='comprado'?(x.prev?' · Previsão '+rdB(x.prev)+(x.prev<t?' · ATRASADO':''):' · sem previsão'):''}`).join(' | ')+` (${gp.ok} de ${gp.n} fornecedores entregues)`;
  if(p.status==='cotacao')return 'Em cotação';
  if(p.status==='analise')return 'Em cotação e análise';
  if(p.status==='aprov_obra')return 'Em cotação e processo de aprovação de obra';
  if(p.status==='aprov_int')return 'Em cotação e processo de aprovação interna';
  if(p.status==='recebido')return 'Recebido'+(e&&e.dataChegada?' em '+rdB(e.dataChegada):'');
  if(!e)return 'Comprado';
  const b=e.parcial&&e.status!=='recebido'?'Entrega parcial':e.status==='producao'?'Comprado e em produção':e.tipo==='coleta'?'Comprado, aguardando coleta':'Comprado, aguardando entrega';
  return b+(e.dataPrevista?' · Previsão '+rdB(e.dataPrevista):' · previsão a confirmar com o fornecedor')+(isLate(e)?` · <b>ATRASADO (${dayDiff(t,e.dataPrevista)} d)</b>`:'');
}
function rdLinhas(o){
  const t=today();
  const ps=S.pedidos.filter(p=>p.obraId===o.id&&p.status!=='cancelado'&&!p.demo&&!p.semReceb&&(p.status!=='recebido'||(()=>{const e=entOf(p.id);return e&&e.dataChegada&&dayDiff(t,e.dataChegada)>=0&&dayDiff(t,e.dataChegada)<=3})()));
  const num=p=>parseInt(String(p.op||'').replace(/\D/g,''),10)||9999;
  ps.sort((a,b)=>num(a)-num(b)||String(a.item).localeCompare(String(b.item),'pt-BR'));
  return ps.map(p=>{
    const pc=pcCod(p),it=itemLimpo(p);
    const emCot=['cotacao','analise','aprov_obra','aprov_int'].includes(p.status);
    const ini=emCot&&p.inicioCotacao?' '+esc(fdy(p.inicioCotacao)):'';
    const cab=[rdOp(p.op),catNome(p.categoria)].filter(Boolean).map(esc).join(' - ');
    const meio=[pc,it].filter(Boolean).map(esc).join(' · ')+ini;
    return {pid:p.id,h:[cab,meio,rdSit(p)].filter(Boolean).join(' - ')};
  });
}
/* resumo da obra no topo do texto (atualiza sozinho, como as linhas) */
function rdResumo(o){
  const t=today(),ps=S.pedidos.filter(p=>p.obraId===o.id&&p.status!=='cancelado'&&!p.demo&&!p.semReceb&&p.status!=='recebido');
  let atr=0,sem=0,prox=0,cot=0;ps.forEach(p=>{if(['cotacao','analise','aprov_obra','aprov_int'].includes(p.status)){cot++;return}const e=entOf(p.id);if(!e)return;if(isLate(e))atr++;else if(!e.dataPrevista)sem++;else if(dayDiff(e.dataPrevista,t)<=7)prox++});
  const pl=(n,a,b)=>n+' '+(n===1?a:b);
  return [pl(ps.length,'pedido em andamento','pedidos em andamento'),atr?'<b>'+pl(atr,'atrasado','atrasados')+'</b>':'nenhum atrasado',prox?pl(prox,'chega','chegam')+' em até 7 dias':'',sem?pl(sem,'com previsão a confirmar','com previsão a confirmar'):'',cot?pl(cot,'em cotação','em cotação'):''].filter(Boolean).join(' · ');
}
function rdTexto(o){const l=rdLinhas(o);return `<p><b>${esc(o.nome)}</b></p><p data-rdres="1">${rdResumo(o)}</p><ul>${l.length?l.map(x=>`<li data-pid="${esc(x.pid)}">${x.h}</li>`).join(''):'<li data-vazio="1">Sem pendências no momento</li>'}</ul>`}
/* mapa do texto gerado, linha por pedido: base para saber o que mudou no painel desde a sua edição */
function rdMapa(o){const m={};rdLinhas(o).forEach(x=>m[x.pid]=x.h);return m}
function rdGuardar(oid,html){const o=by('obras',oid);{const d=document.createElement('div');d.innerHTML=html;const vis=new Set();d.querySelectorAll('li[data-pid]').forEach(li=>{if(vis.has(li.dataset.pid))li.removeAttribute('data-pid');else vis.add(li.dataset.pid)});d.querySelectorAll('li[data-vazio]').forEach((li,i)=>{if(i)li.removeAttribute('data-vazio')});html=d.innerHTML}RDIA.d=today();RDIA.t[oid]=html;if(o&&!RDIA.b[oid])RDIA.b[oid]=rdMapa(o);rdSave()}
/* texto editado + mudanças do painel: as linhas cujos pedidos mudaram são atualizadas, pedidos novos entram, pedidos que saíram somem; o resto da sua edição fica */
function rdMesclar(o,html){
  const base=RDIA.b[o.id];if(!base)return rdTexto(o);
  const lin=rdLinhas(o),gen={};lin.forEach(x=>gen[x.pid]=x.h);
  const d=document.createElement('div');d.innerHTML=html;let mud=false;
  d.querySelectorAll('li[data-pid]').forEach(li=>{const pid=li.dataset.pid;
    if(!(pid in gen)){if(pid in base){li.remove();mud=true}return}
    if(base[pid]!==gen[pid]){li.innerHTML=gen[pid];mud=true}});
  const tem=new Set([...d.querySelectorAll('li[data-pid]')].map(li=>li.dataset.pid));
  let ul=d.querySelector('ul');
  lin.forEach((x,i)=>{if(tem.has(x.pid)||x.pid in base)return;
    if(!ul){ul=document.createElement('ul');d.appendChild(ul)}
    const li=document.createElement('li');li.dataset.pid=x.pid;li.innerHTML=x.h;
    let ant=null;for(let k=i-1;k>=0;k--){ant=d.querySelector(`li[data-pid="${CSS.escape(lin[k].pid)}"]`);if(ant)break}
    if(ant)ant.after(li);else ul.prepend(li);tem.add(x.pid);mud=true});
  if(lin.length)d.querySelectorAll('li[data-vazio]').forEach(li=>{li.remove();mud=true});
  else if(!d.querySelector('li[data-pid],li[data-vazio]')&&mud){(ul||d).insertAdjacentHTML('beforeend','<li data-vazio="1">Sem pendências no momento</li>')}
  {const rs=d.querySelector('[data-rdres]');if(rs){const nv=rdResumo(o);if(rs.innerHTML!==nv){rs.innerHTML=nv;mud=true}}}
  if(mud){RDIA.t[o.id]=d.innerHTML;RDIA.b[o.id]=gen;rdSave()}
  else if(JSON.stringify(base)!==JSON.stringify(gen)){RDIA.b[o.id]=gen;rdSave()}
  return d.innerHTML;
}
function rdAtual(){return visibleObras().map(o=>({o,txt:RDIA.t[o.id]!=null?rdMesclar(o,RDIA.t[o.id]):rdTexto(o)}))}

function rdPlain(html){
  const d=document.createElement('div');d.innerHTML=html;let out='';
  const w=(n,pre)=>{
    if(n.nodeType===3){out+=n.nodeValue.replace(/\s+/g,' ');return}
    if(n.nodeType!==1)return;const tg=n.tagName;
    if(tg==='BR'){out+='\n';return}
    if(tg==='LI'){out=out.replace(/[ \t]+$/,'');if(out&&!out.endsWith('\n'))out+='\n';out+=(pre||'* ');[...n.childNodes].forEach(c=>w(c));out+='\n';return}
    const blk=/^(P|DIV|H\d|UL|OL)$/.test(tg);
    if(blk&&out&&!out.endsWith('\n'))out+='\n';
    if(tg==='OL'){let k=0;[...n.children].forEach(c=>{k++;w(c,k+') ')})}else[...n.childNodes].forEach(c=>w(c));
    if(blk&&!out.endsWith('\n'))out+='\n';
  };
  [...d.childNodes].forEach(c=>w(c));
  return out.split('\n').map(x=>x.trim()?x.replace(/\s+$/,'').replace(/^\s+/,''):'').join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

/* ============ ponte: Pedidos e Recebimento <-> follow-up (mesmo banco) ============ */
/* Os itens do recebimento (painel_pedidos) são a fonte da verdade de cada linha de pedido.
   O pedido do follow-up (pedidos) guarda o cabeçalho (obra, PC, fornecedor, ERP, status, entrega)
   e uma cópia dos itens para exibição. planSync() compara os dois lados e devolve só as gravações
   necessárias; rodar de novo sem mudanças devolve lista vazia. */
const LOADED=new Set();
const SYNC_COLS=['pedidos','painel_pedidos','painel_obras','obras','fornecedores','entregas','nfs'];
const REC_CAT={perfis:'Perfil',vidros:'Vidros',acessorios:'Acessórios',outros:'Uso e Consumo'};
const catDeRec=c=>{const f=fold(c);return /perfi/.test(f)?'perfis':/vidro/.test(f)?'vidros':/acess/.test(f)?'acessorios':'outros'};
const NN=s=>fold(s).replace(/\s+/g,' ').trim();
const PCK=v=>{const k=NN(v);return /^([-–—.]*|s\/?n( .*)?|sem (n|numero).*)$/.test(k)?'':k};
/* número de NF tem no máximo 9 dígitos; mais que isso (ou começando com ROM) é romaneio, não nota */
const NFOK=v=>{const k=NN(v);if(!k||/^([-–—.]+|s\/?n|n\/?a|sem nf|nao se aplica)$/.test(k))return false;if(/^rom/.test(k))return false;const d=String(v).replace(/\D/g,'');if(/^\d+$/.test(String(v).trim().replace(/[.\s]/g,''))&&d.length>9)return false;return true};
function hsh(s){let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
const stab=v=>Array.isArray(v)?'['+v.map(stab).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stab(v[k])).join(',')+'}':JSON.stringify(v===undefined?null:v);
const moda=arr=>{const m={};let best='',n=0;arr.forEach(x=>{x=String(x??'').trim();if(!x)return;m[x]=(m[x]||0)+1;if(m[x]>n){n=m[x];best=x}});return best};
const r2=n=>Math.round((+n||0)*100)/100;
const rowQtdRec=r=>(r.recebimentos||[]).reduce((a,x)=>a+(+x.qtd||0),0);
const rowValRec=r=>(r.recebimentos||[]).reduce((a,x)=>a+(+x.valor||0),0);
const rowDone=r=>(+r.qtdePedida||0)>0&&rowQtdRec(r)>=(+r.qtdePedida||0);
const rowItem=r=>{const q=+r.qtdePedida||0,v=+r.valorPedido||0;return {cod:String(r.codigo??''),desc:String(r.descricao??''),acab:String(r.acabamento??''),qtd:q,rec:rowQtdRec(r),un:String(r.unidade??''),vunit:q&&v?r2(v/q):0,total:r2(v),erp:String(r.codigoErp??''),obs:String(r.obs??''),recId:r.id}};
const rowOrdem=r=>{const m=/linha(\d+)/.exec(r.importKey||'');return m?+m[1]:1e6};
const recNomeObra=o=>o?((o.aliases&&o.aliases[0])||o.nome||''):'';
const AUTO_NOME=/^.+ · .+ \(\d+ ite(ns|m)\)$/;
const autoNome=(p,n)=>`${p.pc||'S/N'} · ${catNome(p.categoria)} (${n} ite${n===1?'m':'ns'})`;

function planSync(D,o){
  o=o||{};const now=o.now||Date.now(),t=o.today||today(),canCfg=!!o.canCfg;
  const W=[],info={semObra:{},novosPedidos:0,linhas:0};
  const cl=x=>JSON.parse(JSON.stringify(x));
  const peds=D.pedidos.map(cl),rows=D.painel_pedidos.map(cl),obras=D.obras.map(cl),forns=D.fornecedores.map(cl),ents=D.entregas.map(cl),nfs=D.nfs;
  const pById=new Map(peds.map(p=>[p.id,p]));
  const dP=new Set(),dR=new Set(),dE=new Set(),robras=new Set((D.painel_obras||[]).map(x=>NN(x.nome))),limpO=new Set();
  const obraDe=nome=>{const k=NN(nome);if(!k)return null;return obras.find(x=>(x.aliases||[]).some(a=>NN(a)===k))||obras.find(x=>NN(x.nome)===k)||null};
  const fornDe=nome=>{const k=NN(nome);return k?forns.find(f=>NN(f.nome)===k)||null:null};
  const fornNovo=(nome,cat)=>{let f=fornDe(nome);if(f||!nome)return f;if(!canCfg)return null;f={id:'rcf_'+hsh(NN(nome)),nome:String(nome).trim(),cats:cat?[cat]:[]};forns.push(f);W.push({op:'put',col:'fornecedores',obj:f});return f};
  const entDe=pid=>ents.find(e=>e.pedidoId===pid);
  const ativo=p=>p&&!p.__del&&p.status!=='cancelado'&&p.origem!=='controle_entregas'&&!p.demo;

  /* 1) ligar linhas do recebimento a pedidos */
  const recIdx=new Map();peds.forEach(p=>(p.itens||[]).forEach(i=>{if(i.recId)recIdx.set(i.recId,p.id)}));
  const soltas=[];
  for(const r of rows){
    if(r.pyPedidoId&&pById.has(r.pyPedidoId))continue;
    const pid=recIdx.get(r.id);
    if(pid&&pById.has(pid)){r.pyPedidoId=pid;dR.add(r.id);continue}
    soltas.push(r);
  }
  const grupos=new Map();
  for(const r of soltas){
    const ob=obraDe(r.obra);
    if(!ob){const k=String(r.obra||'(sem obra)');info.semObra[k]=(info.semObra[k]||0)+1;continue}
    const cat=catDeRec(r.categoria),key=ob.id+'|'+PCK(r.pedido)+'|'+cat;
    if(!grupos.has(key))grupos.set(key,{ob,cat,pedido:String(r.pedido??''),rows:[]});
    grupos.get(key).rows.push(r);
  }
  for(const [key,g] of grupos){
    const cands=peds.filter(p=>ativo(p)&&p.obraId===g.ob.id&&PCK(p.pc)===PCK(g.pedido)&&p.categoria===g.cat).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    const resto=[];
    for(const r of g.rows.sort((a,b)=>rowOrdem(a)-rowOrdem(b))){
      let hit=null;
      for(const p of cands){
        const it=(p.itens||[]).find(i=>!i.recId&&((NN(i.cod)&&NN(i.cod)===NN(r.codigo))||(!NN(i.cod)&&NN(i.desc)&&NN(i.desc)===NN(r.descricao))));
        if(it){it.recId=r.id;hit=p;dP.add(p.id);break}
      }
      if(hit){r.pyPedidoId=hit.id;dR.add(r.id)}else resto.push(r);
    }
    if(!resto.length)continue;
    let p=cands[0];
    if(!p){
      let id='rc_'+hsh(key);if(pById.has(id))id+='_'+hsh(now);
      const f=fornNovo(moda(resto.map(r=>r.fornecedor)),g.cat),erp=moda(resto.map(r=>r.codigoErp));
      p={id,obraId:g.ob.id,fase:'',categoria:g.cat,item:'',op:'',pc:g.pedido,respId:'',inicioCotacao:resto.map(r=>r.dataPedido).filter(Boolean).sort()[0]||'',status:'comprado',
         fornecedorId:f?f.id:'',erpPedido:erp,semErp:!erp,valor:0,curvaA:false,critico:false,alterado:false,justificativa:'',origem:'recebimento',itens:[],createdAt:now,updatedAt:now};
      peds.push(p);pById.set(id,p);info.novosPedidos++;
    }
    for(const r of resto){r.pyPedidoId=p.id;dR.add(r.id)}
    dP.add(p.id);
  }

  /* 2) itens do pedido = linhas ligadas (linha é a fonte da verdade) */
  const rowsDe=new Map();
  const indexar=()=>{rowsDe.clear();rows.forEach(r=>{if(r.pyPedidoId&&pById.has(r.pyPedidoId)){if(!rowsDe.has(r.pyPedidoId))rowsDe.set(r.pyPedidoId,[]);rowsDe.get(r.pyPedidoId).push(r)}})};
  indexar();
  for(const p of peds){
    if(p.status==='cancelado')continue;
    const rs=rowsDe.get(p.id)||[],tinha=(p.itens||[]).some(i=>i.recId);
    if(!rs.length&&!tinha)continue;
    const byR=new Map(rs.map(r=>[r.id,r])),usados=new Set(),out=[];
    for(const i of (p.itens||[])){
      if(!i.recId){out.push(i);continue}
      const r=byR.get(i.recId);if(!r||usados.has(r.id))continue;
      out.push({...i,...rowItem(r)});usados.add(r.id);
    }
    rs.filter(r=>!usados.has(r.id)).sort((a,b)=>rowOrdem(a)-rowOrdem(b)).forEach(r=>out.push(rowItem(r)));
    /* todas as linhas do pedido foram excluídas no Recebimento: o pedido sai junto (não recria o item automático) */
    if(!out.length&&tinha&&p.origem!=='recebimento'){
      const e=entDe(p.id),temNF=nfs.some(n=>n.pedidoId===p.id),temRec=e&&(e.recebimentos||[]).length;
      if(!temNF&&!temRec&&p.status!=='recebido'){
        W.push({op:'del',col:'pedidos',id:p.id});if(e)W.push({op:'del',col:'entregas',id:e.id});
        p.__del=true;dP.delete(p.id);info.excluidos=(info.excluidos||0)+1;continue;
      }
      /* tem nota ou chegada registrada: mantém o pedido só no budget, fora do Recebimento */
      p.itens=[];p.semReceb=true;dP.add(p.id);continue;
    }
    if(!out.length&&p.origem==='recebimento'){
      const e=entDe(p.id);
      if(!(e&&(e.recebimentos||[]).length)&&!nfs.some(n=>n.pedidoId===p.id&&n.origem!=='recebimento')){
        W.push({op:'del',col:'pedidos',id:p.id});if(e)W.push({op:'del',col:'entregas',id:e.id});
        nfs.filter(n=>n.pedidoId===p.id&&n.origem==='recebimento').forEach(n=>W.push({op:'del',col:'nfs',id:n.id}));
        p.__del=true;dP.delete(p.id);continue;
      }
    }
    if(stab(out)!==stab(p.itens||[])){p.itens=out;dP.add(p.id)}
  }

  /* 3) itens criados no follow-up viram linhas no recebimento */
  for(const p of peds){
    if(!ativo(p)||p.semReceb)continue;
    const ob=obras.find(x=>x.id===p.obraId);if(!ob)continue;
    const e=entDe(p.id);
    if(!(p.itens||[]).length){
      p.itens=[{cod:p.op||'',desc:p.item||'',acab:'',qtd:1,rec:p.status==='recebido'?1:0,un:'',vunit:r2(p.valor),total:r2(p.valor),auto:true}];dP.add(p.id);
    }else if(p.itens.length===1&&p.itens[0].auto&&p.itens[0].recId){
      /* pedido sem itens detalhados: a linha acompanha a descrição e o valor do pedido */
      const r=rows.find(x=>x.id===p.itens[0].recId),v=r2(+p.valor||0);
      if(r&&((p.item&&r.descricao!==p.item)||(v&&+r.valorPedido!==v))){if(p.item)r.descricao=p.item;if(v)r.valorPedido=String(v);dR.add(r.id);Object.assign(p.itens[0],rowItem(r));dP.add(p.id)}
    }
    const fn=p.fornecedorId?((forns.find(f=>f.id===p.fornecedorId)||{}).nome||''):'';
    const nomeObra=recNomeObra(ob);
    p.itens.forEach((i,idx)=>{
      if(i.recId)return;
      const rid='py'+hsh(p.id+'|'+idx+'|'+(i.cod||'')+'|'+(i.desc||''));
      const q=+i.qtd||0,tot=+i.total||r2((+i.vunit||0)*q),recQ=p.status==='recebido'?q:Math.min(q,+i.rec||0);
      const r={id:rid,obra:nomeObra,pedido:p.pc||p.erpPedido||('S/N '+p.id.slice(-4)),fornecedor:fn,codigo:i.cod||'',descricao:i.desc||'',acabamento:i.acab||'',
        categoria:REC_CAT[p.categoria]||'Uso e Consumo',qtdePedida:q,unidade:i.un||'',valorPedido:tot?String(r2(tot)):'',pesoKgM:'',barra:'',dataPedido:p.inicioCotacao||'',
        previsaoChegada:e&&e.status!=='recebido'?(e.dataPrevista||''):'',codigoErp:p.erpPedido||'',statusErp:'',fase:'',obs:i.obs||'',
        recebimentos:recQ>0?[{id:'r'+rid,nf:(e&&NFOK(e.nf)&&!/[,+]/.test(e.nf)?e.nf:''),data:(e&&e.dataChegada)||'',qtd:recQ,valor:q?r2(tot*recQ/q):0}]:[],
        origem:'PYRO',pyPedidoId:p.id,hasAnexo:false};
      rows.push(r);dR.add(rid);Object.assign(i,rowItem(r));dP.add(p.id);info.linhas++;
    });
    if(nomeObra&&!robras.has(NN(nomeObra))&&p.itens.length){robras.add(NN(nomeObra));W.push({op:'put',col:'painel_obras',obj:{id:'opy'+hsh(NN(nomeObra)),nome:nomeObra,ativo:'Sim'}})}
    /* obra renomeada ou com alias novo: apaga o nome antigo da lista do Recebimento (se nenhuma linha usa) para não duplicar */
    if(nomeObra&&ob)(D.painel_obras||[]).forEach(x=>{if(limpO.has(x.id)||NN(x.nome)===NN(nomeObra)||obraDe(x.nome)!==ob)return;
      if((D.painel_pedidos||[]).some(r=>NN(r.obra)===NN(x.nome))||rows.some(r=>NN(r.obra)===NN(x.nome)))return;
      limpO.add(x.id);W.push({op:'del',col:'painel_obras',id:x.id})});
  }
  indexar();

  /* 4) cabeçalho: o lado que mudou desde a última sincronização vence */
  for(const p of peds){
    if(p.__del)continue;
    const rs=rowsDe.get(p.id)||[];if(!rs.length)continue;
    const ss={...(p.recSync||{})};
    const campo=(key,pyGet,rowGet,rowField,setPy,alvo)=>{
      const lista=alvo||rs,st=ss[key]&&typeof ss[key]==='object'?ss[key]:null;
      const push=(v,soVazios)=>lista.forEach(r=>{const cur=String(r[rowField]??'').trim();if(soVazios?!cur:cur!==v){r[rowField]=v;dR.add(r.id)}});
      const pv=pyGet();let rv=rowGet();
      /* edição em andamento: se as linhas ainda divergem entre si e o Pyro não mudou, espera elas se acertarem antes de decidir */
      if(st&&pv===st.p){
        const dk=rs[0]?rs[0].pyPedidoId+'|'+key:'',vals=new Set(lista.map(r=>String(r[rowField]??'').trim()));
        const DS=window.__recDiv||(window.__recDiv=new Map());
        if(vals.size>1&&dk){
          const t0=DS.get(dk)||(DS.set(dk,Date.now()),Date.now());
          if(Date.now()-t0<20000){setTimeout(schedSync,21000);return}
        }else if(dk)DS.delete(dk);
      }
      if(!st){
        if(pv)push(pv,true);else if(rv)setPy(rv);
        ss[key]={p:pyGet(),r:rowGet()};return;
      }
      if(pv!==st.p){if(pv)push(pv,false);ss[key]={p:pv,r:rowGet()};return}
      /* linhas divergentes (edição que não chegou em todas): vence o valor novo (diferente do último sincronizado), aplicado a todas as linhas, para não separar o pedido em dois cards */
      const vs=lista.map(r=>String(r[rowField]??'').trim());
      if(new Set(vs).size>1){
        const novos=vs.filter(v=>v&&v!==String(st.r??''));
        if(novos.length){const cnt={};novos.forEach(v=>cnt[v]=(cnt[v]||0)+1);rv=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]}
        if(rv){push(rv,false);if(rv!==st.r&&rv!==pv)setPy(rv);ss[key]={p:pyGet(),r:rv};return}
      }
      if(rv!==st.r){if(rv)setPy(rv);ss[key]={p:pyGet(),r:rv}}
    };
    const ob=obras.find(x=>x.id===p.obraId);
    const nomeForn=()=>p.fornecedorId?((forns.find(f=>f.id===p.fornecedorId)||{}).nome||''):'';
    campo('obra',()=>recNomeObra(obras.find(x=>x.id===p.obraId)),()=>moda(rs.map(r=>r.obra)),'obra',v=>{const o2=obraDe(v);if(!o2||o2.id===p.obraId)return;p.obraId=o2.id;dP.add(p.id)});
    campo('pc',()=>String(p.pc||''),()=>moda(rs.map(r=>r.pedido)),'pedido',v=>{if(!PCK(v)||PCK(v)===PCK(p.pc))return;p.pc=v;dP.add(p.id)});
    campo('cat',()=>REC_CAT[p.categoria]||'',()=>moda(rs.map(r=>r.categoria)),'categoria',v=>{const c=catDeRec(v);if(c===p.categoria)return;p.categoria=c;dP.add(p.id)});
    campo('forn',nomeForn,()=>moda(rs.map(r=>r.fornecedor)),'fornecedor',v=>{const f=fornNovo(v,p.categoria);if(!f||f.id===p.fornecedorId)return;p.fornecedorId=f.id;dP.add(p.id)});
    campo('erp',()=>{const m=String(p.erpPedido||'').trim();return /[,;]/.test(m)?'':m},()=>moda(rs.map(r=>r.codigoErp)),'codigoErp',v=>{if(String(p.erpPedido||'').split(/[,;\s]+/).includes(v))return;p.erpPedido=v;p.semErp=false;dP.add(p.id)});
    let e=entDe(p.id);
    const pend=rs.filter(r=>!rowDone(r));
    const prevRows=()=>pend.map(r=>r.previsaoChegada).filter(Boolean).sort()[0]||'';
    if(!e&&p.status==='comprado'){e={id:'rce_'+p.id,pedidoId:p.id,tipo:'entrega',status:'producao',dataPrevista:prevRows(),reagend:[],criadoEm:now};ents.push(e);dE.add(e.id)}
    if(e&&e.status!=='recebido'){
      campo('prev',()=>e.dataPrevista||'',prevRows,'previsaoChegada',v=>{
        if(e.dataPrevista===v)return;
        if(e.dataPrevista)e.reagend=[...(e.reagend||[]),{de:e.dataPrevista,para:v,motivo:'Alterado no Recebimento',obs:'',em:t}];
        e.dataPrevista=v;dE.add(e.id)},pend);
    }
    if(stab(ss)!==stab(p.recSync||{})){p.recSync=ss;dP.add(p.id)}

    /* 5) totais e situação */
    const n=(p.itens||[]).length,rec=(p.itens||[]).filter(i=>+i.qtd>0&&+i.rec>=+i.qtd).length;
    if(p.itensTotal!==n){p.itensTotal=n;dP.add(p.id)}
    if(p.itensRecebidos!==rec){p.itensRecebidos=rec;dP.add(p.id)}
    const soma=r2(rs.reduce((a,r)=>a+(+r.valorPedido||0),0));
    if(!(+p.valor)&&soma>0){p.valor=soma;dP.add(p.id)}
    if(p.origem==='recebimento'&&(!p.item||AUTO_NOME.test(p.item))&&p.item!==autoNome(p,n)){p.item=autoNome(p,n);dP.add(p.id)}
    else if(n&&/\(\d+ ite(ns|m)\)$/.test(p.item||'')){const nv=p.item.replace(/\(\d+ ite(ns|m)\)$/,`(${n} ite${n===1?'m':'ns'})`);if(nv!==p.item){p.item=nv;dP.add(p.id)}}
    const todos=rs.every(rowDone);
    const recs=rs.flatMap(r=>r.recebimentos||[]).filter(x=>x.data||x.nf).sort((a,b)=>(a.data||'')<(b.data||'')?-1:1);
    if(todos&&p.status==='comprado'){
      p.status='recebido';dP.add(p.id);
      const ult=recs[recs.length-1]||{};
      if(!e){e={id:'rce_'+p.id,pedidoId:p.id,tipo:'entrega',reagend:[],criadoEm:now};ents.push(e)}
      Object.assign(e,{status:'recebido',parcial:false,pctRec:100,dataChegada:ult.data||e.dataChegada||t,nf:ult.nf||e.nf||''});dE.add(e.id);
    }else if(todos&&p.status==='recebido'&&e&&e.status!=='recebido'){
      const ult=recs[recs.length-1]||{};
      Object.assign(e,{status:'recebido',parcial:false,pctRec:100,dataChegada:e.dataChegada||ult.data||t,nf:e.nf||ult.nf||''});dE.add(e.id);
    }else if(e&&e.status!=='recebido'&&!(e.recebimentos||[]).length){
      const qt=rs.reduce((a,r)=>a+(+r.qtdePedida||0),0),qr=rs.reduce((a,r)=>a+Math.min(rowQtdRec(r),+r.qtdePedida||0),0);
      const pc=qt?Math.round(qr/qt*100):0,parcial=pc>0,pct=parcial?Math.min(99,Math.max(1,pc)):0;
      if(!!e.parcial!==parcial||(parcial&&e.pctRec!==pct)){e.parcial=parcial;e.pctRec=pct;dE.add(e.id)}
    }

    /* 6) notas das linhas viram notas fiscais (sem duplicar as que já existem) */
    const porNF=new Map();
    rs.forEach(r=>(r.recebimentos||[]).forEach(x=>{if(!NFOK(x.nf))return;const k=NN(x.nf);const g=porNF.get(k)||{nf:String(x.nf).trim(),valor:0,data:''};g.valor+=+x.valor||0;if((x.data||'')>g.data)g.data=x.data||'';porNF.set(k,g)}));
    for(const [k,g] of porNF){
      const id='rcn_'+hsh(p.id+'|'+k);
      const ex=nfs.find(n=>n.id===id)||nfs.find(n=>NN(n.numero)===k&&(n.pedidoId===p.id||(p.fornecedorId&&n.fornecedorId===p.fornecedorId)||(!n.fornecedorId&&n.obraId===p.obraId)));
      if(ex&&ex.id!==id)continue;
      const obj={...(ex||{id,status:'recebida',createdAt:now,origem:'recebimento',romaneio:'',vencimento:''}),numero:g.nf,pedidoId:p.id,obraId:p.obraId,fornecedorId:p.fornecedorId||'',valor:r2(g.valor),chegada:g.data||(ex&&ex.chegada)||t};
      if(!ex||stab(obj)!==stab(ex))W.push({op:'put',col:'nfs',obj});
    }
    /* nota gerada pelo Recebimento cujo número sumiu das linhas (corrigido ou apagado): remove se ninguém mexeu nela */
    nfs.filter(n=>n.pedidoId===p.id&&String(n.id).startsWith('rcn_')&&n.origem==='recebimento'&&!porNF.has(NN(n.numero))&&n.id==='rcn_'+hsh(p.id+'|'+NN(n.numero))
      &&n.status==='recebida'&&!n.vencimento&&!n.envio&&!(n.anexos||[]).length&&!(n.boletos||[]).length&&!n.obs)
      .forEach(n=>W.push({op:'del',col:'nfs',id:n.id}));
  }

  for(const id of dP){const p=pById.get(id);if(p&&!p.__del){const {__del,...c}=p;W.push({op:'put',col:'pedidos',obj:{...c,updatedAt:c.updatedAt||now}})}}
  for(const id of dR){const r=rows.find(x=>x.id===id);if(r)W.push({op:'put',col:'painel_pedidos',obj:r})}
  for(const id of dE){const e=ents.find(x=>x.id===id);if(e)W.push({op:'put',col:'entregas',obj:e})}
  W.info=info;return W;
}

  iss.push({k:'ent-orfa',t:'Entregas sem pedido',n:a.length,fix:a.length?'Excluir entregas órfãs':''});
  iss.push({k:'ped-sem-obra',t:'Pedidos ligados a obra inexistente',n:b.length,fix:''});

/* --- planilha Excel no pedido --- */
let XLSXP=null;
async function lerExcel(file){
  if(!window.XLSX){if(!XLSXP)XLSXP=loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');await XLSXP}
  return window.XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:'array',cellDates:true});
}
function abaParaTexto(ws){
  return rowsParaTexto(window.XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}));
}
let PDFP=null;
async function lerPdfLinhas(file){
  if(!window.pdfjsLib){if(!PDFP)PDFP=loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');await PDFP;window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
  const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,rows=[];
  for(let pn=1;pn<=pdf.numPages;pn++){
    const tc=await (await pdf.getPage(pn)).getTextContent(),its=tc.items.filter(i=>String(i.str).trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width}));
    its.sort((a,b)=>b.y-a.y||a.x-b.x);
    const lines=[];for(const i of its){const l=lines.find(L=>Math.abs(L.y-i.y)<3);if(l)l.it.push(i);else lines.push({y:i.y,it:[i]})}
    lines.sort((a,b)=>b.y-a.y);
    for(const L of lines){L.it.sort((a,b)=>a.x-b.x);const cells=[];let end=null;
      for(const i of L.it){if(end!==null&&i.x-end<=5&&cells.length)cells[cells.length-1]+=(i.x-end>0.8?' ':'')+i.s;else cells.push(i.s);end=i.x+i.w}
      rows.push(cells.map(c=>c.trim()))}
  }
  return rows;
}
function rowsParaTexto(rows){
  const role=c=>/^(cod|codigo|ref|referencia|sku)/.test(c)?'cod':/^(desc|produto|material|nome do item|item$)/.test(c)?'desc':/^(qt|quant)/.test(c)&&!/receb|saldo|total/.test(c)?'qtd':/^(un|und|unid|unidade|um)\.?$/.test(c)?'un':/valor.*total|total/.test(c)&&!/qnt|qtd|peso/.test(c)?'total':/(unit|preco)/.test(c)?'vunit':'';
  let hi=-1,map=null;
  for(let i=0;i<Math.min(rows.length,25);i++){const rs=rows[i].map(c=>role(fold(String(c))));if(rs.includes('qtd')&&(rs.includes('cod')||rs.includes('desc'))){hi=i;map={};rs.forEach((r,j)=>{if(r&&map[r]===undefined)map[r]=j});break}}

function splitLinha(l,sep){

  const out=[];let cur='',q=false;
  for(let i=0;i<l.length;i++){const c=l[i];
    if(q){if(c==='"'&&l[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}
    else if(c==='"')q=true;else if(c===sep){out.push(cur);cur=''}else cur+=c}
  out.push(cur);return out;
}

  const role=c=>/^(cod|codigo|cód|ref|referencia|sku)/.test(c)?'cod':/^(desc|produto|material|nome)/.test(c)?'desc':/^(qt|quant)/.test(c)?'qtd':/^(un|und|unid|unidade|um)\.?$/.test(c)?'un':/total/.test(c)?'total':/(unit|preco|vl|valor)/.test(c)?'vunit':'';

  for(const r of rows){
    let cod='',desc='',qtd='',un='',vu='',tot='';
    if(map){cod=r[map.cod]??'';desc=r[map.desc]??'';qtd=r[map.qtd]??'';un=r[map.un]??'';vu=r[map.vunit]??'';tot=r[map.total]??''}

      if(n===1)desc=r[0];
      else if(n===2){if(isNum(r[1])){desc=r[0];qtd=r[1]}else{cod=r[0];desc=r[1]}}
      else{cod=r[0];desc=r[1];qtd=r[2];
        if(n>=4){if(isNum(r[3])){vu=r[3];tot=r[4]||''}else{un=r[3];vu=r[4]||'';tot=r[5]||''}}}}
